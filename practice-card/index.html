<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>練字卡修改工具｜教學設計工具箱</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F5; --panel:#FFFFFF; --ink:#23262D; --muted:#5E6673;
  --rule:#D5DBE2; --accent:#2F6E9E; --accent-soft:#E3EEF7;
  --pink:#E2729B; --pink-soft:#FBE7EF; --danger:#B4423C;
  --canvas-bg:#C9D2DB;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1F25; --panel:#252A32; --ink:#E7EAEE; --muted:#A3ABB7;
    --rule:#3A414C; --accent:#7FB2DD; --accent-soft:#2C3B4A;
    --pink:#F09BBB; --pink-soft:#3D2A33; --danger:#E5847E;
    --canvas-bg:#14171C; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1F25; --panel:#252A32; --ink:#E7EAEE; --muted:#A3ABB7;
  --rule:#3A414C; --accent:#7FB2DD; --accent-soft:#2C3B4A;
  --pink:#F09BBB; --pink-soft:#3D2A33; --danger:#E5847E;
  --canvas-bg:#14171C; color-scheme: dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  font-size:15px; line-height:1.55;
  display:flex; flex-direction:column;
}
header{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--rule);
}
header h1{font-size:19px; font-weight:700; margin:0 12px 0 0; letter-spacing:.02em}
header h1 span{color:var(--pink)}
header .spacer{flex:1}
button,.btn{
  font:inherit; font-size:14px; border:1px solid var(--rule); background:var(--panel); color:var(--ink);
  padding:7px 13px; border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
}
button:hover:not(:disabled),.btn:hover{border-color:var(--accent)}
button:focus-visible,.btn:focus-within,input:focus-visible,a.home:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
a.home{color:var(--muted); text-decoration:none; font-size:13px; font-weight:500; white-space:nowrap}
a.home:hover{color:var(--accent)}
button:disabled{opacity:.45; cursor:not-allowed}
button.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
:root[data-theme="dark"] button.primary{color:#13202B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#13202B}}
.btn input{display:none}
main{flex:1; display:flex; min-height:0}
aside{
  width:250px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--rule);
  padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:18px;
}
aside h2{font-size:13px; font-weight:700; color:var(--muted); margin:0 0 8px}
.tools{display:grid; gap:6px}
.tool{
  justify-content:flex-start; text-align:left; width:100%; padding:9px 11px; flex-direction:column; align-items:flex-start; gap:1px;
}
.tool b{font-weight:500}
.tool small{color:var(--muted); font-size:12px; line-height:1.4}
.tool[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent)}
.tool[aria-pressed="true"] b{color:var(--accent)}
.row{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
label.check{display:flex; gap:8px; align-items:flex-start; font-size:14px; cursor:pointer}
label.check input{margin-top:4px; accent-color:var(--accent)}
input[type=range]{width:100%; accent-color:var(--pink)}
.hint{font-size:12.5px; color:var(--muted); margin:6px 0 0}
#stage{
  flex:1; overflow:auto; background:var(--canvas-bg); position:relative;
  display:flex; align-items:flex-start; justify-content:center; padding:24px;
}
#wrap{position:relative; box-shadow:0 2px 14px rgba(0,0,0,.18); background:#fff; line-height:0}
#wrap canvas{display:block}
#overlay{position:absolute; left:0; top:0; pointer-events:none}
#work{touch-action:none; cursor:none}
#empty{
  margin:auto; max-width:460px; text-align:center; background:var(--panel); border:2px dashed var(--rule);
  border-radius:14px; padding:36px 28px; color:var(--muted);
}
#empty.drag{border-color:var(--pink); background:var(--pink-soft)}
#empty .big{font-size:42px; line-height:1; margin-bottom:12px}
#empty p{margin:6px 0}
#empty strong{color:var(--ink)}
.zoom{position:sticky; top:0; align-self:flex-start; margin-right:12px; display:flex; flex-direction:column; gap:6px; z-index:3}
.zoom button{padding:6px 10px; min-width:44px; justify-content:center}
#toast{
  position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--panel); padding:8px 16px; border-radius:20px; font-size:14px;
  opacity:0; transition:opacity .2s; pointer-events:none; z-index:20;
}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
@media (max-width:760px){
  main{flex-direction:column}
  aside{width:auto; border-right:0; border-bottom:1px solid var(--rule); max-height:44vh}
  .tools{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header>
  <a class="home" href="../">← 工具箱</a>
  <h1>練字卡<span>修改</span>工具</h1>
  <label class="btn primary" title="也可以直接把圖片拖進來，或按 Ctrl+V 貼上">
    開啟圖片<input type="file" id="file" accept="image/*">
  </label>
  <button id="undo" disabled title="Ctrl+Z">復原</button>
  <button id="redo" disabled title="Ctrl+Y">重做</button>
  <div class="spacer"></div>
  <button id="reset" disabled>回到自動整理後</button>
  <button id="print" disabled>列印</button>
  <button id="download" class="primary" disabled>下載圖片</button>
</header>

<main>
  <aside>
    <section>
      <h2>修改工具</h2>
      <div class="tools" role="group" aria-label="修改工具">
        <button class="tool" data-tool="brush" aria-pressed="true">
          <b>筆畫擦除（B）</b><small>沿著筆畫拖曳。用來刪最後一畫。</small>
        </button>
        <button class="tool" data-tool="rect" aria-pressed="false">
          <b>框選擦除（R）</b><small>拉一個框。用來去部首、去部件。</small>
        </button>
        <button class="tool" data-tool="cell" aria-pressed="false">
          <b>整格清空（C）</b><small>點一下字格。獨體字讓學生自己寫。</small>
        </button>
        <button class="tool" data-tool="restore" aria-pressed="false">
          <b>修復筆刷（F）</b><small>把擦過頭的地方畫回來，例如交叉的筆畫。</small>
        </button>
      </div>
    </section>

    <section>
      <h2>筆刷大小：<span id="sizeVal">7</span></h2>
      <input type="range" id="size" min="2" max="20" value="7" aria-label="筆刷大小">
      <p class="hint">游標的圓圈就是擦除範圍。可以先放大畫面再擦，比較準。</p>
    </section>

    <section>
      <label class="check"><input type="checkbox" id="inkOnly" checked>
        <span>只擦筆畫，保留米字格虛線和框線</span></label>
    </section>

    <section>
      <h2>開圖時自動整理</h2>
      <label class="check"><input type="checkbox" id="optNums" checked><span>去掉藍色筆順數字</span></label>
      <label class="check" style="margin-top:6px"><input type="checkbox" id="optBox" checked><span>右邊格子只留注音（白底、置中）</span></label>
      <button id="reclean" style="margin-top:10px" disabled>用目前選項重新整理</button>
      <p class="hint">重新整理會清掉手動修改。</p>
    </section>
  </aside>

  <div id="stage">
    <div class="zoom" id="zoomBar" hidden>
      <button id="zin" title="放大">＋</button>
      <button id="zout" title="縮小">－</button>
      <button id="zfit" title="符合視窗">符合</button>
    </div>
    <div id="empty">
      <div class="big">✎</div>
      <p><strong>把練字卡截圖拖到這裡</strong></p>
      <p>或按上方「開啟圖片」，也可以直接 Ctrl+V 貼上截圖。</p>
      <p class="hint">開圖後會自動去掉筆順數字、整理右邊注音格，接著用左邊工具修改。</p>
    </div>
    <div id="wrap" hidden>
      <canvas id="work"></canvas>
      <canvas id="overlay"></canvas>
    </div>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const work = $('work'), ov = $('overlay');
  const wctx = work.getContext('2d', { willReadFrequently: true });
  const octx = ov.getContext('2d');
  let W = 0, H = 0;
  let orig = null;   // ImageData: the image as opened
  let base = null;   // ImageData: after auto clean (restore source)
  let cur = null;    // ImageData: being edited
  let cells = [];    // character areas {x0,y0,x1,y1}
  let tool = 'brush', size = 7, zoom = 1, fileName = '練字卡';
  const undoStack = [], redoStack = [];
  const MAXH = 25;

  // ---------- helpers ----------
  const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); };
  const isYellow = (r,g,b) => r > 240 && g > 235 && b < 200;
  const isGreenish = (r,g,b) => g > r + 6 && g > b;
  const isBlueish = (r,g,b) => b > 225 && r < 220;
  const isPink = (r,g,b) => r > 180 && r - g > 22;
  // "ink" = stroke pink, dark dashed arrows, leftover blue numbers. Light guide lines and borders are not ink.
  function isInk(d, i){
    const r = d[i], g = d[i+1], b = d[i+2];
    if (r - g > 12 && r > 120) return true;
    if (Math.abs(r-g) < 16 && Math.abs(g-b) < 16 && r < 175) return true;
    if (b - r > 30 && g > r) return true;
    return false;
  }
  const copyImg = im => new ImageData(new Uint8ClampedArray(im.data), im.width, im.height);

  // ---------- auto clean ----------
  function autoClean(src, optNums, optBox){
    const out = copyImg(src), d = out.data, s = src.data;
    const idx = (x,y) => (y*W + x) * 4;
    const boxes = [];
    // 1. find yellow regions (zhuyin area of each side box)
    const yel = new Uint8Array(W*H);
    for (let y=0;y<H;y++) for (let x=0;x<W;x++){ const i=idx(x,y); if (isYellow(s[i],s[i+1],s[i+2])) yel[y*W+x]=1; }
    const seen = new Uint8Array(W*H), stack = [];
    for (let p=0;p<W*H;p++){
      if (!yel[p] || seen[p]) continue;
      let x0=W,y0=H,x1=0,y1=0,n=0; stack.push(p); seen[p]=1;
      while(stack.length){
        const q=stack.pop(), x=q%W, y=(q-x)/W; n++;
        if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
        const nb=[q-1,q+1,q-W,q+W];
        for(const t of nb){ if(t<0||t>=W*H) continue; if(Math.abs((t%W)-x)>1) continue; if(yel[t]&&!seen[t]){seen[t]=1;stack.push(t);} }
      }
      const w=x1-x0+1, h=y1-y0+1;
      if (w>=25 && h>=30 && n > w*h*0.45) boxes.push({x0,y0,x1,y1,h});
    }
    // 2. extend each box down through the blue / green rows
    for (const bx of boxes){
      let bottom = bx.y1, miss = 0;
      const lim = Math.min(H-1, bx.y1 + Math.round(bx.h*2.6));
      for (let y=bx.y1+1; y<=lim; y++){
        let cnt=0, tot=0, gray=0;
        for (let x=bx.x0+2; x<=bx.x1-2; x++){ const i=idx(x,y); tot++; const r=s[i],g=s[i+1],b=s[i+2];
          if (isGreenish(r,g,b) || isBlueish(r,g,b)) cnt++;
          if (Math.max(r,g,b) < 212 && Math.max(r,g,b)-Math.min(r,g,b) < 22) gray++; }
        if (gray > tot*0.6 && bottom > bx.y1 + bx.h*0.5) break;   // reached the cell's bottom border
        if (cnt > tot*0.25){ bottom=y; miss=0; } else if (++miss > 6 && bottom > bx.y1) break;
      }
      bx.bottom = bottom;
    }
    // 3. side box: keep only zhuyin, white background, centered
    if (optBox){
      for (const bx of boxes){
        // average yellow colour
        let yr=0,yg=0,yb=0,c=0;
        for (let y=bx.y0;y<=bx.y1;y++) for (let x=bx.x0;x<=bx.x1;x++){ const i=idx(x,y); if (isYellow(s[i],s[i+1],s[i+2])){yr+=s[i];yg+=s[i+1];yb+=s[i+2];c++;} }
        yr/=c; yg/=c; yb/=c;
        let zx0=W,zy0=H,zx1=-1,zy1=-1;
        for (let y=bx.y0;y<=bx.y1;y++) for (let x=bx.x0;x<=bx.x1;x++){
          const i=idx(x,y); const dd=Math.abs(s[i]-yr)+Math.abs(s[i+1]-yg)+Math.abs(s[i+2]-yb);
          if (dd>60){ if(x<zx0)zx0=x; if(x>zx1)zx1=x; if(y<zy0)zy0=y; if(y>zy1)zy1=y; }
        }
        const zw=zx1-zx0+1, zh=zy1-zy0+1;
        const crop = [];
        if (zx1>=0) for (let y=0;y<zh;y++) for (let x=0;x<zw;x++){ const i=idx(zx0+x,zy0+y); crop.push(s[i]); }
        for (let y=bx.y0;y<=bx.bottom;y++) for (let x=bx.x0;x<=bx.x1;x++){ const i=idx(x,y); d[i]=d[i+1]=d[i+2]=255; d[i+3]=255; }
        if (zx1>=0){
          const cy=Math.round((bx.y0+bx.bottom)/2 - zh/2), cx=Math.round((bx.x0+bx.x1)/2 - zw/2);
          for (let y=0;y<zh;y++) for (let x=0;x<zw;x++){ const v=crop[y*zw+x]; const i=idx(cx+x,cy+y); d[i]=d[i+1]=d[i+2]=v; }
        }
      }
    }
    // 4. blue stroke-order numbers (outside the side boxes)
    if (optNums){
      const inBox = new Uint8Array(W*H);
      for (const bx of boxes) for (let y=Math.max(0,bx.y0-3);y<=Math.min(H-1,bx.bottom+3);y++) for (let x=Math.max(0,bx.x0-3);x<=Math.min(W-1,bx.x1+3);x++) inBox[y*W+x]=1;
      const blue = new Uint8Array(W*H);
      for (let y=0;y<H;y++) for (let x=0;x<W;x++){ const p=y*W+x; if(inBox[p]) continue; const i=p*4; if (d[i+2]-d[i]>30 && d[i+1]>d[i]) blue[p]=1; }
      for (let y=1;y<H-1;y++) for (let x=1;x<W-1;x++){
        const p=y*W+x; if (inBox[p]) continue;
        let hit=blue[p];
        if(!hit) for(let dy=-1;dy<=1&&!hit;dy++) for(let dx=-1;dx<=1;dx++) if(blue[p+dy*W+dx]){hit=1;break;}
        if (!hit) continue;
        const i=p*4; if (isPink(d[i],d[i+1],d[i+2])) continue;
        d[i]=d[i+1]=d[i+2]=255;
      }
    }
    // 5. character cells: from each box, scan left for the cell border
    const found = [];
    const isBorderCol = x => {
      let hits=0, n=0;
      for (let k=0;k<20;k++){ const y=Math.round(bx_.y0 + (bx_.bottom-bx_.y0)*(k+0.5)/20); const i=idx(x,y); n++;
        const r=s[i],g=s[i+1],b=s[i+2]; if (Math.abs(r-g)<14 && Math.abs(g-b)<14 && r<215) hits++; }
      return hits >= n*0.85;
    };
    let bx_;
    for (const bx of boxes){
      bx_ = bx; let left = 0;
      for (let x=bx.x0-6; x>=0; x--){ if (isBorderCol(x)){ left=x; break; } }
      found.push({x0:left+2, y0:bx.y0, x1:bx.x0-3, y1:bx.bottom});
    }
    return { img: out, cells: found, boxes: boxes.length };
  }

  // ---------- loading ----------
  function loadFile(file){
    if (!file || !file.type.startsWith('image/')) { toast('請選擇圖片檔'); return; }
    fileName = (file.name || '練字卡').replace(/\.[^.]+$/, '') || '練字卡';
    const img = new Image();
    img.onload = () => {
      W = img.naturalWidth; H = img.naturalHeight;
      work.width = ov.width = W; work.height = ov.height = H;
      wctx.drawImage(img, 0, 0);
      orig = wctx.getImageData(0, 0, W, H);
      runClean(true);
      $('empty').hidden = true; $('wrap').hidden = false; $('zoomBar').hidden = false;
      ['reset','print','download','reclean'].forEach(id => $(id).disabled = false);
      fitZoom();
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => toast('這個檔案打不開，請換一張圖片');
    img.src = URL.createObjectURL(file);
  }
  function runClean(first){
    const r = autoClean(orig, $('optNums').checked, $('optBox').checked);
    base = r.img; cells = r.cells; cur = copyImg(base);
    undoStack.length = 0; redoStack.length = 0; syncHistory();
    wctx.putImageData(cur, 0, 0);
    toast(r.boxes ? `已整理，找到 ${r.boxes} 個字格` : '已開啟。沒有找到注音格，「整格清空」無法使用');
  }

  // ---------- history ----------
  function pushHistory(){ undoStack.push(copyImg(cur)); if (undoStack.length>MAXH) undoStack.shift(); redoStack.length=0; syncHistory(); }
  function syncHistory(){ $('undo').disabled = !undoStack.length; $('redo').disabled = !redoStack.length; }
  function undo(){ if(!undoStack.length) return; redoStack.push(cur); cur = undoStack.pop(); wctx.putImageData(cur,0,0); syncHistory(); }
  function redo(){ if(!redoStack.length) return; undoStack.push(cur); cur = redoStack.pop(); wctx.putImageData(cur,0,0); syncHistory(); }

  // ---------- editing ops ----------
  function paintSegment(ax, ay, bx, by, r, restore){
    const d = cur.data, bd = base.data, inkOnly = $('inkOnly').checked;
    const x0=Math.max(0,Math.floor(Math.min(ax,bx)-r)), x1=Math.min(W-1,Math.ceil(Math.max(ax,bx)+r));
    const y0=Math.max(0,Math.floor(Math.min(ay,by)-r)), y1=Math.min(H-1,Math.ceil(Math.max(ay,by)+r));
    const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy, r2=r*r;
    for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
      let t = L2 ? ((x-ax)*dx+(y-ay)*dy)/L2 : 0; t = t<0?0:t>1?1:t;
      const ex=x-ax-t*dx, ey=y-ay-t*dy; if (ex*ex+ey*ey > r2) continue;
      const i=(y*W+x)*4;
      if (restore){ d[i]=bd[i]; d[i+1]=bd[i+1]; d[i+2]=bd[i+2]; }
      else if (!inkOnly || isInk(d,i)){ d[i]=d[i+1]=d[i+2]=255; }
    }
    wctx.putImageData(cur, 0, 0, x0, y0, x1-x0+1, y1-y0+1);
  }
  function eraseRect(x0,y0,x1,y1, forceInk){
    const d=cur.data, inkOnly = forceInk || $('inkOnly').checked;
    x0=Math.max(0,Math.round(x0)); y0=Math.max(0,Math.round(y0)); x1=Math.min(W-1,Math.round(x1)); y1=Math.min(H-1,Math.round(y1));
    for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){ const i=(y*W+x)*4; if (!inkOnly || isInk(d,i)) d[i]=d[i+1]=d[i+2]=255; }
    wctx.putImageData(cur, 0, 0, x0, y0, x1-x0+1, y1-y0+1);
  }

  // ---------- pointer ----------
  let down = false, last = null, start = null;
  const pos = e => { const b = work.getBoundingClientRect(); return { x:(e.clientX-b.left)*W/b.width, y:(e.clientY-b.top)*H/b.height }; };
  function drawOverlay(p){
    octx.clearRect(0,0,W,H);
    if (!p) return;
    octx.lineWidth = Math.max(1, 1.5/zoom);
    if (tool==='rect' && down && start){
      octx.fillStyle='rgba(226,114,155,.15)'; octx.strokeStyle='#E2729B';
      const x=Math.min(start.x,p.x), y=Math.min(start.y,p.y), w=Math.abs(p.x-start.x), h=Math.abs(p.y-start.y);
      octx.fillRect(x,y,w,h); octx.strokeRect(x,y,w,h);
    } else if (tool==='brush' || tool==='restore'){
      octx.strokeStyle = tool==='brush' ? '#2F6E9E' : '#2E9E5B';
      octx.beginPath(); octx.arc(p.x,p.y,size,0,Math.PI*2); octx.stroke();
    } else {
      const c = cellAt(p);
      octx.strokeStyle='#2F6E9E';
      if (tool==='cell' && c){ octx.fillStyle='rgba(47,110,158,.10)'; octx.fillRect(c.x0,c.y0,c.x1-c.x0,c.y1-c.y0); octx.strokeRect(c.x0,c.y0,c.x1-c.x0,c.y1-c.y0); }
      octx.beginPath(); octx.moveTo(p.x-6,p.y); octx.lineTo(p.x+6,p.y); octx.moveTo(p.x,p.y-6); octx.lineTo(p.x,p.y+6); octx.stroke();
    }
  }
  const cellAt = p => cells.find(c => p.x>=c.x0 && p.x<=c.x1 && p.y>=c.y0 && p.y<=c.y1);
  work.addEventListener('pointerdown', e => {
    if (!cur) return; work.setPointerCapture(e.pointerId);
    const p = pos(e);
    if (tool==='cell'){
      const c = cellAt(p); if (!c){ toast('這裡不是字格'); return; }
      pushHistory(); eraseRect(c.x0, c.y0+2, c.x1, c.y1-2, true); toast('已清空這一格'); return;
    }
    pushHistory(); down = true; last = p; start = p;
    if (tool==='brush' || tool==='restore') paintSegment(p.x,p.y,p.x,p.y,size,tool==='restore');
    drawOverlay(p);
  });
  work.addEventListener('pointermove', e => {
    if (!cur) return; const p = pos(e);
    if (down && (tool==='brush' || tool==='restore')){ paintSegment(last.x,last.y,p.x,p.y,size,tool==='restore'); last = p; }
    drawOverlay(p);
  });
  const end = e => {
    if (!down) return; down = false;
    const p = pos(e);
    if (tool==='rect' && start){
      if (Math.abs(p.x-start.x)<2 || Math.abs(p.y-start.y)<2){ undoStack.pop(); syncHistory(); }
      else eraseRect(Math.min(start.x,p.x), Math.min(start.y,p.y), Math.max(start.x,p.x), Math.max(start.y,p.y));
    }
    start = null; drawOverlay(p);
  };
  work.addEventListener('pointerup', end);
  work.addEventListener('pointercancel', end);
  work.addEventListener('pointerleave', () => { if (!down) octx.clearRect(0,0,W,H); });

  // ---------- zoom ----------
  function applyZoom(){ const w=Math.round(W*zoom), h=Math.round(H*zoom); for (const c of [work,ov]){ c.style.width=w+'px'; c.style.height=h+'px'; } }
  function fitZoom(){ const st=$('stage'); const avail = st.clientWidth - 110, availH = st.clientHeight - 48; zoom = Math.max(0.25, Math.min(3, avail/W, availH/H)); applyZoom(); }
  $('zin').onclick = () => { zoom = Math.min(6, zoom*1.25); applyZoom(); };
  $('zout').onclick = () => { zoom = Math.max(0.25, zoom/1.25); applyZoom(); };
  $('zfit').onclick = fitZoom;

  // ---------- UI wiring ----------
  function setTool(t){ tool=t; document.querySelectorAll('.tool').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool===t)); octx.clearRect(0,0,W,H); }
  document.querySelectorAll('.tool').forEach(b => b.onclick = () => setTool(b.dataset.tool));
  $('size').oninput = e => { size=+e.target.value; $('sizeVal').textContent=size; };
  $('file').onchange = e => loadFile(e.target.files[0]);
  $('undo').onclick = undo; $('redo').onclick = redo;
  $('reset').onclick = () => { if(!base) return; pushHistory(); cur = copyImg(base); wctx.putImageData(cur,0,0); toast('已回到自動整理後的樣子，可按復原取消'); };
  $('reclean').onclick = () => { if (!orig) return; if (undoStack.length && !confirm('重新整理會清掉目前的手動修改，要繼續嗎？')) return; runClean(); };
  $('download').onclick = () => {
    work.toBlob(b => { const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fileName+'_修改.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000); toast('已下載'); }, 'image/png');
  };
  $('print').onclick = () => {
    const url = work.toDataURL('image/png');
    const w = window.open('', '_blank'); if (!w){ toast('瀏覽器擋住了列印視窗，請允許彈出視窗'); return; }
    w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${fileName}</title><style>@page{size:A4;margin:10mm}html,body{margin:0}img{width:100%;height:auto;display:block}</style></head><body><img src="${url}" onload="setTimeout(()=>{window.print()},200)"></body></html>`);
    w.document.close();
  };
  document.addEventListener('keydown', e => {
    if (e.target.tagName==='INPUT') return;
    const k = e.key.toLowerCase();
    if ((e.ctrlKey||e.metaKey) && k==='z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
    if ((e.ctrlKey||e.metaKey) && (k==='y' || (k==='z' && e.shiftKey))){ e.preventDefault(); redo(); return; }
    if (e.ctrlKey||e.metaKey||e.altKey) return;
    if (k==='b') setTool('brush'); else if (k==='r') setTool('rect'); else if (k==='c') setTool('cell'); else if (k==='f') setTool('restore');
    else if (k==='[') { $('size').value = size = Math.max(2,size-1); $('sizeVal').textContent=size; }
    else if (k===']') { $('size').value = size = Math.min(20,size+1); $('sizeVal').textContent=size; }
  });
  // drag & drop and paste
  const stage = $('stage'), empty = $('empty');
  stage.addEventListener('dragover', e => { e.preventDefault(); empty.classList.add('drag'); });
  stage.addEventListener('dragleave', () => empty.classList.remove('drag'));
  stage.addEventListener('drop', e => { e.preventDefault(); empty.classList.remove('drag'); loadFile(e.dataTransfer.files[0]); });
  window.addEventListener('paste', e => { const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/')); if (it) loadFile(it.getAsFile()); });
  window.addEventListener('resize', () => { if (cur) drawOverlay(null); });
})();
</script>
</body>
</html>
