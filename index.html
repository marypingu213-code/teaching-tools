<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教學設計工具箱</title>
  <meta name="description" content="給臺灣特教老師的備課小工具。第一個工具是分層學習單產生器。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="./">
        <span class="seal" aria-hidden="true">箱</span>
        <span>教學設計工具箱</span>
      </a>
      <p class="header-note">特教備課用的小工具</p>
    </div>
  </header>
  <main>
    <div class="wrap">
      <section class="hero">
        <p class="eyebrow">特教備課</p>
        <h1>教學設計工具箱</h1>
        <p class="lede">給臺灣特教老師的小工具。課文、學習單，一次做一件事；以後還可以繼續加進來。</p>
      </section>
      <section aria-labelledby="tools-heading">
        <div class="section-row">
          <h2 id="tools-heading">工具</h2>
          <p id="tool-count" class="muted"></p>
        </div>
        <div id="tool-list" class="tool-list"></div>
      </section>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>這是靜態網頁。課文和 API 金鑰不會上傳到這個網站。</p>
    </div>
  </footer>
  <script src="js/tools.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
