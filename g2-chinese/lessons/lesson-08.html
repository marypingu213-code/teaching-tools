<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二上第八課 角和腳｜課文動起來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --bg:#EAEEDD; --panel:#FFFFFF; --ink:#2A2A1F; --soft:#66654F;
  --deer:#B8743A; --leaf:#4A8A3C; --water:#3E8FB0; --gold:#E8A33A; --red:#C8362B;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1B1C14; --panel:#27281D; --ink:#F1F0E6; --soft:#BDBBA4; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--kai);background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:1.2vw;padding:1vh 1.6vw .8vh;flex-wrap:wrap}
h1{margin:0;font-size:4.4vh;color:var(--deer);letter-spacing:.12em;white-space:nowrap}
h1 small{font-size:.5em;color:var(--soft);letter-spacing:.05em;margin-right:.4em}
nav{display:flex;gap:.25vw;flex-wrap:wrap;align-items:center}
nav button{font:inherit;font-size:2.4vh;padding:.5vh .7vw;border-radius:10px;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:.3em}
nav button i{font-style:normal;display:inline-grid;place-items:center;width:2.7vh;height:2.7vh;border-radius:50%;background:var(--deer);color:#fff;font-size:1.7vh}
nav button.on{background:var(--panel);border-color:var(--deer);color:var(--deer);font-weight:700}
nav .sep{color:var(--soft)}
main{display:grid;grid-template-columns:1fr 46vh;gap:1.2vw;padding:0 1.6vw 1.4vh;min-height:0}
.stagewrap{display:grid;grid-template-rows:1fr auto;gap:1vh;min-height:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#DCE7C8;min-height:0}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene>svg{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none;z-index:7}
.acts{display:flex;flex-wrap:wrap;gap:.7vw;min-height:6vh;align-items:center}
.acts button{font:inherit;font-size:2.7vh;padding:.9vh 1.4vw;border-radius:999px;border:3px solid var(--deer);background:var(--panel);color:var(--ink);cursor:pointer}
.acts button:hover{background:var(--deer);color:#fff}
.acts button.main{background:var(--deer);color:#fff;font-weight:700}
.acts .hint{font-size:2.3vh;color:var(--soft)}
button:focus-visible,.v:focus-visible,.ln:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
aside{background:var(--panel);border-radius:20px;padding:1.6vh 1.4vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:1vh;min-height:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh;color:var(--soft)}
.ptitle b{color:var(--deer);font-size:1.15em}
.txt{writing-mode:vertical-rl;font-size:4.5vh;line-height:1.7;letter-spacing:.08em;width:100%;height:100%;min-height:0;overflow:auto;display:block}
.txt.long{font-size:3.5vh}
.ln{cursor:pointer;border-radius:8px;transition:background .3s;padding:.1em 0}
.ln:hover{background:rgba(0,0,0,.05)}
.ln.on{background:#FFE7A8;color:#2A2A1F}
.ln.done{color:var(--soft)}
.guide .ln{cursor:default;display:block;font-size:.85em}
.v{border:2px solid var(--gold);border-radius:6px;cursor:pointer;color:#1F6FA0;padding:.1em 0}
.v.b{border-color:transparent;color:#1F6FA0}
@media (prefers-color-scheme: dark){ .v,.v.b{color:#86C9F0} .ln.on .v{color:#1F6FA0} }
.pnav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.8vh}
.pnav button{font:inherit;font-size:2.6vh;padding:1vh 0;border-radius:12px;border:2px solid var(--soft);background:transparent;color:var(--ink);cursor:pointer}
.pnav .say{background:var(--deer);border-color:var(--deer);color:#fff;font-weight:700}
.pnav button:disabled{opacity:.35}
#pop{position:fixed;left:3vw;bottom:13vh;max-width:48vw;background:#fff;color:#2A2A1F;border:4px solid var(--gold);border-radius:16px;padding:1.4vh 1.6vw;font-size:3.2vh;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:20}
#pop.on{display:block;animation:pop .3s}
#pop h3{margin:0 0 .4vh;color:#9A5A20;font-size:1.3em}
#pop .row{display:flex;gap:1vw;margin-top:.8vh}
#pop button{font:inherit;font-size:.85em;border-radius:10px;border:2px solid #9A5A20;background:#fff;color:#9A5A20;padding:.3vh 1vw;cursor:pointer}

.badge{position:absolute;background:#fff;color:#2A2A1F;border:4px solid var(--deer);border-radius:14px;padding:.6vh 1.2vw;font-size:3.2vh;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.6,1);white-space:nowrap;z-index:8}
.badge.gold{border-color:var(--gold)}.badge.red{border-color:var(--red)}.badge.green{border-color:#2E8B57}
.bubble{position:absolute;background:#fff;color:#2A2A1F;border:4px solid #2A2A1F;border-radius:18px;padding:.8vh 1.2vw;font-size:3vh;line-height:1.5;max-width:46%;animation:pop .3s cubic-bezier(.3,1.6,.6,1);z-index:8}
.bubble b{display:block;font-size:.8em;color:#9A5A20}
.bub{position:absolute;font-size:5.4vh;font-weight:700;color:#fff;-webkit-text-stroke:2px #9A5A20;paint-order:stroke fill;animation:floatup 1.9s ease-out forwards;z-index:8}
@keyframes floatup{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1)}to{transform:translateY(-90px);opacity:0}}
.huge{position:absolute;left:40%;top:30%;transform:translate(-50%,-50%);font-size:12vh;font-weight:700;color:#FFE45C;-webkit-text-stroke:5px #C8362B;paint-order:stroke fill;animation:ahh 1.6s ease-out forwards;white-space:nowrap;z-index:8}
@keyframes ahh{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.lbl{font-family:var(--kai);font-weight:700}

/* scene */
#riverSet,#forestSet{transition:opacity .6s}
#forestSet{opacity:0}
.inforest #forestSet{opacity:1}.inforest #riverSet{opacity:0}
#refl{opacity:0;transition:opacity 1s}.refl #refl{opacity:.45}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 1.6s ease-out infinite}
@keyframes rip{from{transform:scale(.3);opacity:.9}to{transform:scale(1.6);opacity:0}}
#ripples{display:none}.drinkfx #ripples{display:inline}
.dhead{transform-box:view-box;transform-origin:-45px -105px;transition:transform .8s}
.drink .dhead{transform:rotate(-62deg)}
.leg{transform-box:fill-box;transform-origin:50% 0}
.run .leg.a{animation:legA .22s ease-in-out infinite alternate}
.run .leg.b{animation:legB .22s ease-in-out infinite alternate}
.fast .leg.a,.fast .leg.b{animation-duration:.12s}
@keyframes legA{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
@keyframes legB{from{transform:rotate(30deg)}to{transform:rotate(-30deg)}}
.run .dbody{animation:bob .22s ease-in-out infinite alternate}
.fast .dbody{animation-duration:.12s}
@keyframes bob{to{transform:translateY(-8px)}}
.stuck .dbody{animation:tug .3s ease-in-out infinite alternate}
@keyframes tug{from{transform:translateX(0)}to{transform:translateX(10px)}}
.tears{display:none}.cry .tears{display:inline}
.tear{animation:tear 1s ease-in infinite}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(30px);opacity:0}}
.pant .dbody{animation:pant .6s ease-in-out infinite alternate}
@keyframes pant{to{transform:scaleY(1.04)}}
.puff{display:none}.pant .puff{display:inline}
.puffc{animation:puff 1.2s ease-out infinite}
@keyframes puff{from{transform:translate(0,0);opacity:.9}to{transform:translate(-40px,-20px);opacity:0}}
.ant path{transition:stroke .5s}
.glowA .ant path{stroke:#F2B33A;filter:drop-shadow(0 0 6px #FFD23F)}
.badA .ant path{stroke:#C8362B;filter:drop-shadow(0 0 6px #FF6A5A)}
.badL .leg line{stroke:#C8362B}
.goodL .leg line{stroke:#2E8B57;filter:drop-shadow(0 0 5px #6AD38A)}
#tangle{opacity:0;transition:opacity .4s}.tangled #tangle{opacity:1}
.lrun .lleg{animation:legA .2s ease-in-out infinite alternate}
.lrun .lleg.b{animation-name:legB}
.lrun .lbody{animation:bob .2s ease-in-out infinite alternate}
.lleg,.lbody{transform-box:fill-box;transform-origin:50% 0}

/* html pages */
.html{background:linear-gradient(#F3F0E2,#FCFBF6)}
.tl{position:absolute;inset:3%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:auto 1fr;gap:1.2vh 1vw}
.arrowbar{grid-column:1/-1;height:4.4vh;background:linear-gradient(90deg,#9A7A4A,#C9A06A);border-radius:999px;position:relative;display:flex;align-items:center;justify-content:space-around;color:#fff;font-size:2.8vh;font-weight:700}
.arrowbar:after{content:"";position:absolute;right:-2.2vh;top:-1vh;border:3.2vh solid transparent;border-left:3.2vh solid #C9A06A;border-right:0}
.tcard{background:#fff;border-radius:18px;border:4px solid var(--c);padding:1.2vh .9vw;display:flex;flex-direction:column;gap:.8vh;color:#2A2A1F;overflow:auto}
.tcard h4{margin:0;font-size:3.2vh;color:#fff;background:var(--c);border-radius:12px;padding:.3vh .8vw;align-self:flex-start}
.tcard .q{font-size:2.8vh;font-weight:700;line-height:1.4}
.tcard .a{font-size:2.6vh;line-height:1.5;background:#FFF2D6;border-radius:12px;padding:.6vh .7vw;display:none}
.tcard .a.on{display:block;animation:pop .4s}
.tcard .row{display:flex;gap:.5vw;flex-wrap:wrap;margin-top:auto}
.tcard button{font:inherit;font-size:2.3vh;border-radius:999px;border:3px solid var(--c);background:#fff;color:#2A2A1F;padding:.3vh .8vw;cursor:pointer}
.idi{position:absolute;inset:3%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto 1fr;gap:1.2vh 1vw}
.icard{font:inherit;background:#fff;border:4px solid var(--c);border-radius:18px;padding:1vh .6vw;cursor:pointer;color:#2A2A1F;display:flex;flex-direction:column;align-items:center;gap:.4vh}
.icard .em{font-size:6vh;line-height:1}
.icard b{font-size:3.8vh;color:var(--c)}
.icard.on{background:color-mix(in srgb,var(--c) 14%,#fff)}
.idet{grid-column:1/-1;background:#fff;border-radius:18px;padding:2vh 2vw;color:#2A2A1F;font-size:3.1vh;line-height:1.7;overflow:auto}
.idet h3{margin:0 0 .6vh;font-size:4.4vh}
.idet .mean{background:#EEF6E8;border-radius:12px;padding:.8vh 1vw}
.idet .ex{background:#FFF2D6;border-radius:12px;padding:.8vh 1vw;margin-top:1vh}
.idet .lk{background:#FDE7DA;border-radius:12px;padding:.8vh 1vw;margin-top:1vh;font-weight:700;color:#B5481F}
.idet .opts{display:flex;gap:1vw;flex-wrap:wrap;margin-top:1.4vh}
.idet .opts button{font:inherit;font-size:3.2vh;padding:1vh 1.6vw;border-radius:14px;border:3px solid #9A5A20;background:#fff;color:#2A2A1F;cursor:pointer;font-weight:700}
.idet .fb{min-height:4.5vh;margin-top:1.2vh}
.idet .tg{font-size:2.1vh;color:#fff;border-radius:6px;padding:.1vh .6vw;margin-right:.6vw}
.blank{display:inline-block;min-width:6em;border-bottom:4px solid #E8762A;text-align:center;color:#E8762A}
.sp{position:absolute;inset:3%;display:grid;grid-template-columns:1fr 1.1fr;gap:1.4vw;color:#2A2A1F}
.spl,.spr{background:#fff;border-radius:18px;padding:1.4vh 1.2vw;display:flex;flex-direction:column;gap:.8vh;overflow:auto}
.spl h4,.spr h4{margin:0;font-size:3.2vh;color:#9A5A20}
.ex4{display:grid;grid-template-columns:1fr 1fr;gap:.8vh}
.ex4 div{background:#F6F1E4;border-radius:12px;padding:.8vh .6vw;font-size:3vh;text-align:center;cursor:pointer}
.ex4 em,.sent em{font-style:normal;color:#2E8B57;font-weight:700}
.ex4 .a1{color:#C8362B;font-weight:700}.ex4 .a2{color:#2E6FB3;font-weight:700}
.note{font-size:2.6vh;background:#FFF2D6;border-radius:12px;padding:.8vh .8vw;line-height:1.5}
.sent{font-size:2.9vh;line-height:1.5;border-radius:12px;padding:.8vh .8vw;background:#F6F1E4;cursor:pointer}
.slot h5{margin:.3vh 0;font-size:2.5vh;color:#66654F}
.chips{display:flex;flex-wrap:wrap;gap:.6vh}
.chips button{font:inherit;font-size:2.6vh;padding:.4vh 1vw;border-radius:999px;border:3px solid #E8762A;background:#fff;color:#2A2A1F;cursor:pointer}
.chips button.on{background:#E8762A;color:#fff}
.spr input{font:inherit;font-size:2.6vh;padding:.5vh .8vw;border-radius:10px;border:3px solid #C9C2B0;width:100%}
.mysent{font-size:3.8vh;font-weight:700;background:#FFF8E6;border:4px dashed #E8A33A;border-radius:14px;padding:1vh 1vw;line-height:1.5}
.mysent .g{color:#2E8B57}.mysent .bl{color:#B9B2A0}

@media (max-width:820px), (max-aspect-ratio:1/1){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  .stage{height:60vh}
  .txt,.txt.long{writing-mode:horizontal-tb;height:auto;font-size:22px}
  .acts button,.pnav button,nav button{font-size:16px}
  h1{font-size:26px}
  .tl{grid-template-columns:1fr 1fr;overflow:auto}.sp{grid-template-columns:1fr;overflow:auto}
}
a.hall-back{position:fixed;z-index:40;top:0;right:0;font-family:var(--kai);font-size:1.7vh;line-height:1.2;padding:.45vh .8vw;white-space:nowrap;background:var(--panel);color:var(--soft);text-decoration:none;border:1px solid var(--soft);border-top:0;border-right:0;border-bottom-left-radius:12px}a.hall-back:hover,a.hall-back:focus-visible{color:var(--ink)}
</style>
</head>
<body>
<a class="hall-back" href="../">← 回課文大廳</a>
<header>
  <h1><small>二上第八課</small>角和腳</h1>
  <nav id="tabs"></nav>
</header>

<main>
  <div class="stagewrap">
    <div class="stage" id="stage">
      <div class="scene" id="sc-world">
        <svg id="W" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
          <defs><clipPath id="waterClip"><path d="M0,440 L560,440 Q600,500 540,560 L0,560Z"/></clipPath></defs>
          <g id="riverSet">
            <rect width="1000" height="560" fill="#CFE7F2"/>
            <path d="M0,300 Q200,230 420,280 T1000,260 L1000,460 L0,460Z" fill="#A9CF7E"/>
            <g fill="#6E9E5A"><circle cx="90" cy="250" r="40"/><circle cx="140" cy="232" r="34"/><circle cx="880" cy="240" r="46"/><circle cx="940" cy="256" r="34"/></g>
            <rect y="430" width="1000" height="130" fill="#C2D88E"/>
            <path d="M0,440 L560,440 Q600,500 540,560 L0,560Z" fill="#5FA8C8"/>
            <g id="refl" clip-path="url(#waterClip)"><g id="reflDeer" transform="translate(600,444) scale(1,-1)"></g></g>
            <g id="ripples" fill="none" stroke="#fff" stroke-width="3"><ellipse class="rip" cx="510" cy="462" rx="30" ry="8"/><ellipse class="rip" cx="510" cy="462" rx="30" ry="8" style="animation-delay:.8s"/></g>
            <path d="M80,480 q20,-6 40,0 M260,510 q20,-6 40,0 M140,535 q20,-6 40,0" stroke="#BFE6F5" stroke-width="3" fill="none"/>
          </g>
          <g id="forestSet">
            <rect width="1000" height="560" fill="#E8EFD8"/>
            <g id="trees"></g>
            <rect y="455" width="1000" height="105" fill="#C9B98A"/>
            <path d="M360,250 C400,236 440,232 500,228 M420,236 l20,-24 M470,230 l14,22 M390,244 l-12,-20" stroke="#7A5A3A" stroke-width="10" fill="none" stroke-linecap="round"/>
            <g id="tangle" stroke="#5A4A2A" stroke-width="5" stroke-linecap="round"><path d="M372,214 l22,22 M398,206 l-10,30 M360,232 l30,-6"/></g>
          </g>
          <g id="lionPos" transform="translate(1250,455)"><g id="lion"></g></g>
          <g id="deerPos" transform="translate(1150,444)"><g id="deer"></g></g>
        </svg>
      </div>

      <div class="scene html" id="sc-map"><div class="tl" id="tl"></div></div>
      <div class="scene html" id="sc-idiom"><div class="idi" id="idi"></div></div>
      <div class="scene html" id="sc-yy"><div class="sp"><div class="spl" id="yyl"></div><div class="spr" id="yyr"></div></div></div>
      <div class="scene html" id="sc-que"><div class="sp"><div class="spl" id="qul"></div><div class="spr" id="qur"></div></div></div>

      <div id="ov"></div>
    </div>
    <div class="acts" id="acts"></div>
  </div>

  <aside>
    <div class="ptitle"><span id="ptag"></span><b id="pno"></b></div>
    <div class="txt" id="txt"></div>
    <div class="pnav">
      <button id="prev">◀ 上一頁</button>
      <button id="say" class="say">🔊 念給我聽</button>
      <button id="next">下一頁 ▶</button>
    </div>
  </aside>
</main>

<div id="pop"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
let timers=[],raf=[];let autoOn=false;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;}
function stopAll(){timers.forEach(clearTimeout);timers=[];raf.forEach(cancelAnimationFrame);raf=[];autoOn=false;try{speechSynthesis.cancel()}catch(e){};$('#ov').innerHTML='';$('#pop').classList.remove('on');}
function ov(html,style,cls='badge'){const d=document.createElement('div');d.className=cls;d.innerHTML=html;Object.assign(d.style,style||{});$('#ov').appendChild(d);return d;}
function temp(html,style,cls,ms=2000){const d=ov(html,style,cls);setTimeout(()=>d.remove(),ms);return d;}
function say1(html,cls=''){$('#ov').querySelectorAll('.badge').forEach(b=>b.remove());return ov(html,{left:'3%',top:'4%'},'badge '+cls)}
function bubbles(words,area){words.forEach((w,i)=>later(()=>temp(w,{left:(area.x+Math.random()*area.w)+'%',top:(area.y+Math.random()*area.h)+'%'},'bub',1950),i*(area.gap||300)))}
const clean=t=>t.replace(/\[\[|\]\]|\{\{|\}\}/g,'');
function speak(text,onend){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(text));u.lang='zh-TW';u.rate=.72;const v=speechSynthesis.getVoices().find(v=>/zh[-_]TW/i.test(v.lang));if(v)u.voice=v;if(onend)u.onend=onend;speechSynthesis.speak(u);}catch(e){onend&&setTimeout(onend,1500)}}
function bubbleNear(id,who,text,ms=4200){later(()=>{const b=$('#'+id).getBoundingClientRect(),s=$('#stage').getBoundingClientRect();const d=ov(`<b>${who}</b>${text}`,{},'bubble');const W=d.offsetWidth,H=d.offsetHeight;let x=b.left-s.left+b.width/2-W/2,y=b.top-s.top-H-10;x=Math.max(8,Math.min(s.width-W-8,x));if(y<8)y=8;d.style.left=x+'px';d.style.top=y+'px';later(()=>d.remove(),ms)},60)}

/* ---------- drawings ---------- */
function deerArt(){return `
 <g class="dbody">
  <g class="leg b"><line x1="34" y1="-74" x2="34" y2="0" stroke="#8A5228" stroke-width="7" stroke-linecap="round"/></g>
  <g class="leg a"><line x1="-36" y1="-74" x2="-36" y2="0" stroke="#8A5228" stroke-width="7" stroke-linecap="round"/></g>
  <path d="M54,-100 q16,-10 10,-22 q-8,8 -16,12Z" fill="#9A5A28"/>
  <ellipse cx="0" cy="-90" rx="60" ry="27" fill="#B8743A"/>
  <g fill="#F7E6CC"><circle cx="-14" cy="-98" r="4"/><circle cx="6" cy="-104" r="4"/><circle cx="24" cy="-96" r="4"/><circle cx="-2" cy="-88" r="3.5"/><circle cx="36" cy="-104" r="3.5"/></g>
  <g class="leg a"><line x1="42" y1="-74" x2="42" y2="0" stroke="#A0602E" stroke-width="7" stroke-linecap="round"/></g>
  <g class="leg b"><line x1="-26" y1="-74" x2="-26" y2="0" stroke="#A0602E" stroke-width="7" stroke-linecap="round"/></g>

/* ---------- ……卻…… ---------- */
const QU=['漂亮的角害了花鹿，瘦長的腳卻救了他。','這件外套看起來很薄，卻很保暖。','那棟矮小的石屋已有百年歷史，卻還是很堅固。'];
const QC={A:['妹妹個子小小的','妹妹年紀最小','妹妹看起來很害怕'],B:['力氣卻很大','卻很會照顧大家','卻勇敢的去打針']};
let qa='',qb='';
function buildQU(){$('#qul').innerHTML='<h4>句子練習：……卻……</h4><div class="note">「卻」前面和後面的意思<b>相反</b>，或是和我們想的<b>不一樣</b>。點一點，聽聽看！</div>'+QU.map(s=>`<div class="sent">${s.replace('卻','<em>卻</em>')}</div>`).join('');
  $$('#qul .sent').forEach((d,i)=>d.onclick=()=>speak(QU[i]));qa=qb='';renderQU();}
function renderQU(){const r=$('#qur');r.innerHTML=`<h4>我來描述妹妹</h4><div class="note">看課本的圖，用「……卻……」說說妹妹。點一點，或自己寫！</div>
   <div class="slot"><h5>前面：妹妹的樣子</h5><div class="chips" id="qA">${QC.A.map(x=>`<button class="${x===qa?'on':''}">${x}</button>`).join('')}</div><input id="qi1" placeholder="自己寫"></div>
   <div class="slot"><h5>後面：意想不到的事（要有「卻」）</h5><div class="chips" id="qB">${QC.B.map(x=>`<button class="${x===qb?'on':''}">${x}</button>`).join('')}</div><input id="qi2" placeholder="自己寫，記得用「卻」"></div>
   <div class="mysent" id="qsent"></div>`;
  $$('#qA button').forEach(b=>b.onclick=()=>{qa=b.textContent;renderQU()});$$('#qB button').forEach(b=>b.onclick=()=>{qb=b.textContent;renderQU()});
  ['qi1','qi2'].forEach(i=>$('#'+i).oninput=updQU);updQU();}
function updQU(){const a=$('#qi1').value.trim()||qa,b=$('#qi2').value.trim()||qb;const B=x=>x?x:'<span class="bl">＿＿＿</span>';$('#qsent').innerHTML=`${B(a)}，${b?b.replace('卻','<span class="g">卻</span>'):B('')}。`;}

/* ---------- steps ---------- */
const S=[
 {sc:'world',st:0,tag:'第一段',no:'到河邊喝水'},
 {sc:'world',st:1,tag:'第二段',no:'水中的倒影'},
 {sc:'world',st:2,tag:'第三段',no:'獅子來了'},
 {sc:'world',st:3,tag:'第四段',no:'角和腳'},
 {sc:'map',tag:'故事重點',no:'找出重點',guide:['主角是誰？','開始、經過、結果，','發生了什麼事？','點一點「看答案」，','也可以點「看動畫」。'],enter(){buildTL()},acts:[['📖 全部看答案',()=>buildTL(1)],['🙈 全部蓋起來',()=>buildTL()]]},
 {sc:'idiom',tag:'成語',no:'認識成語',guide:['認識三個成語：','七手八腳、','河東獅吼、','理直氣壯。','找找看，哪些字','課文裡也有？'],enter(){buildIdiom(0)},acts:[['🎯 考考你',idiomQuiz],['📖 看成語卡',()=>buildIdiom(0)]]},
 {sc:'yy',tag:'句子練習',no:'又……又……',guide:['四隻又瘦又長的腳，','又大又漂亮的角。','用「又……又……」，','一次說出兩個樣子！'],enter(){buildYY()},acts:[['🔊 念我的句子',()=>speak($('#ysent').innerText.replace(/＿+/g,''))]]},
 {sc:'que',tag:'句子練習',no:'……卻……',guide:['漂亮的角害了我，','瘦長的腳卻救了我。','「卻」的前後，','意思不一樣喔！'],enter(){buildQU()},acts:[['🔊 念我的句子',()=>speak($('#qsent').innerText.replace(/＿+/g,''))],['🧹 清空重寫',()=>{qa=qb='';renderQU()}]]}
];

/* ---------- navigation ---------- */
const TABS=[['喝水',0,1],['倒影',1,2],['獅子來了',2,3],['角和腳',3,4],['故事重點',4],['成語',5],['又……又……',6],['……卻……',7]];
TABS.forEach(([n,i,num],k)=>{if(k===4)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">｜</span>');else if(k>0&&k<4)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">›</span>');
  const b=document.createElement('button');b.innerHTML=(num?`<i>${num}</i>`:'')+n;b.onclick=()=>go(i);b.dataset.i=i;$('#tabs').appendChild(b)});
let cur=0;
function lineHTML(t){return t.replace(/\[\[(.+?)\]\]/g,(m,w)=>`<span class="v" role="button" tabindex="0" data-w="${w}">${w}</span>`).replace(/\{\{(.+?)\}\}/g,(m,w)=>`<span class="v b" role="button" tabindex="0" data-w="${w}">${w}</span>`)}
function go(i){
  stopAll();cur=Math.max(0,Math.min(S.length-1,i));const st=S[cur];
  $$('.scene').forEach(s=>s.classList.toggle('on',s.id==='sc-'+st.sc));
  $('#ptag').textContent=st.tag;$('#pno').textContent=st.no;
  const isT=st.st!==undefined;const lines=isT?ST[st.st].lines:st.guide;
  const t=$('#txt');t.classList.toggle('guide',!isT);t.classList.toggle('long',isT&&!!ST[st.st].long);
  t.innerHTML=lines.map((l,k)=>`<span class="ln" data-k="${k}" ${isT?'tabindex="0"':''}>${lineHTML(l)}</span>`).join('');
  t.querySelectorAll('.v').forEach(v=>{v.onclick=e=>{e.stopPropagation();showVocab(v.dataset.w)};v.onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();showVocab(v.dataset.w)}}});
  if(isT){t.querySelectorAll('.ln').forEach(l=>{l.onclick=()=>{autoOn=false;playLine(+l.dataset.k)};l.onkeydown=e=>{if(e.key==='Enter')l.onclick()}});resetStanza(st.st);}
  t.scrollTop=0;t.scrollLeft=0;
  const A=$('#acts');A.innerHTML='';
  const acts=isT?[['▶ 下一句',nextLine,1],['🎬 整段自動播',autoPlay],['🔁 從頭來',()=>{stopAll();resetStanza(st.st);$$('#txt .ln').forEach(l=>l.classList.remove('on','done'))}]]:(st.acts||[]);
  acts.forEach(([l,f,m])=>{const b=document.createElement('button');b.textContent=l;if(m)b.className='main';b.onclick=f;A.appendChild(b)});
  if(isT)A.insertAdjacentHTML('beforeend','<span class="hint" id="lineNo">點右邊的句子，也可以一句一句看</span>');
  let active=0;TABS.forEach(([n,ti])=>{if(cur>=ti)active=ti});
  $$('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===active));
  $('#prev').disabled=cur===0;$('#next').disabled=cur===S.length-1;
  st.enter&&st.enter();
}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#say').onclick=()=>{const st=S[cur];const lines=st.st!==undefined?ST[st.st].lines:st.guide;speak(lines.join(''))};
document.addEventListener('keydown',e=>{if(e.target.closest('input,.v,.ln'))return;if(e.key===' '&&S[cur].st!==undefined){e.preventDefault();nextLine()}if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
go(0);
</script>
</body>
</html>
