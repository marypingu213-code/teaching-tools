<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二上第七課 等兔子來撞樹｜課文動起來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --bg:#E6EEDC; --panel:#FFFFFF; --ink:#24301F; --soft:#5F6E58;
  --leaf:#4A9A3C; --soil:#9A6A3A; --carrot:#E8762A; --gold:#E8A33A; --sky:#2E7FC1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#172015; --panel:#232E20; --ink:#EEF4EA; --soft:#B1C2AA; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--kai);background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:1.2vw;padding:1vh 1.6vw .8vh;flex-wrap:wrap}
h1{margin:0;font-size:4.4vh;color:var(--leaf);letter-spacing:.12em;white-space:nowrap}
h1 small{font-size:.5em;color:var(--soft);letter-spacing:.05em;margin-right:.4em}
h1 em{font-style:normal;font-size:.45em;color:var(--soft);margin-left:.5em;letter-spacing:0}
nav{display:flex;gap:.3vw;flex-wrap:wrap;align-items:center}
nav button{font:inherit;font-size:2.4vh;padding:.5vh .8vw;border-radius:10px;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:.3em}
nav button i{font-style:normal;display:inline-grid;place-items:center;width:2.7vh;height:2.7vh;border-radius:50%;background:var(--carrot);color:#fff;font-size:1.7vh}
nav button.on{background:var(--panel);border-color:var(--leaf);color:var(--leaf);font-weight:700}
nav .sep{color:var(--soft)}
main{display:grid;grid-template-columns:1fr 46vh;gap:1.2vw;padding:0 1.6vw 1.4vh;min-height:0}
.stagewrap{display:grid;grid-template-rows:1fr auto;gap:1vh;min-height:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#D6E6C8;min-height:0}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene>svg{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none;z-index:7}
.acts{display:flex;flex-wrap:wrap;gap:.7vw;min-height:6vh;align-items:center}
.acts button{font:inherit;font-size:2.7vh;padding:.9vh 1.4vw;border-radius:999px;border:3px solid var(--leaf);background:var(--panel);color:var(--ink);cursor:pointer}
.acts button:hover{background:var(--leaf);color:#fff}
.acts button.main{background:var(--leaf);color:#fff;font-weight:700}
.acts .hint{font-size:2.3vh;color:var(--soft)}
button:focus-visible,.v:focus-visible,.ln:focus-visible,.cell:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
aside{background:var(--panel);border-radius:20px;padding:1.6vh 1.4vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:1vh;min-height:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh;color:var(--soft)}
.ptitle b{color:var(--leaf);font-size:1.15em}
.txt{writing-mode:vertical-rl;font-size:4.5vh;line-height:1.55;letter-spacing:.08em;width:100%;height:100%;min-height:0;overflow:auto;display:block}
.ln{display:block;cursor:pointer;border-radius:10px;padding:.3vh 0;transition:background .3s}
.ln:hover{background:rgba(0,0,0,.05)}
.ln.on{background:#FFE7A8;color:#24301F}
.ln.done{color:var(--soft)}
.guide .ln{cursor:default;font-size:.8em}
.v{border:2px solid var(--gold);border-radius:6px;cursor:pointer;color:#1F6FA0;padding:.1em 0}
.v.b{border-color:transparent;color:#1F6FA0}
@media (prefers-color-scheme: dark){ .v,.v.b{color:#86C9F0} .ln.on .v{color:#1F6FA0} }
.pnav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.8vh}
.pnav button{font:inherit;font-size:2.6vh;padding:1vh 0;border-radius:12px;border:2px solid var(--soft);background:transparent;color:var(--ink);cursor:pointer}
.pnav .say{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:700}
.pnav button:disabled{opacity:.35}
#pop{position:fixed;left:3vw;bottom:13vh;max-width:48vw;background:#fff;color:#24301F;border:4px solid var(--gold);border-radius:16px;padding:1.4vh 1.6vw;font-size:3.2vh;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:20}
#pop.on{display:block;animation:pop .3s}
#pop h3{margin:0 0 .4vh;color:#3B7F30;font-size:1.3em}
#pop .row{display:flex;gap:1vw;margin-top:.8vh}
#pop button{font:inherit;font-size:.85em;border-radius:10px;border:2px solid #3B7F30;background:#fff;color:#3B7F30;padding:.3vh 1vw;cursor:pointer}

.badge{position:absolute;background:#fff;color:#24301F;border:4px solid var(--leaf);border-radius:14px;padding:.6vh 1.2vw;font-size:3.2vh;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.6,1);white-space:nowrap;z-index:8}
.badge.gold{border-color:var(--gold)}.badge.red{border-color:#C8362B}
.bub{position:absolute;font-size:5.4vh;font-weight:700;color:#fff;-webkit-text-stroke:2px #3B7F30;paint-order:stroke fill;animation:floatup 1.9s ease-out forwards;z-index:8}
@keyframes floatup{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1)}to{transform:translateY(-90px);opacity:0}}
.huge{position:absolute;left:28%;top:40%;transform:translate(-50%,-50%);font-size:15vh;font-weight:700;color:#FFE45C;-webkit-text-stroke:5px #C8362B;paint-order:stroke fill;animation:ahh 1.6s ease-out forwards;white-space:nowrap;z-index:8}
@keyframes ahh{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.lbl{font-family:var(--kai);font-weight:700}

/* ---------- farm states ---------- */
#skyR{fill:#9FD3EE;transition:fill 1.5s}
.s4.a0 #skyR{animation:daynight 3.2s ease-in-out 2}
@keyframes daynight{0%,100%{fill:#9FD3EE}45%,60%{fill:#141C3A}}
.s4.a1 #skyR{fill:#C9D3DB}
#nightG{opacity:0}
.s4.a0 #nightG{animation:nightshow 3.2s ease-in-out 2}
@keyframes nightshow{0%,30%,100%{opacity:0}45%,60%{opacity:1}}
#sunG{transition:transform 2s ease-out,opacity 1s}
.s1:not(.a3) #sunG{transform:translateY(120px)}
.s1.a4 #sunG{animation:rise 2.4s ease-out}
@keyframes rise{from{transform:translateY(160px)}to{transform:translateY(0)}}
#rays{transform-box:fill-box;transform-origin:center;animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.s4.a1 #sunG{opacity:.4}
#farmerPos{transform:translate(640px,470px);transition:transform 1.6s ease-in-out,opacity .6s}
.s2.a3 #farmerPos,.s3 #farmerPos,.s4 #farmerPos{transform:translate(430px,476px)}
.s1:not(.a0) #farmerPos{opacity:0}
#fBend,#fSit,#heldR,#hoeGround{display:none}
.s1.a5 #fStand,.s2 #fStand{display:none}
.s1.a5 #fBend,.s2 #fBend{display:inline}
.s2.a3 #fBend{display:none}.s2.a3 #fStand,.s2.a3 #heldR{display:inline}
.s3.a3 #fStand,.s4 #fStand{display:none}.s3.a3 #fSit,.s4 #fSit{display:inline}
.s3.a1 .fhoe,.s4 .fhoe{display:none}.s3.a1 #hoeGround,.s4 #hoeGround{display:inline}
#fBend .arm{transform-box:fill-box;transform-origin:50% 0;animation:pull .5s ease-in-out infinite alternate}
@keyframes pull{to{transform:rotate(-20deg)}}
.s2.a1 #fBend .arm{animation-play-state:paused}
#rows,#crops{transition:opacity 1s}
.s1:not(.a1) #rows,.s1:not(.a1) #crops{opacity:0}
.s3.a1 #rows,.s4 #rows{opacity:.25}
.s3.a2 #crops,.s4 #crops{opacity:0}
.weed{transition:opacity .4s}
.s1.a5 .weed{opacity:0}
.s2 .weed:nth-child(odd){opacity:0}.s2 .weed:nth-child(even){opacity:1}
.s3 .weed,.s4 .weed{opacity:1}
#tall{opacity:0;transition:opacity 1.5s}
.s3.a2 #tall,.s4 #tall{opacity:1}
.tw{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.2);transition:transform 2s}
.s3.a2 .tw,.s4 .tw{transform:scaleY(1)}
#treeG{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1.6s cubic-bezier(.3,1.4,.6,1)}
.s1:not(.a2) #treeG{transform:scaleY(0)}
.s4.a3 #treeG{animation:shake 1s ease-in-out infinite alternate}
@keyframes shake{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.lv{transition:fill 1.5s,opacity 1.5s}
.s4.a1 .lv{animation:fall 4s ease-in forwards}
@keyframes fall{0%{fill:#4E9A3C}35%{fill:#E8942A;opacity:1}100%{fill:#C97A2A;opacity:0}}
#fallLeaves{display:none}.s4.a1 #fallLeaves{display:inline}
.fl{animation:leafdrop 3s ease-in forwards}
@keyframes leafdrop{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(60px,280px) rotate(300deg);opacity:0}}
#snowG{opacity:0}
.s4.a1 #snowG{animation:snowin 1s 3s forwards}
@keyframes snowin{to{opacity:1}}
.flake{animation:snow 5s linear infinite}
@keyframes snow{from{transform:translate(0,-40px)}to{transform:translate(30px,600px)}}
#snowCap{opacity:0;transition:opacity 1s 3.5s}.s4.a1 #snowCap{opacity:1}
#rabbitG{transform:translate(1180px,508px)}
.s2.a1 #rabbitG{transform:translate(350px,508px);transition:transform 2.4s linear}
.s2.a1:not(.a2) #rabbitIn{animation:hopr .22s ease-in-out infinite alternate}
@keyframes hopr{to{transform:translateY(-16px)}}
#rabbitIn{transform-box:fill-box;transform-origin:50% 100%;transition:transform .4s}
.s2.a2 #rabbitIn{transform:rotate(-80deg) translateY(-10px)}
.s2.a3 #rabbitG,.s3 #rabbitG,.s4 #rabbitG,.s1 #rabbitG{display:none}
.s2:not(.a1) #rabbitG{display:none}
#dizzy{display:none}.s2.a2:not(.a3) #dizzy{display:inline}
#dizzy g{transform-box:view-box;transform-origin:350px 440px;animation:spin 1.4s linear infinite}
#cal{opacity:0;transition:opacity .6s}.s3.a3 #cal,.s4 #cal{opacity:1}
#think{opacity:0;transition:opacity .6s}.s3.a4 #think,.s4 #think{opacity:1}
#qmark{display:none}.s4.a2 #qmark{display:inline}
#zz{display:none}.s4.a2 #zz{display:inline}
.zz{animation:zz 2s ease-out infinite}
@keyframes zz{from{transform:translate(0,0);opacity:0}30%{opacity:1}to{transform:translate(30px,-50px);opacity:0}}
#windG{display:none}.s4.a3 #windG{display:inline}
.wl{animation:windgo 1.4s linear infinite}
@keyframes windgo{from{transform:translateX(1100px);opacity:0}20%{opacity:.9}to{transform:translateX(-300px);opacity:0}}
.s4.a3 #fSit .fb{animation:shiver .1s linear infinite}
@keyframes shiver{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
#scarf{display:none}.s4.a1 #scarf{display:inline}

/* ---------- html pages ---------- */
.html{background:linear-gradient(#EEF4E6,#FAFCF7)}
.map{position:absolute;inset:3%;display:grid;grid-template-columns:1fr 1.5fr 1fr;grid-template-rows:auto 1fr;gap:1.4vh 1.2vw}
.mtitle{grid-column:1/-1;display:flex;justify-content:center;gap:1.2vw;align-items:center}
.mcard{background:#fff;border-radius:22px;border:4px solid #C9B48E;padding:1.2vh 1vw;display:flex;flex-direction:column;gap:.8vh;color:#24301F;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.mcard h4{margin:0;font-size:3.2vh;color:#fff;background:var(--c);border-radius:12px;padding:.3vh .8vw;align-self:flex-start}
.mcard .q{font-size:3vh;font-weight:700;line-height:1.4}
.mcard .a{font-size:2.8vh;line-height:1.5;background:#FFF2D6;border-radius:12px;padding:.8vh .8vw;display:none}
.mcard .a.on{display:block;animation:pop .4s}
.mcard .row{display:flex;gap:.6vw;flex-wrap:wrap;margin-top:auto}
.mcard button{font:inherit;font-size:2.4vh;border-radius:999px;border:3px solid var(--c);background:#fff;color:#24301F;padding:.4vh 1vw;cursor:pointer}
.mid{display:flex;flex-direction:column;gap:1.2vh}
.mid .mcard{flex:1}
.hero{background:#fff;border-radius:999px;border:5px solid #E8762A;padding:1vh 2vw;font-size:3.6vh;font-weight:700;color:#24301F;display:flex;align-items:center;gap:1vw}
.hero button{font:inherit;font-size:2.4vh;border-radius:999px;border:3px solid #E8762A;background:#fff;padding:.3vh 1vw;cursor:pointer}
.hero .a{font-size:2.8vh;color:#B5481F;display:none}.hero .a.on{display:inline}
.idi{position:absolute;inset:3%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:auto 1fr;gap:1.2vh 1vw}
.icard{font:inherit;background:#fff;border:4px solid var(--c);border-radius:18px;padding:1vh .6vw;cursor:pointer;color:#24301F;display:flex;flex-direction:column;align-items:center;gap:.4vh}
.icard .em{font-size:6vh;line-height:1}
.icard b{font-size:3.8vh;color:var(--c)}
.icard.on{background:color-mix(in srgb,var(--c) 14%,#fff)}
.idet{grid-column:1/-1;background:#fff;border-radius:18px;padding:2vh 2vw;color:#24301F;font-size:3.1vh;line-height:1.7;overflow:auto}
.idet h3{margin:0 0 .6vh;font-size:4.4vh}
.idet .mean{background:#EEF6E8;border-radius:12px;padding:.8vh 1vw}
.idet .ex{background:#FFF2D6;border-radius:12px;padding:.8vh 1vw;margin-top:1vh}
.idet .lk{background:#FDE7DA;border-radius:12px;padding:.8vh 1vw;margin-top:1vh;font-weight:700;color:#B5481F}
.idet .opts{display:flex;gap:1vw;flex-wrap:wrap;margin-top:1.4vh}
.idet .opts button{font:inherit;font-size:3.2vh;padding:1vh 1.6vw;border-radius:14px;border:3px solid #4A9A3C;background:#fff;color:#24301F;cursor:pointer;font-weight:700}
.idet .fb{min-height:4.5vh;margin-top:1.2vh}
.idet .tg{font-size:2.1vh;color:#fff;border-radius:6px;padding:.1vh .6vw;margin-right:.6vw}
.blank{display:inline-block;min-width:7em;border-bottom:4px solid #E8762A;text-align:center;color:#E8762A}
.cd{position:absolute;inset:3%;display:grid;grid-template-columns:1.1fr 1fr;gap:1.4vw;color:#24301F}
.cdl,.cdr{background:#fff;border-radius:18px;padding:1.4vh 1.2vw;display:flex;flex-direction:column;gap:.7vh;overflow:auto}
.cdl h4,.cdr h4{margin:0;font-size:3.2vh;color:#2E7FC1}
.sent{font-size:2.9vh;line-height:1.5;border-radius:12px;padding:.8vh .8vw;background:#F4F8F0;display:flex;gap:.8vw;align-items:center;justify-content:space-between}
.sent em{font-style:normal;color:#2E8B57;font-weight:700}
.sent .tb{display:flex;gap:.4vw;flex-shrink:0}
.sent .tb button{font:inherit;font-size:2.4vh;border-radius:10px;border:3px solid #2E7FC1;background:#fff;color:#24301F;padding:.2vh .6vw;cursor:pointer}
.sent .tb button.ok{background:#2E8B57;border-color:#2E8B57;color:#fff}
.sent .tb button.no{opacity:.4}
.note{font-size:2.6vh;background:#FFF2D6;border-radius:12px;padding:.8vh .8vw;line-height:1.5}
.slot h5{margin:.4vh 0;font-size:2.6vh;color:#5F6E58}
.chips{display:flex;flex-wrap:wrap;gap:.6vh}
.chips button{font:inherit;font-size:2.6vh;padding:.4vh 1vw;border-radius:999px;border:3px solid #E8762A;background:#fff;color:#24301F;cursor:pointer}
.chips button.on{background:#E8762A;color:#fff}
.cdr input{font:inherit;font-size:2.6vh;padding:.6vh .8vw;border-radius:10px;border:3px solid #C9C2B0;width:100%}
.mysent{font-size:3.6vh;font-weight:700;background:#FFF8E6;border:4px dashed #E8A33A;border-radius:14px;padding:1vh 1vw;line-height:1.5}
.mysent .g{color:#2E8B57}
.mysent .bl{color:#B9B2A0}

@media (max-width:820px), (max-aspect-ratio:1/1){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  .stage{height:60vh}
  .txt{writing-mode:horizontal-tb;height:auto;font-size:24px}
  .acts button,.pnav button,nav button{font-size:16px}
  h1{font-size:26px}
  .map,.cd{grid-template-columns:1fr;overflow:auto}
  .idi{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion: reduce){ .flake,#rays,.wl,.zz{animation:none} }
a.hall-back{position:fixed;z-index:40;top:0;right:0;font-family:var(--kai);font-size:1.7vh;line-height:1.2;padding:.45vh .8vw;white-space:nowrap;background:var(--panel);color:var(--soft);text-decoration:none;border:1px solid var(--soft);border-top:0;border-right:0;border-bottom-left-radius:12px}a.hall-back:hover,a.hall-back:focus-visible{color:var(--ink)}
</style>
</head>
<body>
<a class="hall-back" href="../">← 回課文大廳</a>
<header>
  <h1><small>二上第七課</small>等兔子來撞樹<em>林武憲</em></h1>
  <nav id="tabs"></nav>
</header>

<main>
  <div class="stagewrap">
    <div class="stage" id="stage">

      <div class="scene" id="sc-farm">
        <svg id="F" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
          <rect id="skyR" width="1000" height="560"/>
          <g id="nightG"><circle cx="820" cy="90" r="36" fill="#FFF3C4"/><circle cx="836" cy="80" r="32" fill="#141C3A"/><g id="stars" fill="#fff"></g></g>
          <g id="sunG"><g id="rays" stroke="#F7B731" stroke-width="8" stroke-linecap="round"><line x1="840" y1="20" x2="840" y2="4"/><line x1="840" y1="160" x2="840" y2="176"/><line x1="770" y1="90" x2="754" y2="90"/><line x1="910" y1="90" x2="926" y2="90"/><line x1="790" y1="40" x2="779" y2="29"/><line x1="890" y1="140" x2="901" y2="151"/><line x1="890" y1="40" x2="901" y2="29"/><line x1="790" y1="140" x2="779" y2="151"/></g>
            <circle cx="840" cy="90" r="48" fill="#FFD43B"/><path d="M822,96 q18,16 36,0" stroke="#A05A00" stroke-width="3" fill="none"/><circle cx="826" cy="84" r="4" fill="#A05A00"/><circle cx="854" cy="84" r="4" fill="#A05A00"/></g>
          <path d="M0,300 Q160,210 320,270 T640,250 T1000,240 L1000,400 L0,400Z" fill="#A9CF8E"/>
          <path d="M0,330 Q200,280 420,320 T1000,300 L1000,420 L0,420Z" fill="#8FBF72"/>
          <rect y="400" width="1000" height="160" fill="#C9A273"/>
          <path d="M480,300 L1000,300 L1000,520 L380,520Z" fill="#A9784A"/>
          <g id="rows" stroke="#7A5230" stroke-width="5" stroke-linecap="round"><line x1="470" y1="330" x2="1000" y2="330"/><line x1="450" y1="370" x2="1000" y2="370"/><line x1="430" y1="410" x2="1000" y2="410"/><line x1="410" y1="450" x2="1000" y2="450"/><line x1="395" y1="490" x2="1000" y2="490"/></g>
          <g id="crops"></g>
          <g id="weeds"></g>
          <g id="tall"></g>
          <path d="M0,520 L1000,520 L1000,560 L0,560Z" fill="#D9C49A"/>
          <g id="treeG">
            <path d="M330,515 C320,440 340,380 320,300 L360,300 C344,380 366,440 360,515Z" fill="#7A5230"/>
            <path d="M330,330 C300,300 270,290 240,270 M352,320 C380,290 410,280 440,262" stroke="#7A5230" stroke-width="12" fill="none" stroke-linecap="round"/>
            <g id="leaves"></g>
            <g id="snowCap" fill="#fff"><path d="M240,266 q20,-12 40,-2 q20,-14 40,0 q22,-16 44,0 q20,-12 40,0 q20,-10 36,0 L440,272 L240,272Z"/></g>
            <text x="345" y="470" text-anchor="middle" font-size="20" fill="#FFE7A8" class="lbl">樹</text>
          </g>
          <g id="fallLeaves"></g>
          <path id="hoeGround" d="M470,516 L560,508 M555,500 l12,18" stroke="#6B4A2A" stroke-width="6" stroke-linecap="round"/>
          <g id="rabbitG"><g id="rabbitIn"></g></g>
          <g id="dizzy"><g><text x="300" y="440" font-size="30">⭐</text><text x="370" y="420" font-size="26">⭐</text><text x="380" y="470" font-size="22">⭐</text></g></g>
          <g id="farmerPos"><g id="farmer"></g></g>

let lineIdx=-1;
function stateTo(sn,k){const F=$('#F');F.setAttribute('class','s'+(sn+1)+' '+Array.from({length:k+1},(_,i)=>'a'+i).join(' '));}
function playLine(k,{onend}={}){
  const st=S[cur];if(st.st===undefined)return;const S_=ST[st.st];
  lineIdx=k;$('#ov').innerHTML='';stateTo(st.st,k);S_.fx[k]();
  $$('#txt .ln').forEach((l,i)=>{l.classList.toggle('on',i===k);l.classList.toggle('done',i<k)});

  let done=false;const fin=()=>{if(done)return;done=true;onend&&onend()};

function nextLine(){const st=S[cur];if(st.st===undefined)return;const n=ST[st.st].lines.length;if(lineIdx<n-1)playLine(lineIdx+1);else temp('這一段念完了！按「下一頁」繼續',{left:'50%',top:'45%',transform:'translateX(-50%)'},'badge',2000)}

function askIdiom(){const det=$('#idet');if(iqi>=iq.length){det.innerHTML='<h3>全部完成！🎉</h3>';speak('全部完成，你好棒');return}
  const [s,a,b]=iq[iqi];det.innerHTML=`<div><span class="tg" style="background:${b?'#4A9A3C':'#9AA6B5'}">${b?'課本例句':'練習題'}</span>第 ${iqi+1}／${iq.length} 題：空格要填哪個成語？</div><div style="font-size:3.8vh;font-weight:700;margin-top:1vh">${s.replace('＿＿','<span class="blank">？</span>')}</div><div class="opts"></div><div class="fb"></div>`;speak(s.replace('＿＿','什麼'));
  ID.forEach(d=>{const x=document.createElement('button');x.textContent=d.n;x.onclick=()=>{const fb=det.querySelector('.fb');if(d.n===a){det.querySelector('.blank').textContent=a;fb.textContent='答對了！⭐';fb.style.color='#2E8B57';speak('答對了，'+s.replace('＿＿',a));iqi++;later(askIdiom,2600)}else{fb.textContent='再想想看：「'+d.n+'」的意思是'+d.m;fb.style.color='#C8362B'}};det.querySelector('.opts').appendChild(x)});}

/* ---------- 從……到…… ---------- */
const CD=[['從白天到夜晚，農夫還是沒有等到兔子。','時間'],['從早上到下午，郵差都沒有出現。','時間'],['從河川到海洋，隨處可見大大小小的垃圾。','空間'],['從公園到我家門口，路旁都開滿了黃色的花。','空間']];
const CH={A:['樓梯上','一樓','早上','門口'],B:['客廳','門口','晚上','沙發旁'],C:['地上都是小貓的腳印','小貓一直跑來跑去','我都在家裡玩']};
let cA='',cB='',cC='';
function buildCD(){
  $('#cdl').innerHTML='<h4>句子練習：從……到……</h4><div class="note">「從……到……」可以寫出事件發生的<b>時間</b>或<b>空間</b>範圍。每一句是說時間，還是地方？點一點！</div>'+
   CD.map(([s,t],i)=>`<div class="sent"><span>${s.replace(/^從/,'<em>從</em>').replace(/到/,'<em>到</em>')}</span><span class="tb" data-i="${i}"><button>⏰ 時間</button><button>📍 空間</button></span></div>`).join('');
  $$('#cdl .tb').forEach(tb=>{const i=+tb.dataset.i;tb.querySelectorAll('button').forEach((b,j)=>b.onclick=()=>{const ans=CD[i][1],pick=j===0?'時間':'空間';if(pick===ans){b.classList.add('ok');speak('答對了，這句說的是'+ans)}else{b.classList.add('no');speak('再想想看')}});});
  $$('#cdl .sent span:first-child').forEach((s,i)=>{s.style.cursor='pointer';s.onclick=()=>speak(CD[i][0])});
  cA=cB=cC='';renderCDR();
}
function chipRow(list,cur,fn){return `<div class="chips">${list.map(x=>`<button class="${x===cur?'on':''}" data-v="${x}">${x}</button>`).join('')}</div>`}
function renderCDR(){const r=$('#cdr');const vA=$('#iA')?.value||'',vB=$('#iB')?.value||'',vC=$('#iC')?.value||'';
  r.innerHTML=`<h4>我來造句</h4><div class="note">看課本的圖，用「從……到……」造句。點一點，或自己寫！</div>
   <div class="slot"><h5>從＿＿（哪裡、什麼時候開始）</h5>${chipRow(CH.A,cA)}<input id="iA" placeholder="自己寫" value="${vA}"></div>
   <div class="slot"><h5>到＿＿（哪裡、什麼時候結束）</h5>${chipRow(CH.B,cB)}<input id="iB" placeholder="自己寫" value="${vB}"></div>
   <div class="slot"><h5>發生了什麼事？</h5>${chipRow(CH.C,cC)}<input id="iC" placeholder="自己寫" value="${vC}"></div>
   <div class="mysent" id="mysent"></div>`;
  const slots=r.querySelectorAll('.slot');[[0,'A'],[1,'B'],[2,'C']].forEach(([i,k])=>{slots[i].querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{if(k==='A')cA=b.dataset.v;if(k==='B')cB=b.dataset.v;if(k==='C')cC=b.dataset.v;$('#i'+k).value='';renderCDR()});});
  ['iA','iB','iC'].forEach(id=>$('#'+id).oninput=updSent);updSent();}
function updSent(){const a=$('#iA').value.trim()||cA,b=$('#iB').value.trim()||cB,c=$('#iC').value.trim()||cC;const B=x=>x?x:'<span class="bl">＿＿＿</span>';$('#mysent').innerHTML=`<span class="g">從</span>${B(a)}<span class="g">到</span>${B(b)}，${B(c)}。`;}

/* ---------- steps ---------- */
const S=[
 {sc:'farm',st:0,tag:'第一段',no:'農夫的田'},
 {sc:'farm',st:1,tag:'第二段',no:'兔子撞樹'},
 {sc:'farm',st:2,tag:'第三段',no:'守著樹'},
 {sc:'farm',st:3,tag:'第四段',no:'等啊等'},
 {sc:'map',tag:'課文重點',no:'找出重點',guide:['這個故事的主角是誰？','開始、經過、結果，','發生了什麼事？','點一點「看答案」，','也可以點「看動畫」。'],
  enter(){buildMap()},acts:[['📖 全部看答案',mapAll],['🙈 全部蓋起來',buildMap]]},
 {sc:'idiom',tag:'成語',no:'認識成語',guide:['認識四個成語：','守株待兔、幸災樂禍、','以卵擊石、墨守成規。','這一課的故事，','就是「守株待兔」喔！'],
  enter(){buildIdiom(0)},acts:[['🎯 考考你',idiomQuiz],['📖 看成語卡',()=>buildIdiom(0)]]},
 {sc:'cd',tag:'句子練習',no:'從……到……',guide:['從白天等到夜晚，','從夏天等到冬天。','「從……到……」','可以寫出時間，','也可以寫出地方。'],
  enter(){buildCD()},acts:[['🔊 念我的句子',()=>speak($('#mysent').innerText.replace(/＿+/g,''))],['🧹 清空重寫',()=>{cA=cB=cC='';['iA','iB','iC'].forEach(i=>$('#'+i).value='');renderCDR()}]]}
];

/* ---------- navigation ---------- */
const TABS=[['農夫的田',0,1],['兔子撞樹',1,2],['守著樹',2,3],['等啊等',3,4],['課文重點',4],['成語',5],['從……到……',6]];
TABS.forEach(([n,i,num],k)=>{if(k===4)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">｜</span>');else if(k>0&&k<4)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">›</span>');
  const b=document.createElement('button');b.innerHTML=(num?`<i>${num}</i>`:'')+n;b.onclick=()=>go(i);b.dataset.i=i;$('#tabs').appendChild(b)});
let cur=0;
function lineHTML(t){return t.replace(/\[\[(.+?)\]\]/g,(m,w)=>`<span class="v" role="button" tabindex="0" data-w="${w}">${w}</span>`).replace(/\{\{(.+?)\}\}/g,(m,w)=>`<span class="v b" role="button" tabindex="0" data-w="${w}">${w}</span>`)}
function go(i){
  stopAll();cur=Math.max(0,Math.min(S.length-1,i));const st=S[cur];
  $$('.scene').forEach(s=>s.classList.toggle('on',s.id==='sc-'+st.sc));
  $('#ptag').textContent=st.tag;$('#pno').textContent=st.no;
  const isPoem=st.st!==undefined;const lines=isPoem?ST[st.st].lines:st.guide;
  const t=$('#txt');t.classList.toggle('guide',!isPoem);
  t.innerHTML=lines.map((l,k)=>`<span class="ln" data-k="${k}" ${isPoem?'tabindex="0"':''}>${lineHTML(l)}</span>`).join('');
  t.querySelectorAll('.v').forEach(v=>{v.onclick=e=>{e.stopPropagation();showVocab(v.dataset.w)};v.onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();showVocab(v.dataset.w)}}});
  if(isPoem){t.querySelectorAll('.ln').forEach(l=>{l.onclick=()=>{autoOn=false;playLine(+l.dataset.k)};l.onkeydown=e=>{if(e.key==='Enter')l.onclick()}});lineIdx=-1;stateTo(st.st,-1);}
  t.scrollTop=0;t.scrollLeft=0;
  const A=$('#acts');A.innerHTML='';
  const acts=isPoem?[['▶ 下一句',nextLine,1],['🎬 整段自動播',autoPlay],['🔁 從頭來',()=>{stopAll();lineIdx=-1;stateTo(st.st,-1);$$('#txt .ln').forEach(l=>l.classList.remove('on','done'))}]]:(st.acts||[]);
  acts.forEach(([l,f,m])=>{const b=document.createElement('button');b.textContent=l;if(m)b.className='main';b.onclick=f;A.appendChild(b)});
  if(isPoem)A.insertAdjacentHTML('beforeend','<span class="hint" id="lineNo">點右邊的句子，也可以一句一句看</span>');
  let active=0;TABS.forEach(([n,ti])=>{if(cur>=ti)active=ti});
  $$('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===active));
  $('#prev').disabled=cur===0;$('#next').disabled=cur===S.length-1;
  st.enter&&st.enter();
}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#say').onclick=()=>{const st=S[cur];const lines=st.st!==undefined?ST[st.st].lines:st.guide;speak(lines.join(''))};
document.addEventListener('keydown',e=>{if(e.target.closest('input,.v,.ln,.cell'))return;if(e.key===' '&&S[cur].st!==undefined){e.preventDefault();nextLine()}if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
go(0);
</script>
</body>
</html>
