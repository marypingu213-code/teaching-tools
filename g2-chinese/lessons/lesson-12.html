<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第十二課 戴斗笠的地藏｜課文動起來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --bg:#DDE7EA; --panel:#FFFFFF; --ink:#1F2A30; --soft:#5C6C74;
  --teal:#2F6F78; --straw:#C9A04A; --red:#C8362B; --gold:#E8A33A;
  --c-p:#2E8B57; --c-m:#8E5AD6; --c-e:#D9342B; --c-q:#2E6FB3;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#141C20; --panel:#1F2A30; --ink:#EAF1F3; --soft:#A9BAC1; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--kai);background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:1.2vw;padding:1vh 1.6vw .8vh;flex-wrap:wrap}
h1{margin:0;font-size:4.2vh;color:var(--teal);letter-spacing:.1em;white-space:nowrap}
h1 small{font-size:.5em;color:var(--soft);letter-spacing:.05em;margin-right:.4em}
h1 em{font-style:normal;font-size:.42em;color:var(--soft);margin-left:.5em;letter-spacing:0}
nav{display:flex;gap:.1vw;flex-wrap:wrap;align-items:center}
nav button{font:inherit;font-size:2.1vh;padding:.5vh .5vw;border-radius:10px;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:.25em}
nav button i{font-style:normal;display:inline-grid;place-items:center;width:2.4vh;height:2.4vh;border-radius:50%;background:var(--teal);color:#fff;font-size:1.5vh}
nav button.on{background:var(--panel);border-color:var(--teal);color:var(--teal);font-weight:700}
nav .sep{color:var(--soft);font-size:1.6vh}
main{display:grid;grid-template-columns:1fr 50vh;gap:1.2vw;padding:0 1.6vw 1.4vh;min-height:0}
.stagewrap{display:grid;grid-template-rows:1fr auto;gap:1vh;min-height:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#D9E4E8;min-height:0}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene>svg{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none;z-index:7}
#tchip{position:absolute;right:2%;top:3%;z-index:6;background:#1F2A30;color:#fff;border-radius:999px;padding:.5vh 1.2vw;font-size:2.6vh;font-weight:700;display:none}
#tchip.on{display:block;animation:pop .4s}
.acts{display:flex;flex-wrap:wrap;gap:.6vw;min-height:6vh;align-items:center}
.acts button{font:inherit;font-size:2.5vh;padding:.8vh 1.2vw;border-radius:999px;border:3px solid var(--teal);background:var(--panel);color:var(--ink);cursor:pointer}
.acts button:hover{background:var(--teal);color:#fff}
button:focus-visible,.v:focus-visible,.rh:focus-visible,.cell:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
aside{background:var(--panel);border-radius:20px;padding:1.4vh 1.4vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:1vh;min-height:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:2.5vh;color:var(--soft);gap:.6vw}
.ptitle b{color:var(--teal);font-size:1.1em}
#rhBtn{font:inherit;font-size:2.2vh;border-radius:999px;border:2px solid #8E5AD6;background:transparent;color:var(--ink);padding:.3vh .8vw;cursor:pointer}
#rhBtn.on{background:#8E5AD6;color:#fff}
.txt{writing-mode:vertical-rl;font-size:3.9vh;line-height:1.9;letter-spacing:.05em;width:100%;height:100%;min-height:0;overflow:auto;display:block}
.txt.long{font-size:3.3vh}
.txt.xlong{font-size:3.05vh}
.v{border:2px solid var(--gold);border-radius:6px;cursor:pointer;color:#1F6FA0;padding:.1em 0}
.v.x{border-style:dashed;border-color:#9AA6B5;color:inherit}
@media (prefers-color-scheme: dark){ .v{color:#86C9F0} }
.rh{border-radius:6px;transition:background .3s}
.rhon .rh{cursor:pointer;background:color-mix(in srgb,var(--rc) 18%,transparent);box-shadow:inset -3px 0 0 var(--rc)}
.rhon .rh::before{content:attr(data-l);font-size:.5em;background:var(--rc);color:#fff;border-radius:4px;padding:.1em .15em;margin-bottom:.2em;font-weight:700;letter-spacing:0}
.rhleg{display:none;gap:.4vw;font-size:2vh;flex-wrap:wrap}
.rhon~.rhleg,.legon{display:flex}
.rhleg span{color:#fff;border-radius:6px;padding:.1vh .5vw}
.pnav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.8vh}
.pnav button{font:inherit;font-size:2.6vh;padding:1vh 0;border-radius:12px;border:2px solid var(--soft);background:transparent;color:var(--ink);cursor:pointer}
.pnav .say{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.pnav button:disabled{opacity:.35}
.foot{grid-row:3}
#pop{position:fixed;left:3vw;bottom:13vh;max-width:50vw;background:#fff;color:#1F2A30;border:4px solid var(--gold);border-radius:16px;padding:1.4vh 1.6vw;font-size:3vh;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:20}
#pop.on{display:block;animation:pop .3s}
#pop h3{margin:0 0 .4vh;color:#2F6F78;font-size:1.25em}
#pop .why{background:#F3EEFF;border-radius:10px;padding:.6vh .8vw;margin-top:.6vh;font-size:.92em}
#pop .row{display:flex;gap:1vw;margin-top:.8vh}
#pop button{font:inherit;font-size:.85em;border-radius:10px;border:2px solid #2F6F78;background:#fff;color:#2F6F78;padding:.3vh 1vw;cursor:pointer}

.badge{position:absolute;background:#fff;color:#1F2A30;border:4px solid var(--teal);border-radius:14px;padding:.6vh 1.1vw;font-size:2.9vh;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.6,1);white-space:nowrap;z-index:8}
.badge.gold{border-color:var(--gold)}.badge.red{border-color:var(--red)}
.badge small{display:block;font-weight:400;font-size:.78em;color:#55636A}
.bubble{position:absolute;background:#fff;color:#1F2A30;border:4px solid #1F2A30;border-radius:18px;padding:.7vh 1vw;font-size:2.7vh;line-height:1.45;max-width:46%;animation:pop .3s cubic-bezier(.3,1.6,.6,1);z-index:8}
.bubble b{display:block;font-size:.85em;color:#2F6F78}
.bubble.faint{opacity:.75;border-style:dashed}
.bub{position:absolute;font-size:4.8vh;font-weight:700;color:#fff;-webkit-text-stroke:2px #2F6F78;paint-order:stroke fill;animation:floatup 1.9s ease-out forwards;z-index:8}
@keyframes floatup{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1)}to{transform:translateY(-90px);opacity:0}}
.chain{position:absolute;left:3%;top:4%;display:flex;gap:1vw;align-items:center;z-index:8}
.chain span{background:#fff;border:4px solid var(--straw);border-radius:14px;padding:.6vh 1vw;font-size:3vh;font-weight:700;animation:pop .4s both}
.chain i{font-style:normal;font-size:3vh;animation:pop .4s both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.lbl{font-family:var(--kai);font-weight:700}

/* svg anim */
.mv{transition:transform 1.4s ease-in-out,opacity .8s}
.bd{transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s}
.walk .bd{animation:walk .45s ease-in-out infinite alternate}
@keyframes walk{to{transform:translateY(-6px) rotate(2deg)}}
.bow .bd{transform:rotate(-18deg)}
.shake .bd{animation:shk .1s linear 10}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.happy .mS{display:none}.happy .mH{display:inline}.mH{display:none}
.sad .mS{display:none}.sad .mF{display:inline}.mF{display:none}
.flake{animation:snow 6s linear infinite}
@keyframes snow{from{transform:translate(0,-40px)}to{transform:translate(40px,620px)}}
.heavy .flake{animation-duration:2.6s}
.hidehat .packH{display:none}
.noscarf .scarfH{display:none}
.kasa,.jscarf{display:none}
.wearhat .kasa,.wearscarf .jscarf{display:inline;animation:pop .5s}
.jsnow{transition:opacity .8s}.cleared .jsnow{opacity:0}
.jz{transform-box:fill-box;transform-origin:50% 100%}
.jz.hi .bd{animation:hop .3s ease-in-out 2 alternate}
@keyframes hop{to{transform:translateY(-14px)}}
.sing .bd{animation:hop .4s ease-in-out infinite alternate}
.stackH{opacity:0;transition:opacity .4s}.stackH.on{opacity:1}
#v3fog{transition:opacity 4s}
#dusk5{opacity:0;transition:opacity 3s}.dusk #dusk5{opacity:.55}
.passer{transition:transform 6s linear}
.passing .passer{transform:translateX(1300px)}
.passing .passer.b{transform:translateX(-1300px)}
#steam5 path{animation:steam 2.4s ease-out infinite}
@keyframes steam{from{transform:translateY(0);opacity:.9}to{transform:translateY(-60px);opacity:0}}
#clump{transition:transform 1s cubic-bezier(.5,0,1,1)}
.dropc #clump{transform:translateY(190px)}
#notes8 text{animation:noteup 2.4s linear infinite}
@keyframes noteup{from{transform:translate(0,0);opacity:0}20%{opacity:1}to{transform:translate(-60px,-120px);opacity:0}}
#notes8,#gifts9 .gift{opacity:0;transition:opacity .6s}
.music #notes8{opacity:1}
.gift{transform-box:fill-box;transform-origin:50% 100%}
.gifts .gift{opacity:1;animation:pop .5s both}
#door9{transition:transform 1.2s;transform-box:fill-box;transform-origin:0 50%}
.opened #door9{transform:scaleX(.08)}
#mapJ{opacity:0;transition:opacity .6s}.showmap #mapJ{opacity:1}
#heart7{opacity:0;transition:opacity .6s}.love #heart7{opacity:1}

/* html */
.html{background:linear-gradient(#E9F0F2,#F8FBFC)}
.rcards{position:absolute;inset:3% 3% auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw}
.rcard{background:#fff;border-radius:16px;border:4px solid var(--rc);padding:1.2vh .8vw;color:#1F2A30;cursor:pointer;font:inherit;text-align:left}
.rcard h4{margin:0 0 .6vh;color:var(--rc);font-size:3.6vh}
.rcard p{margin:0;font-size:2.3vh;line-height:1.5}
.rcard.on{background:color-mix(in srgb,var(--rc) 12%,#fff)}
.rex{position:absolute;left:3%;right:3%;top:42%;bottom:4%;background:#fff;border-radius:16px;padding:2vh 2vw;color:#1F2A30;font-size:3vh;line-height:1.7;overflow:auto}
.rex .q{font-size:4vh;font-weight:700;margin:1vh 0 2vh}
.rex .opts{display:flex;gap:1vw;flex-wrap:wrap}
.rex .opts button{font:inherit;font-size:3.6vh;padding:1vh 2vw;border-radius:16px;border:4px solid var(--rc);background:#fff;color:var(--rc);cursor:pointer;font-weight:700}
.rex .fb{font-size:3vh;min-height:4.5vh;margin-top:1.6vh}
.rex .tagq{font-size:2.2vh;color:#fff;border-radius:6px;padding:.1vh .6vw;margin-right:.6vw}
.ce{position:absolute;inset:3%;display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:1.4vw;color:#1F2A30}
.cebox{background:#fff;border-radius:18px;padding:2vh 1.2vw;text-align:center;font-size:2.8vh;line-height:1.6;display:flex;flex-direction:column;gap:1vh;justify-content:center}
.cebox .em{font-size:8vh;line-height:1}
.cebox h4{margin:0;font-size:3.6vh}
.ceq{display:flex;flex-direction:column;gap:1.2vh;justify-content:center}
.ceq .q{font-size:3.2vh;font-weight:700;text-align:center;background:#FFF2D6;border-radius:14px;padding:1vh}
.ceq button{font:inherit;font-size:2.8vh;padding:1.2vh .8vw;border-radius:14px;border:3px solid #2F6F78;background:#fff;color:#1F2A30;cursor:pointer}
.ceq button.right{background:#2E8B57;color:#fff;border-color:#2E8B57}
.ceq button.wrong{opacity:.5}
.ceq .chainr{display:none;font-size:2.6vh;line-height:1.6;background:#E9F6EE;border-radius:14px;padding:1vh 1vw}
.ceq .chainr.on{display:block;animation:pop .4s}
.wgrid{position:absolute;inset:4% 4%;display:grid;grid-template-columns:13% 1fr;grid-template-rows:repeat(5,1fr);gap:1.2vh;font-size:3vh;color:#1F2A30}
.wgrid .k{display:flex;align-items:center;justify-content:center;font-size:5.4vh;font-weight:700;color:#fff;background:#2F6F78;border-radius:14px}
.cell{position:relative;background:#fff;border-radius:14px;padding:.6vh 1.4vw;display:flex;align-items:center;cursor:pointer;line-height:1.45;overflow:hidden}
.cell .cover{position:absolute;inset:0;background:#F2C14E;display:flex;align-items:center;justify-content:center;font-size:3vh;color:#6A4A00;transition:transform .45s}
.cell.open .cover{transform:translateY(-102%)}
.quiz{position:absolute;inset:0;background:rgba(20,28,32,.84);display:none;align-items:center;justify-content:center;z-index:9}
.quiz.on{display:flex}
.qbox{background:#fff;color:#1F2A30;border-radius:20px;padding:3vh 3vw;text-align:center;min-width:55%}
.qword{font-size:6.6vh;font-weight:700;color:#2F6F78;margin:1vh 0 2vh}
.qbtns{display:flex;gap:1.2vw;justify-content:center}
.qbtns button{font:inherit;font-size:5vh;width:11vh;height:11vh;border-radius:50%;border:4px solid #2F6F78;background:#fff;color:#2F6F78;cursor:pointer}
.qfb{font-size:3.4vh;min-height:5vh;margin-top:2vh}
.qbox .close{font:inherit;font-size:2.4vh;margin-top:1vh;background:none;border:2px solid #999;border-radius:10px;padding:.4vh 1.2vw;cursor:pointer}

@media (max-width:820px), (max-aspect-ratio:1/1){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  .stage{height:58vh}
  .txt,.txt.long{writing-mode:horizontal-tb;height:auto;font-size:21px}
  .acts button,.pnav button,nav button{font-size:15px}
  h1{font-size:24px}
  .rcards{grid-template-columns:repeat(2,1fr)}
  .rex{top:52%}
  .ce{grid-template-columns:1fr;overflow:auto}
}
@media (prefers-reduced-motion: reduce){ .flake,#steam5 path{animation:none} }
a.hall-back{position:fixed;z-index:40;top:0;right:0;font-family:var(--kai);font-size:1.7vh;line-height:1.2;padding:.45vh .8vw;white-space:nowrap;background:var(--panel);color:var(--soft);text-decoration:none;border:1px solid var(--soft);border-top:0;border-right:0;border-bottom-left-radius:12px}a.hall-back:hover,a.hall-back:focus-visible{color:var(--ink)}
</style>
</head>
<body>
<a class="hall-back" href="../">← 回課文大廳</a>
<header>
  <h1><small>第十二課</small>戴斗笠的地藏<em>改寫自日本民間故事</em></h1>
  <nav id="tabs"></nav>
</header>

<main>
  <div class="stagewrap">
    <div class="stage" id="stage">
      <div class="scene" id="sc-1"><svg id="v1" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene" id="sc-2"><svg id="v2" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene" id="sc-3"><svg id="v3" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene" id="sc-4"><svg id="v4" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene" id="sc-5"><svg id="v5" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene" id="sc-6"><svg id="v6" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene" id="sc-7"><svg id="v7" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene" id="sc-8"><svg id="v8" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene" id="sc-9"><svg id="v9" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>

      <div class="scene html" id="sc-rh">
        <div class="rcards" id="rcards"></div>
        <div class="rex" id="rex"></div>
      </div>
      <div class="scene html" id="sc-ce">
        <div class="ce">
          <div class="cebox"><div class="em">❄️🥺</div><h4>故事開始</h4><div>老夫妻很貧苦。<br>老婆婆想嘗嘗年糕，<br>老爺爺卻一頂斗笠<br>也沒賣出去。</div></div>
          <div class="ceq" id="ceq"></div>
          <div class="cebox"><div class="em">🍙🐟🥬🍡</div><h4>故事結局</h4><div>門外堆滿白米、<br>青菜和魚，還有<br>老婆婆想吃的年糕！</div></div>
        </div>
      </div>
      <div class="scene html" id="sc-w">
        <div class="wgrid" id="wgrid"></div>
        <div class="quiz" id="quiz"><div class="qbox">
          <div style="font-size:3vh">這個詞是 人、事、時、地、物 的哪一種？</div>
          <div class="qword" id="qword"></div><div class="qbtns" id="qbtns"></div><div class="qfb" id="qfb"></div>
          <button class="close" id="qclose">結束練習</button>
        </div></div>
      </div>

      <div id="tchip"></div>
      <div id="ov"></div>
    </div>
    <div class="acts" id="acts"></div>
  </div>

  <aside>
    <div class="ptitle"><span id="ptag"></span><button id="rhBtn" aria-pressed="false">🔍 修辭</button><b id="pno"></b></div>
    <div class="txt" id="txt"></div>
    <div class="foot">
      <div class="rhleg" id="rhleg" style="margin-bottom:.8vh"><span style="background:var(--c-p)">擬人</span><span style="background:var(--c-m)">譬喻</span><span style="background:var(--c-e)">感嘆</span><span style="background:var(--c-q)">設問</span><small style="color:var(--soft)">點有顏色的句子看說明</small></div>
      <div class="pnav">
        <button id="prev">◀ 上一段</button>
        <button id="say" class="say">🔊 念給我聽</button>
        <button id="next">下一段 ▶</button>
      </div>
    </div>
  </aside>
</main>

<div id="pop"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
let timers=[];
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;}
function stopAll(){timers.forEach(clearTimeout);timers=[];try{speechSynthesis.cancel()}catch(e){};$('#ov').innerHTML='';$('#pop').classList.remove('on');}
function ov(html,style,cls='badge'){const d=document.createElement('div');d.className=cls;d.innerHTML=html;Object.assign(d.style,style||{});$('#ov').appendChild(d);return d;}
function temp(html,style,cls,ms=2000){const d=ov(html,style,cls);setTimeout(()=>d.remove(),ms);return d;}
function say1(html,cls=''){$('#ov').querySelectorAll('.badge').forEach(b=>b.remove());return ov(html,{left:'3%',top:'4%'},'badge '+cls)}
function bubbles(words,area){words.forEach((w,i)=>later(()=>temp(w,{left:(area.x+Math.random()*area.w)+'%',top:(area.y+Math.random()*area.h)+'%'},'bub',1950),i*(area.gap||300)))}
const clean=t=>t.replace(/\(@[^|]+\|/g,'').replace(/@\)/g,'').replace(/\[\[|\]\]|\{\{|\}\}/g,'');
function speak(text,pitch=1){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(text));u.lang='zh-TW';u.rate=.8;u.pitch=pitch;const v=speechSynthesis.getVoices().find(v=>/zh[-_]TW/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
function replay(node,c,ms){node.classList.remove(c);void node.getBoundingClientRect();node.classList.add(c);if(ms)later(()=>node.classList.remove(c),ms);}
function bubbleAt(id,who,text,ms=3800,cls=''){later(()=>{const n=$('#'+id+' .bd')||$('#'+id);const b=n.getBoundingClientRect(),s=$('#stage').getBoundingClientRect();const d=ov(`<b>${who}</b>${text}`,{},'bubble '+cls);const W=d.offsetWidth,H=d.offsetHeight;let x=b.left-s.left+b.width/2-W/2,y=b.top-s.top-H-12;x=Math.max(8,Math.min(s.width-W-8,x));if(y<8)y=8;d.style.left=x+'px';d.style.top=y+'px';later(()=>d.remove(),ms)},60);}

/* ---------- music ---------- */
let AC=null;function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC}
function song(){const a=ac();if(!a)return;const N=[440,494,523,587,659,784];const m=[2,3,4,4,3,2,1,2,3,3,2,1,0,1,2,2];let t=a.currentTime+.05;m.forEach(n=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=N[n];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.45);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.5);t+=.42});}

/* ---------- navigation ---------- */
const TABS=[['老夫妻',0,1],['心願',1,2],['風雪',2,3],['地藏',3,4],['叫賣',4,5],['戴斗笠',5,6],['回家',6,7],['歌聲',7,8],['驚喜',8,9],['修辭',9],['結局原因',10],['人事時地物',11]];
TABS.forEach(([n,i,num],k)=>{if(k===9)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">｜</span>');else if(k>0&&k<9)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">›</span>');
  const b=document.createElement('button');b.innerHTML=(num?`<i>${num}</i>`:'')+n;b.onclick=()=>go(i);b.dataset.i=i;$('#tabs').appendChild(b)});
let cur=0,rhOn=false;
function renderText(t){
  let h=t.replace(/\(@([^|]+)\|([^|]+)\|(.+?)@\)/g,(m,types,key,inner)=>{const ts=types.split(',');return `<span class="rh" role="button" tabindex="0" data-t="${types}" data-k="${key}" data-l="${ts.join('＋')}" style="--rc:var(--c-${RH[ts[0]][0]})">${inner}</span>`});
  h=h.replace(/\[\[(.+?)\]\]/g,(m,w)=>`<span class="v" role="button" tabindex="0" data-w="${w}">${w}</span>`).replace(/\{\{(.+?)\}\}/g,(m,w)=>`<span class="v x" role="button" tabindex="0" data-w="${w}">${w}</span>`);
  return h;}
function go(i){
  stopAll();cur=Math.max(0,Math.min(S.length-1,i));const st=S[cur];
  $$('.scene').forEach(s=>s.classList.toggle('on',s.id==='sc-'+st.sc));
  resetAll();
  const tc=$('#tchip');if(st.time){tc.textContent='🕒 '+st.time;tc.classList.add('on')}else tc.classList.remove('on');
  $('#ptag').textContent=st.tag;$('#pno').textContent=st.no;
  const t=$('#txt');t.classList.toggle('long',!!st.long);t.classList.toggle('xlong',!!st.xlong);t.innerHTML=renderText(st.text);
  t.querySelectorAll('.v').forEach(v=>{v.onclick=e=>{e.stopPropagation();showVocab(v.dataset.w)};v.onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();showVocab(v.dataset.w)}}});
  t.querySelectorAll('.rh').forEach(r=>{const f=()=>{if(rhOn)showRh(r.dataset.t.split(','),r.dataset.k,r.textContent)};r.onclick=f;r.onkeydown=e=>{if(e.key==='Enter')f()}});
  t.scrollTop=0;t.scrollLeft=0;
  const A=$('#acts');A.innerHTML='';st.acts.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{ac();f()};A.appendChild(b)});
  let active=0;TABS.forEach(([n,ti])=>{if(cur>=ti)active=ti});
  $$('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===active));
  $('#prev').disabled=cur===0;$('#next').disabled=cur===S.length-1;
  st.enter&&st.enter();
}
$('#rhBtn').onclick=()=>{rhOn=!rhOn;$('#txt').classList.toggle('rhon',rhOn);$('#rhleg').classList.toggle('legon',rhOn);$('#rhBtn').classList.toggle('on',rhOn);$('#rhBtn').setAttribute('aria-pressed',rhOn);if(rhOn&&!$('#txt .rh'))temp('這一段沒有標示修辭，換一段看看！',{left:'50%',top:'45%',transform:'translateX(-50%)'},'badge',2000);};
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#say').onclick=()=>speak(S[cur].text);
document.addEventListener('keydown',e=>{if(e.target.closest('.v,.rh,.cell'))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
go(0);
</script>
</body>
</html>
