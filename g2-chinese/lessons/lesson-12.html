<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二上第十二課 到野外上課｜課文動起來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --bg:#E8F1E6; --panel:#FFFFFF; --ink:#22302A; --soft:#5E6E66;
  --green:#3E9A6A; --gold:#E8A33A; --blue:#2E7FC1; --pink:#E86A8A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#152019; --panel:#202D25; --ink:#EDF5F0; --soft:#AFC3B8; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--kai);background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:1.2vw;padding:1vh 1.6vw .8vh;flex-wrap:wrap}
h1{margin:0;font-size:4.4vh;color:var(--green);letter-spacing:.12em;white-space:nowrap}
h1 small{font-size:.5em;color:var(--soft);letter-spacing:.05em;margin-right:.4em}
h1 em{font-style:normal;font-size:.45em;color:var(--soft);margin-left:.5em;letter-spacing:0}
nav{display:flex;gap:.25vw;flex-wrap:wrap;align-items:center}
nav button{font:inherit;font-size:2.4vh;padding:.5vh .7vw;border-radius:10px;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:.3em}
nav button i{font-style:normal;display:inline-grid;place-items:center;width:2.7vh;height:2.7vh;border-radius:50%;background:var(--green);color:#fff;font-size:1.7vh}
nav button.on{background:var(--panel);border-color:var(--green);color:var(--green);font-weight:700}
nav .sep{color:var(--soft)}
main{display:grid;grid-template-columns:1fr 44vh;gap:1.2vw;padding:0 1.6vw 1.4vh;min-height:0}
.stagewrap{display:grid;grid-template-rows:1fr auto;gap:1vh;min-height:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#D3E8D6;min-height:0}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene>svg{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none;z-index:7}
.acts{display:flex;flex-wrap:wrap;gap:.7vw;min-height:6vh;align-items:center}
.acts button{font:inherit;font-size:2.7vh;padding:.9vh 1.4vw;border-radius:999px;border:3px solid var(--green);background:var(--panel);color:var(--ink);cursor:pointer}
.acts button:hover{background:var(--green);color:#fff}
.acts button.main{background:var(--green);color:#fff;font-weight:700}
.acts .hint{font-size:2.3vh;color:var(--soft)}
button:focus-visible,.v:focus-visible,.ln:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
aside{background:var(--panel);border-radius:20px;padding:1.6vh 1.4vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:1vh;min-height:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh;color:var(--soft)}
.ptitle b{color:var(--green);font-size:1.15em}
.txt{writing-mode:vertical-rl;font-size:4.6vh;line-height:1.55;letter-spacing:.1em;width:100%;height:100%;min-height:0;overflow:auto;display:block}
.ln{display:block;cursor:pointer;border-radius:10px;padding:.3vh 0;transition:background .3s}
.ln:hover{background:rgba(0,0,0,.05)}
.ln.on{background:#FFE7A8;color:#22302A}
.ln.done{color:var(--soft)}
.guide .ln{cursor:default;font-size:.8em}
.txt.long{font-size:4vh}
.v{border:2px solid var(--gold);border-radius:6px;cursor:pointer;color:#1F6FA0;padding:.1em 0}
.v.b{border-color:transparent;color:#1F6FA0}
@media (prefers-color-scheme: dark){ .v,.v.b{color:#86C9F0} .ln.on .v{color:#1F6FA0} }
.pnav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.8vh}
.pnav button{font:inherit;font-size:2.6vh;padding:1vh 0;border-radius:12px;border:2px solid var(--soft);background:transparent;color:var(--ink);cursor:pointer}
.pnav .say{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.pnav button:disabled{opacity:.35}
#pop{position:fixed;left:3vw;bottom:13vh;max-width:48vw;background:#fff;color:#22302A;border:4px solid var(--gold);border-radius:16px;padding:1.4vh 1.6vw;font-size:3.2vh;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:20}
#pop.on{display:block;animation:pop .3s}
#pop h3{margin:0 0 .4vh;color:#2E7A52;font-size:1.3em}
#pop .row{display:flex;gap:1vw;margin-top:.8vh}
#pop button{font:inherit;font-size:.85em;border-radius:10px;border:2px solid #2E7A52;background:#fff;color:#2E7A52;padding:.3vh 1vw;cursor:pointer}

.badge{position:absolute;background:#fff;color:#22302A;border:4px solid var(--green);border-radius:14px;padding:.6vh 1.2vw;font-size:3.2vh;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.6,1);white-space:nowrap;z-index:8}
.badge.gold{border-color:var(--gold)}.badge.blue{border-color:var(--blue)}
.badge .eq{color:#C8362B}
.lens{position:absolute;font-size:9vh;animation:search 3s ease-in-out forwards;z-index:8}
@keyframes search{0%{left:15%;top:55%}33%{left:60%;top:25%}66%{left:30%;top:20%}100%{left:70%;top:50%;opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.lbl{font-family:var(--kai);font-weight:700}

/* scene */
.ov{opacity:0;transition:opacity .9s}
#F.s1.a1 #bookOv,#F.s1.a2 #modelOv,#F.s1.a4 #photos,
#F.s2.a1 #paperOv,#F.s2.a3 #rainbow,#F.s2.a4 #paletteOv,
#F.s3.a2 #animals,#F.s3.a5 #homes{opacity:1}
#F.s2.a3 #drops{opacity:1}
#insects{display:none}#F.s1.a3 #insects,#F.s2 #insects{display:inline}
.fly1{animation:fly1 6s ease-in-out infinite}
.fly2{animation:fly2 7s ease-in-out infinite}
@keyframes fly1{0%,100%{transform:translate(0,0)}25%{transform:translate(120px,-40px)}50%{transform:translate(220px,10px)}75%{transform:translate(90px,50px)}}
@keyframes fly2{0%,100%{transform:translate(0,0)}25%{transform:translate(-110px,30px)}50%{transform:translate(-200px,-30px)}75%{transform:translate(-80px,-60px)}}
.wing{transform-box:fill-box;transform-origin:50% 100%;animation:flap .12s linear infinite alternate}
@keyframes flap{to{transform:scaleY(.3)}}
.bwing{transform-box:fill-box;animation:bflap .35s ease-in-out infinite alternate}
.bwing.l{transform-origin:100% 50%}.bwing.r{transform-origin:0 50%}
@keyframes bflap{to{transform:scaleX(.35)}}
.photo{transform-box:fill-box;transform-origin:50% 0;animation:swing 2s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
#kids{transform:translateX(420px);transition:transform 2.4s ease-out}
#F:not(.s1) #kids,#F.s1.a0 #kids{transform:translateX(0)}
#F.s1.a0:not(.a1) .kid .bd{animation:bob .3s ease-in-out infinite alternate}
.bd{transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{to{transform:translateY(-8px)}}
#branchTip{fill:#8A6A4A;transition:fill .6s}#F.s2.a2 #branchTip{fill:#E86A8A}
#stroke{stroke-dasharray:600;stroke-dashoffset:600;transition:stroke-dashoffset 2.5s ease-in-out .3s}
#F.s2.a2 #stroke{stroke-dashoffset:0}
#F.s2.a2 #kidB .arm{animation:paint .5s ease-in-out infinite alternate}
.arm{transform-box:fill-box;transform-origin:50% 100%}
@keyframes paint{from{transform:rotate(-20deg)}to{transform:rotate(15deg)}}
.drop{animation:dropf 1.6s ease-in infinite}
@keyframes dropf{from{transform:translateY(0);opacity:1}to{transform:translateY(120px);opacity:0}}
#rainbow path{stroke-dasharray:900;stroke-dashoffset:900;transition:stroke-dashoffset 2s}
#F.s2.a3 #rainbow path{stroke-dashoffset:0}
#meadow,#forest{transition:opacity 1s}
#forest{opacity:0}#F.s3 #forest{opacity:1}#F.s3 #meadow{opacity:0}
#maze{stroke-dasharray:14 10;opacity:0;transition:opacity .6s}#F.s3.a1 #maze{opacity:1;animation:dash 1.5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-48}}
#mazeKids{opacity:0}#F.s3.a1 #mazeKids{opacity:1}
#F.s3.a1 #mazeKids>g{animation:maze 6s ease-in-out infinite}
@keyframes maze{0%{transform:translate(140px,500px)}25%{transform:translate(320px,430px)}50%{transform:translate(260px,330px)}75%{transform:translate(460px,300px)}100%{transform:translate(620px,250px)}}
.ani{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.6,1)}
#F.s3.a2 .ani{transform:scale(1)}
.fish{animation:fishj 2.4s ease-in-out infinite}
@keyframes fishj{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-14px)}}

/* html pages */
.html{background:linear-gradient(#EEF6EE,#FAFDFA)}
.dy{position:absolute;inset:3%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr;gap:1.2vh 1.2vw;color:#22302A}
.dcard{background:#fff;border-radius:18px;border:4px solid var(--c);padding:1.2vh 1vw;display:flex;flex-direction:column;gap:.8vh}
.dcard h4{margin:0;font-size:5vh;color:var(--c);display:flex;align-items:center;gap:.6vw}
.dcard h4 span{font-size:.55em;background:var(--c);color:#fff;border-radius:10px;padding:.2vh .6vw}
.dcard .ws{display:flex;gap:.6vw;flex-wrap:wrap}
.dcard .ws button{font:inherit;font-size:3.2vh;padding:.4vh 1vw;border-radius:12px;border:3px solid var(--c);background:#fff;color:#22302A;cursor:pointer}
.dsent{grid-column:1/-1;background:#fff;border-radius:16px;padding:1.2vh 1vw;font-size:3.1vh;line-height:1.7;cursor:pointer}
.dsent .t{color:#E86A8A;font-weight:700}.dsent .d{color:#2E7FC1;font-weight:700}
.dq{grid-column:1/-1;background:#fff;border-radius:16px;padding:1.4vh 1.2vw;font-size:3.1vh;line-height:1.6}
.dq .w{font-size:6vh;font-weight:700;margin:.6vh 0}
.dq .opts{display:flex;gap:1.2vw}
.dq .opts button{font:inherit;font-size:4vh;padding:.6vh 2vw;border-radius:14px;border:4px solid var(--c);color:var(--c);background:#fff;cursor:pointer;font-weight:700}
.dq .fb{min-height:4vh}
.note{font-size:2.6vh;background:#FFF2D6;border-radius:12px;padding:.8vh .8vw;line-height:1.5}
.ws2{position:absolute;inset:3%;display:grid;grid-template-columns:1fr auto;gap:1.2vw;color:#22302A}
.sheet{background:#F4FAFB;border:4px solid #9CC3C8;border-radius:18px;padding:1.4vh 1.4vw;writing-mode:vertical-rl;font-size:3.4vh;line-height:2.1;overflow:auto}
.sheet h3{margin:0 0 0 1.4vw;font-size:4vh;color:#2E7A82;letter-spacing:.3em}
.sheet .sec{margin-left:1.4vw;padding-left:1.4vw;border-left:3px dashed #9CC3C8}
.sheet .sec b{color:#E8762A}
.blankB{display:inline-flex;align-items:center;justify-content:center;writing-mode:horizontal-tb;min-width:6.5vh;min-height:6.5vh;border:3px solid #2E7A82;border-radius:10px;background:#fff;font:inherit;font-size:2.8vh;cursor:pointer;margin:.3vh 0;color:#22302A;vertical-align:middle;padding:.2vh .3vw;position:relative}
.blankB i{position:absolute;top:-1.2vh;right:-1.2vh;font-style:normal;background:#E8762A;color:#fff;border-radius:50%;width:2.6vh;height:2.6vh;font-size:1.7vh;display:grid;place-items:center}
.blankB.sel{border-color:#E8762A;box-shadow:0 0 0 4px #FFD9A8}
.blankB.ok{background:#E9F6EE;border-color:#2E8B57;color:#2E7A52;font-weight:700}
.bank{background:#fff;border-radius:18px;padding:1.4vh 1vw;display:flex;flex-direction:column;gap:1vh;width:22vh}
.bank h4{margin:0;font-size:3vh;color:#2E7A82}
.bank button{font:inherit;font-size:3vh;padding:.6vh 0;border-radius:12px;border:3px solid #E8762A;background:#fff;color:#22302A;cursor:pointer}
.bank button.used{opacity:.3}
.sp{position:absolute;inset:3%;display:grid;grid-template-columns:1fr 1fr;gap:1.4vw;color:#22302A}
.spl,.spr{background:#fff;border-radius:18px;padding:1.4vh 1.2vw;display:flex;flex-direction:column;gap:.8vh;overflow:auto}
.spl h4,.spr h4{margin:0;font-size:3.2vh;color:#2E7A52}
.ph{display:flex;gap:.4vw;align-items:center;font-size:3vh;font-weight:700;flex-wrap:wrap}
.ph .k{color:#22302A}.ph .p{background:#FDE3EA;border-radius:10px;padding:.2vh .6vw;color:#C8466A}.ph .d{background:#DDEFFC;border-radius:10px;padding:.2vh .6vw;color:#2E6FB3}
.exs{display:flex;flex-direction:column;gap:.5vh}
.exs div{background:#F6F8F4;border-radius:10px;padding:.4vh .8vw;font-size:2.9vh;cursor:pointer}
.slot h5{margin:.3vh 0;font-size:2.4vh;color:#5E6E66}
.chips{display:flex;flex-wrap:wrap;gap:.5vh}
.chips button{font:inherit;font-size:2.6vh;padding:.3vh .9vw;border-radius:999px;border:3px solid var(--c);background:#fff;color:#22302A;cursor:pointer}
.chips button.on{background:var(--c);color:#fff}
.mysent{font-size:3.6vh;font-weight:700;background:#FFF8E6;border:4px dashed #E8A33A;border-radius:14px;padding:.8vh 1vw;line-height:1.5}
.mysent .bl{color:#B9B2A0}
.idi{position:absolute;inset:3%;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:1.2vh;color:#22302A}
.ihead{background:#fff;border:4px solid #2E7FC1;border-radius:18px;padding:1.4vh 1.4vw;font-size:3.1vh;line-height:1.7}
.ihead h3{margin:0;font-size:5vh;color:#2E7FC1}
.ihead .mean{background:#EEF6E8;border-radius:12px;padding:.6vh .8vw;margin-top:.6vh}
.ihead .ex{background:#FFF2D6;border-radius:12px;padding:.6vh .8vw;margin-top:.6vh}
.ihead .lk{background:#FDE7DA;border-radius:12px;padding:.6vh .8vw;margin-top:.6vh;font-weight:700;color:#B5481F}
.hz{color:#C8362B;font-size:1.15em}
.tf{background:#fff;border-radius:18px;padding:1.4vh 1.4vw;font-size:3.1vh;line-height:1.6;overflow:auto}
.tf .q{font-size:3.8vh;font-weight:700;margin:.8vh 0}
.tf .opts{display:flex;gap:1.4vw}
.tf .opts button{font:inherit;font-size:3.6vh;padding:.6vh 2vw;border-radius:14px;border:4px solid #2E7FC1;background:#fff;color:#22302A;cursor:pointer;font-weight:700}
.tf .fb{min-height:4.5vh;margin-top:.8vh}

@media (max-width:820px), (max-aspect-ratio:1/1){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  .stage{height:60vh}
  .txt{writing-mode:horizontal-tb;height:auto;font-size:22px}
  .acts button,.pnav button,nav button{font-size:16px}
  h1{font-size:26px}
  .dy,.sp{grid-template-columns:1fr;overflow:auto}.ws2{grid-template-columns:1fr;overflow:auto}.sheet{writing-mode:horizontal-tb}
}
@media (prefers-reduced-motion: reduce){ .fly1,.fly2,.wing,.bwing,.photo,.fish{animation:none} }
a.hall-back{position:fixed;z-index:40;top:0;right:0;font-family:var(--kai);font-size:1.7vh;line-height:1.2;padding:.45vh .8vw;white-space:nowrap;background:var(--panel);color:var(--soft);text-decoration:none;border:1px solid var(--soft);border-top:0;border-right:0;border-bottom-left-radius:12px}a.hall-back:hover,a.hall-back:focus-visible{color:var(--ink)}
</style>
</head>
<body>
<a class="hall-back" href="../">← 回課文大廳</a>
<header>
  <h1><small>二上第十二課</small>到野外上課<em>牧也</em></h1>
  <nav id="tabs"></nav>
</header>

<main>
  <div class="stagewrap">
    <div class="stage" id="stage">
      <div class="scene" id="sc-f"><svg id="F" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene html" id="sc-diao"><div class="dy" id="dy"></div></div>
      <div class="scene html" id="sc-key"><div class="ws2"><div class="sheet" id="sheet"></div><div class="bank" id="bank"></div></div></div>
      <div class="scene html" id="sc-ph"><div class="sp"><div class="spl" id="phl"></div><div class="spr" id="phr"></div></div></div>
      <div class="scene html" id="sc-idiom"><div class="idi" id="idi"></div></div>
      <div id="ov"></div>
    </div>
    <div class="acts" id="acts"></div>
  </div>

  <aside>
    <div class="ptitle"><span id="ptag"></span><b id="pno"></b></div>
    <div class="txt" id="txt"></div>
    <div class="pnav">
      <button id="prev">◀ 上一頁</button>
      <button id="say" class="say">🔊 念給我聽</button>
      <button id="next">下一頁 ▶</button>
    </div>
  </aside>
</main>

<div id="pop"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
let timers=[];let autoOn=false;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;}
function stopAll(){timers.forEach(clearTimeout);timers=[];autoOn=false;try{speechSynthesis.cancel()}catch(e){};$('#ov').innerHTML='';$('#pop').classList.remove('on');}
function ov(html,style,cls='badge'){const d=document.createElement('div');d.className=cls;d.innerHTML=html;Object.assign(d.style,style||{});$('#ov').appendChild(d);return d;}
function temp(html,style,cls,ms=2000){const d=ov(html,style,cls);setTimeout(()=>d.remove(),ms);return d;}
function say1(html,cls=''){$('#ov').querySelectorAll('.badge').forEach(b=>b.remove());return ov(html,{left:'3%',top:'4%'},'badge '+cls)}
const clean=t=>t.replace(/\[\[|\]\]|\{\{|\}\}/g,'');
function speak(text,onend){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(text));u.lang='zh-TW';u.rate=.72;const v=speechSynthesis.getVoices().find(v=>/zh[-_]TW/i.test(v.lang));if(v)u.voice=v;if(onend)u.onend=onend;speechSynthesis.speak(u);}catch(e){onend&&setTimeout(onend,1500)}}

/* ---------- figures ---------- */
function kid(parent,x,y,s,{shirt,hair,id,bow=false}){const g=el('g',{transform:`translate(${x},${y}) scale(${s})`,class:'kid'},parent);if(id)g.id=id;const bd=el('g',{class:'bd'},g);
  bd.innerHTML=`<rect x="-12" y="-36" width="9" height="34" fill="#F2C9A0"/><rect x="3" y="-36" width="9" height="34" fill="#F2C9A0"/><ellipse cx="-8" cy="-2" rx="9" ry="4" fill="#5A4A3A"/><ellipse cx="8" cy="-2" rx="9" ry="4" fill="#5A4A3A"/>
   <path d="M-22,-34 L-17,-80 L17,-80 L22,-34Z" fill="${shirt}"/>
   <g class="arm"><line x1="16" y1="-74" x2="34" y2="-100" stroke="${shirt}" stroke-width="8" stroke-linecap="round"/><circle cx="35" cy="-103" r="5" fill="#F2C9A0"/></g>
   <line x1="-16" y1="-74" x2="-28" y2="-46" stroke="${shirt}" stroke-width="8" stroke-linecap="round"/>
   <circle cx="0" cy="-102" r="22" fill="#FBE0C8"/><path d="M-22,-106 q2,-24 22,-24 q20,0 22,24 q-8,-12 -22,-12 q-14,0 -22,12Z" fill="${hair}"/>
   ${bow?`<path d="M14,-128 l14,-10 v20Z M14,-128 l-4,-14 l12,6Z" fill="#F7C531"/>`:''}
   <circle cx="-7" cy="-100" r="2.6" fill="#333"/><circle cx="7" cy="-100" r="2.6" fill="#333"/><path d="M-6,-90 q6,7 12,0" stroke="#A0522D" stroke-width="2" fill="none"/>
   <circle cx="-14" cy="-94" r="4.5" fill="#F7A9A0" opacity=".7"/><circle cx="14" cy="-94" r="4.5" fill="#F7A9A0" opacity=".7"/>`;return g;}

const PB=['盪鞦韆','溜滑梯','追蝴蝶','看大象','聞花香'];
let pp='',pa='',pb='';
function buildPh(){$('#phl').innerHTML=`<h4>短語練習一：到＋地點＋做什麼事</h4><div class="ph"><span class="k">到</span><span class="p">地點</span><span class="d">做什麼事</span></div>
   <div class="exs">${['到野外上課','到浴室洗澡','到餐廳吃飯'].map(s=>`<div>${s}</div>`).join('')}</div>
   <div class="slot"><h5>選地點</h5><div class="chips" id="cpP" style="--c:#C8466A">${PA.place.map(x=>`<button class="${x===pp?'on':''}">${x}</button>`).join('')}</div></div>
   <div class="slot"><h5>做什麼事</h5><div class="chips" id="cpA" style="--c:#2E6FB3">${PA.act.map(x=>`<button class="${x===pa?'on':''}">${x}</button>`).join('')}</div></div>
   <div class="mysent" id="pmA"></div>`;
  $('#phr').innerHTML=`<h4>短語練習二：去＋做什麼事</h4><div class="ph"><span class="k">去</span><span class="p">做什麼事</span></div>
   <div class="exs">${['去走森林的迷宮','去聽小鳥的歌聲','去聞花草的香味'].map(s=>`<div>${s}</div>`).join('')}</div>
   <div class="note">看課本的圖，圖中的人物要做什麼？</div>
   <div class="slot"><h5>做什麼事</h5><div class="chips" id="cpB" style="--c:#C8466A">${PB.map(x=>`<button class="${x===pb?'on':''}">${x}</button>`).join('')}</div></div>
   <div class="mysent" id="pmB"></div>`;
  $$('.exs div').forEach(d=>d.onclick=()=>speak(d.textContent));
  $$('#cpP button').forEach(b=>b.onclick=()=>{pp=b.textContent;buildPh()});$$('#cpA button').forEach(b=>b.onclick=()=>{pa=b.textContent;buildPh()});$$('#cpB button').forEach(b=>b.onclick=()=>{pb=b.textContent;buildPh()});
  const BL=x=>x||'<span class="bl">＿＿</span>';$('#pmA').innerHTML=`到${BL(pp)}${BL(pa)}`;$('#pmB').innerHTML=`去${BL(pb)}`;}

/* ---------- 成語 ---------- */
const TF=[['我的橡皮擦不翼而飛，找了好久都找不到。',1],['小鳥不翼而飛，飛到了天空中。',0],['放在桌上的餅乾，一下子就不翼而飛了。',1],['蝴蝶在花園裡不翼而飛，好漂亮。',0]];
let tfi=0,tfl=[];
function buildIdiom(){$('#idi').innerHTML=`<div class="ihead"><h3>🪶 不翼而<span class="hz">飛</span></h3><div class="mean"><b>意思：</b>比喻物品無故遺失。（「翼」是翅膀，沒有翅膀卻飛走了。）</div><div class="ex"><b>例句：</b>結帳時，我才發現錢包不翼而飛了。</div><div class="lk">課文裡的生字「飛」：蜜蜂、蝴蝶<span class="hz">飛</span>呀<span class="hz">飛</span></div></div><div class="tf" id="tf"><div style="color:#5E6E66">按下方「考考你」，判斷句子用得對不對！</div></div>`;speak('不翼而飛。比喻物品無故遺失。例句：結帳時，我才發現錢包不翼而飛了。');}
function tfQuiz(){tfl=[...TF].sort(()=>Math.random()-.5);tfi=0;tfAsk();}
function tfAsk(){const b=$('#tf');if(tfi>=tfl.length){b.innerHTML='<b>全部完成！🎉</b>';speak('全部完成，你好棒');return}
  const [s,ok]=tfl[tfi];b.innerHTML=`<b>第 ${tfi+1}／${tfl.length} 題：</b>「不翼而飛」用得對不對？<div class="q">${s.replace('不翼而飛','<u>不翼而飛</u>')}</div><div class="opts"><button data-a="1">⭕ 對</button><button data-a="0">❌ 不對</button></div><div class="fb" id="tfb"></div>`;speak(s);
  b.querySelectorAll('.opts button').forEach(x=>x.onclick=()=>{const fb=$('#tfb');if(+x.dataset.a===ok){fb.textContent=ok?'答對了！東西不見了，可以用「不翼而飛」⭐':'答對了！「不翼而飛」是說東西不見了，不是真的在飛 ⭐';fb.style.color='#2E8B57';speak('答對了');tfi++;later(tfAsk,2600)}else{fb.textContent='再想想看：「不翼而飛」是說東西不見了，還是真的在飛？';fb.style.color='#C8362B'}});}

/* ---------- steps ---------- */
const S=[
 {st:0,sc:'f',tag:'第一段',no:'大地是課本'},
 {st:1,sc:'f',tag:'第二段',no:'草地是畫紙'},
 {st:2,sc:'f',tag:'第三段',no:'森林的迷宮'},
 {sc:'diao',tag:'認識「調」',no:'一字兩音',guide:['小湖是調色盤。','「調」有兩個讀音：','ㄊㄧㄠˊ和ㄉㄧㄠˋ。','念念看，','分一分！'],enter(){buildDiao()},acts:[['🔄 重新考',buildDiao]]},
 {sc:'key',tag:'課文重點',no:'學習通知單',guide:['從課文中找線索，','說一說','①～⑦','分別是指什麼。'],enter(){buildKey()},acts:[['📖 全部看答案',()=>buildKey(1)],['🔄 重新填',()=>buildKey()]]},
 {sc:'ph',tag:'短語練習',no:'到……、去……',guide:['到野外上課，','去走森林的迷宮。','「到＋地點＋做什麼事」','「去＋做什麼事」'],enter(){pp=pa=pb='';buildPh()},acts:[['🔊 念短語一',()=>speak($('#pmA').innerText.replace(/＿+/g,''))],['🔊 念短語二',()=>speak($('#pmB').innerText.replace(/＿+/g,''))]]},
 {sc:'idiom',tag:'成語',no:'從生字學成語',guide:['蜜蜂、蝴蝶飛呀飛。','「飛」這個字，','藏在哪個成語裡？'],enter(){buildIdiom()},acts:[['🎯 考考你',tfQuiz]]}
];

/* ---------- navigation ---------- */
const TABS=[['大地是課本',0,1],['草地是畫紙',1,2],['森林的迷宮',2,3],['認識「調」',3],['課文重點',4],['短語練習',5],['成語',6]];
TABS.forEach(([n,i,num],k)=>{if(k===3)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">｜</span>');else if(k>0&&k<3)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">›</span>');
  const b=document.createElement('button');b.innerHTML=(num?`<i>${num}</i>`:'')+n;b.onclick=()=>go(i);b.dataset.i=i;$('#tabs').appendChild(b)});
let cur=0;
function lineHTML(t){return t.replace(/\[\[(.+?)\]\]/g,(m,w)=>`<span class="v" role="button" tabindex="0" data-w="${w}">${w}</span>`).replace(/\{\{(.+?)\}\}/g,(m,w)=>`<span class="v b" role="button" tabindex="0" data-w="${w}">${w}</span>`)}
function go(i){
  stopAll();cur=Math.max(0,Math.min(S.length-1,i));const st=S[cur];
  $$('.scene').forEach(s=>s.classList.toggle('on',s.id==='sc-'+st.sc));
  $('#ptag').textContent=st.tag;$('#pno').textContent=st.no;
  const isT=st.st!==undefined;const lines=isT?ST[st.st].lines:st.guide;
  const t=$('#txt');t.classList.toggle('guide',!isT);t.classList.toggle('long',isT&&!!ST[st.st].long);
  t.innerHTML=lines.map((l,k)=>`<span class="ln" data-k="${k}" ${isT?'tabindex="0"':''}>${lineHTML(l)}</span>`).join('');
  t.querySelectorAll('.v').forEach(v=>{v.onclick=e=>{e.stopPropagation();showVocab(v.dataset.w)};v.onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();showVocab(v.dataset.w)}}});
  if(isT){t.querySelectorAll('.ln').forEach(l=>{l.onclick=()=>{autoOn=false;playLine(+l.dataset.k)};l.onkeydown=e=>{if(e.key==='Enter')l.onclick()}});lineIdx=-1;stateTo(st.st,-1);}
  t.scrollTop=0;t.scrollLeft=0;
  const A=$('#acts');A.innerHTML='';
  const acts=isT?[['▶ 下一句',nextLine,1],['🎬 整段自動播',autoPlay],['🔁 從頭來',()=>{stopAll();lineIdx=-1;stateTo(st.st,-1);$$('#txt .ln').forEach(l=>l.classList.remove('on','done'))}]]:(st.acts||[]);
  acts.forEach(([l,f,m])=>{const b=document.createElement('button');b.textContent=l;if(m)b.className='main';b.onclick=f;A.appendChild(b)});
  if(isT)A.insertAdjacentHTML('beforeend','<span class="hint" id="lineNo">點右邊的句子，也可以一句一句看</span>');
  let active=0;TABS.forEach(([n,ti])=>{if(cur>=ti)active=ti});
  $$('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===active));
  $('#prev').disabled=cur===0;$('#next').disabled=cur===S.length-1;
  st.enter&&st.enter();
}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#say').onclick=()=>{const st=S[cur];const lines=st.st!==undefined?ST[st.st].lines:st.guide;speak(lines.join(''))};
document.addEventListener('keydown',e=>{if(e.target.closest('input,.v,.ln'))return;if(e.key===' '&&S[cur].st!==undefined){e.preventDefault();nextLine()}if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
go(0);
</script>
</body>
</html>
