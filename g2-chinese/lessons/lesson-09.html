<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二上第九課 赤腳國王｜課文動起來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --bg:#F1E9DD; --panel:#FFFFFF; --ink:#2E241C; --soft:#6E6152;
  --red:#C8362B; --carpet:#B8262E; --gold:#E8A33A; --soil:#B98A5A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1F1A15; --panel:#2B241D; --ink:#F4EDE4; --soft:#C3B5A3; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--kai);background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:1.2vw;padding:1vh 1.6vw .8vh;flex-wrap:wrap}
h1{margin:0;font-size:4.4vh;color:var(--red);letter-spacing:.12em;white-space:nowrap}
h1 small{font-size:.5em;color:var(--soft);letter-spacing:.05em;margin-right:.4em}
h1 em{font-style:normal;font-size:.45em;color:var(--soft);margin-left:.5em;letter-spacing:0}
nav{display:flex;gap:.2vw;flex-wrap:wrap;align-items:center}
nav button{font:inherit;font-size:2.3vh;padding:.5vh .6vw;border-radius:10px;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:.3em}
nav button i{font-style:normal;display:inline-grid;place-items:center;width:2.6vh;height:2.6vh;border-radius:50%;background:var(--red);color:#fff;font-size:1.6vh}
nav button.on{background:var(--panel);border-color:var(--red);color:var(--red);font-weight:700}
nav .sep{color:var(--soft)}
main{display:grid;grid-template-columns:1fr 46vh;gap:1.2vw;padding:0 1.6vw 1.4vh;min-height:0}
.stagewrap{display:grid;grid-template-rows:1fr auto;gap:1vh;min-height:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#EADFCC;min-height:0}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene>svg{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none;z-index:7}
.acts{display:flex;flex-wrap:wrap;gap:.7vw;min-height:6vh;align-items:center}
.acts button{font:inherit;font-size:2.7vh;padding:.9vh 1.4vw;border-radius:999px;border:3px solid var(--red);background:var(--panel);color:var(--ink);cursor:pointer}
.acts button:hover{background:var(--red);color:#fff}
.acts button.main{background:var(--red);color:#fff;font-weight:700}
.acts .hint{font-size:2.3vh;color:var(--soft)}
button:focus-visible,.v:focus-visible,.ln:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
aside{background:var(--panel);border-radius:20px;padding:1.6vh 1.4vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:1vh;min-height:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh;color:var(--soft)}
.ptitle b{color:var(--red);font-size:1.15em}
.txt{writing-mode:vertical-rl;font-size:4.3vh;line-height:1.7;letter-spacing:.08em;width:100%;height:100%;min-height:0;overflow:auto;display:block}
.ln{cursor:pointer;border-radius:8px;transition:background .3s;padding:.1em 0}
.ln:hover{background:rgba(0,0,0,.05)}
.ln.on{background:#FFE7A8;color:#2E241C}
.ln.done{color:var(--soft)}
.guide .ln{cursor:default;display:block;font-size:.85em}
.v{border:2px solid var(--gold);border-radius:6px;cursor:pointer;color:#1F6FA0;padding:.1em 0}
.v.b{border-color:transparent;color:#1F6FA0}
@media (prefers-color-scheme: dark){ .v,.v.b{color:#86C9F0} .ln.on .v{color:#1F6FA0} }
.pnav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.8vh}
.pnav button{font:inherit;font-size:2.6vh;padding:1vh 0;border-radius:12px;border:2px solid var(--soft);background:transparent;color:var(--ink);cursor:pointer}
.pnav .say{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.pnav button:disabled{opacity:.35}
#pop{position:fixed;left:3vw;bottom:13vh;max-width:48vw;background:#fff;color:#2E241C;border:4px solid var(--gold);border-radius:16px;padding:1.4vh 1.6vw;font-size:3.2vh;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:20}
#pop.on{display:block;animation:pop .3s}
#pop h3{margin:0 0 .4vh;color:#C8362B;font-size:1.3em}
#pop .row{display:flex;gap:1vw;margin-top:.8vh}
#pop button{font:inherit;font-size:.85em;border-radius:10px;border:2px solid #C8362B;background:#fff;color:#C8362B;padding:.3vh 1vw;cursor:pointer}

.badge{position:absolute;background:#fff;color:#2E241C;border:4px solid var(--red);border-radius:14px;padding:.6vh 1.2vw;font-size:3.2vh;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.6,1);white-space:nowrap;z-index:8}
.badge.gold{border-color:var(--gold)}.badge.blue{border-color:#2E6FB3}.badge.green{border-color:#2E8B57}
.bubble{position:absolute;background:#fff;color:#2E241C;border:4px solid #2E241C;border-radius:18px;padding:.8vh 1.2vw;font-size:3vh;line-height:1.5;max-width:46%;animation:pop .3s cubic-bezier(.3,1.6,.6,1);z-index:8}
.bubble b{display:block;font-size:.8em;color:#C8362B}
.bub{position:absolute;font-size:5.2vh;font-weight:700;color:#fff;-webkit-text-stroke:2px #C8362B;paint-order:stroke fill;animation:floatup 1.9s ease-out forwards;z-index:8}
@keyframes floatup{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1)}to{transform:translateY(-90px);opacity:0}}
.huge{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font-size:12vh;font-weight:700;color:#FFE45C;-webkit-text-stroke:5px #C8362B;paint-order:stroke fill;animation:ahh 1.6s ease-out forwards;white-space:nowrap;z-index:8}
@keyframes ahh{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.lbl{font-family:var(--kai);font-weight:700}

/* shared figure parts */
.bd{transform-box:fill-box;transform-origin:50% 100%}
.mv{transition:transform 1.6s ease-in-out,opacity .6s}
.cf{display:none}
.shoes .cf{display:inline}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
@keyframes walkb{to{transform:translateY(-6px)}}
@keyframes shiver{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flake{from{transform:translate(0,-40px)}to{transform:translate(30px,600px)}}
@keyframes heat{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(-14px);opacity:.9}}
.walking .bd{animation:walkb .3s ease-in-out infinite alternate}
.flake{animation:flake 5s linear infinite}

/* S1 */
#g1{fill:#D9B98A;transition:fill 1.2s}
#v1.a1:not(.a3) #g1{fill:#E8875A}
#v1.a3 #g1{fill:#F2F6F8}
#heat1{display:none}#v1.a1:not(.a3) #heat1{display:inline}
.hw{animation:heat 1.2s ease-in-out infinite}
#sun1{transform-box:fill-box;transform-origin:center;transition:transform 1s,opacity 1s}
#v1.a1 #sun1{transform:scale(1.4)}#v1.a3 #sun1{opacity:.15;transform:scale(1)}
#sunR{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
#snow1{display:none}#v1.a3 #snow1{display:inline}
#v1.a2:not(.a3) .pp .bd{animation:hop .5s ease-in-out infinite}
#v1.a2:not(.a3) .pp:nth-child(2) .bd{animation-delay:-.2s}#v1.a2:not(.a3) .pp:nth-child(3) .bd{animation-delay:-.35s}
#v1.a3 .pp .bd{animation:shiver .12s linear infinite}
#v1.a3 .ft{fill:#8FB8E6}
#v1.a0:not(.a1) .ft{fill:#FFB347;filter:drop-shadow(0 0 6px #FFD23F)}
#v1.a3 .scarf{display:inline}.scarf{display:none}

/* S2 */
#win2s{opacity:0;transition:opacity 1s}#v2.a2 #win2s{opacity:1}
#breeze2{display:none}#v2.a1:not(.a2) #breeze2{display:inline}
.bz{animation:breeze 2s linear infinite}
@keyframes breeze{from{transform:translateX(0);opacity:0}30%{opacity:.9}to{transform:translateX(260px);opacity:0}}
#carpet2{transition:filter 1s}#v2.a2 #carpet2{filter:drop-shadow(0 0 14px #FFB347)}
#warm2{opacity:0;transition:opacity 1s}#v2.a2:not(.a3) #warm2{opacity:1}
#king2{transition:opacity .8s}#v2.a3 #king2{opacity:0}
#kwin2{opacity:0;transition:opacity .8s .6s}#v2.a3 #kwin2{opacity:1}
#cart2 .mvc{transition:transform 3s ease-in-out}#v2.a3 #cart2 .mvc{transform:translateX(-120px)}
#soil2{transition:filter .6s}#v2.a4 #soil2{filter:drop-shadow(0 0 10px #FFD23F)}
#nosoil{display:none}#v2.a4 #nosoil{display:inline}

/* S3 */
#road3{animation:none}
#v3.a0:not(.a1) #road3{animation:scroll 1.2s linear infinite}
@keyframes scroll{to{transform:translateX(-200px)}}
#v3.a0:not(.a1) .wheel{animation:spin .8s linear infinite}
.wheel{transform-box:fill-box;transform-origin:center}
#wheelB{transition:transform 1.2s cubic-bezier(.3,.1,.5,1)}
#v3.a1 #wheelB{transform:translate(120px,40px) rotate(200deg)}
#body3{transform-box:fill-box;transform-origin:100% 100%;transition:transform .8s}
#v3.a1 #body3{transform:rotate(8deg)}
#king3{opacity:0;transition:opacity .6s}
#v3.a2 #king3{opacity:1}
#king3 .mv{transform:translateX(0)}
#v3.a2 #king3 .mv{transform:translateX(-260px);transition:transform 4s linear}
#v3.a2:not(.a3) #king3,#v3.a3 #king3{}
#v3.a2 #king3 .bd{animation:walkb .35s ease-in-out infinite alternate}
#v3.a3 #king3 .ft{fill:#E85D4A}
#v3.a3 .rock{fill:#8A7A6A;filter:drop-shadow(0 0 5px #FFD23F)}

/* S4 */
#think4,#piles4{opacity:0;transition:opacity .8s}
#v4.a1 #think4{opacity:1}
#v4.a3 #piles4{opacity:1}#v4.a3 #think4{opacity:.3}
#happy4{opacity:0;transition:opacity .8s}#v4.a2 #happy4{opacity:1}
.roll{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .4s}
#v4.a3 .roll{transform:scaleY(1)}
#v4.a0 #king4 .bd{animation:walkb .8s ease-in-out infinite alternate}

/* S5 */
#stilts5{opacity:0;transition:opacity .6s}#v5.a1 #stilts5{opacity:1}
#v5.a1 .stk .bd{animation:walkb .4s ease-in-out infinite alternate}
#bulb5{opacity:0;transition:opacity .5s}#v5.a2 #bulb5{opacity:1}
#v5.a3 #kidC{}
#kidC .mv{transition:transform 2s ease-in-out}
#v5.a3 #kidC .mv{animation:wander 4s ease-in-out infinite alternate}
@keyframes wander{from{transform:translateX(0)}to{transform:translateX(-300px)}}
#v5.a3 #kidC .bd{animation:walkb .3s ease-in-out infinite alternate}
#kidC{opacity:0;transition:opacity .6s}#v5.a2 #kidC{opacity:1}
#v5.a0 #king5 .bd{animation:walkb .5s ease-in-out infinite alternate}

/* S6 */
#shop6,#crowd6{opacity:0;transition:opacity .8s}
#v6.a1 #shop6{opacity:1}
#v6.a2 #crowd6{opacity:1}#v6.a2 #shop6{opacity:.25}
.pair{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .4s cubic-bezier(.3,1.6,.6,1)}
#v6.a1 .pair{transform:scale(1)}
#v6.a2 #crowd6 .bd{animation:walkb .35s ease-in-out infinite alternate}
#crowdMv{transition:transform 6s linear}#v6.a2 #crowdMv{transform:translateX(-160px)}
#shoe6{opacity:0;transition:opacity .8s}.reveal #shoe6{opacity:1}

/* html pages */
.html{background:linear-gradient(#F6EFE4,#FDFBF7)}
.tl{position:absolute;inset:3%;display:grid;grid-template-columns:.8fr 1.3fr 1.5fr 1fr;grid-template-rows:auto 1fr;gap:1.2vh 1vw}
.roof{grid-column:1/-1;height:5vh;background:#8E3A3A;border-radius:12px;color:#FFE7A8;font-size:3vh;font-weight:700;display:flex;align-items:center;justify-content:center}
.tcard{background:#fff;border-radius:18px;border:4px solid var(--c);padding:1.2vh .9vw;display:flex;flex-direction:column;gap:.7vh;color:#2E241C;overflow:auto}
.tcard h4{margin:0;font-size:3.2vh;color:#fff;background:var(--c);border-radius:12px;padding:.3vh .8vw;align-self:flex-start}
.tcard .q{font-size:2.5vh;font-weight:700;line-height:1.4}
.tcard .a{font-size:2.4vh;line-height:1.45;background:#FFF2D6;border-radius:12px;padding:.5vh .6vw;display:none}
.tcard .a.on{display:block;animation:pop .4s}
.tcard .row{display:flex;gap:.5vw;flex-wrap:wrap;margin-top:auto}
.tcard button{font:inherit;font-size:2.2vh;border-radius:999px;border:3px solid var(--c);background:#fff;color:#2E241C;padding:.3vh .7vw;cursor:pointer}
.idi{position:absolute;inset:3%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:auto 1fr;gap:1.2vh 1vw}
.icard{font:inherit;background:#fff;border:4px solid var(--c);border-radius:18px;padding:1vh .6vw;cursor:pointer;color:#2E241C;display:flex;flex-direction:column;align-items:center;gap:.4vh}
.icard .em{font-size:5.6vh;line-height:1}
.icard b{font-size:3.6vh;color:var(--c)}
.icard small{font-size:2.2vh;color:#6E6152}
.icard.on{background:color-mix(in srgb,var(--c) 14%,#fff)}
.idet{grid-column:1/-1;background:#fff;border-radius:18px;padding:2vh 2vw;color:#2E241C;font-size:3.1vh;line-height:1.7;overflow:auto}
.idet h3{margin:0 0 .6vh;font-size:4.4vh}
.idet .mean{background:#EEF6E8;border-radius:12px;padding:.8vh 1vw}
.idet .ex{background:#FFF2D6;border-radius:12px;padding:.8vh 1vw;margin-top:1vh}
.idet .lk{background:#FDE7DA;border-radius:12px;padding:.8vh 1vw;margin-top:1vh;font-weight:700;color:#B5481F}
.idet .opts{display:flex;gap:1vw;flex-wrap:wrap;margin-top:1.4vh}
.idet .opts button{font:inherit;font-size:3.2vh;padding:1vh 1.6vw;border-radius:14px;border:3px solid #C8362B;background:#fff;color:#2E241C;cursor:pointer;font-weight:700}
.idet .fb{min-height:4.5vh;margin-top:1.2vh}
.idet .tg{font-size:2.1vh;color:#fff;border-radius:6px;padding:.1vh .6vw;margin-right:.6vw}
.blank{display:inline-block;min-width:6em;border-bottom:4px solid #E8762A;text-align:center;color:#E8762A}
.hz{color:#C8362B;font-size:1.15em}
.sp{position:absolute;inset:3%;display:grid;grid-template-columns:1fr 1.1fr;gap:1.4vw;color:#2E241C}
.spl,.spr{background:#fff;border-radius:18px;padding:1.4vh 1.2vw;display:flex;flex-direction:column;gap:.8vh;overflow:auto}
.spl h4,.spr h4{margin:0;font-size:3.2vh;color:#C8362B}
.note{font-size:2.6vh;background:#FFF2D6;border-radius:12px;padding:.8vh .8vw;line-height:1.5}
.sent{font-size:2.9vh;line-height:1.5;border-radius:12px;padding:.8vh .8vw;background:#F6F1E4;cursor:pointer}
.sent em,.mysent .g{font-style:normal;color:#2E8B57;font-weight:700}
.sent .c1{color:#C8362B}.sent .c2{color:#2E6FB3}
.slot h5{margin:.3vh 0;font-size:2.5vh;color:#6E6152}
.chips{display:flex;flex-wrap:wrap;gap:.6vh}
.chips button{font:inherit;font-size:2.6vh;padding:.4vh 1vw;border-radius:999px;border:3px solid #E8762A;background:#fff;color:#2E241C;cursor:pointer}
.chips button.on{background:#E8762A;color:#fff}
.spr input{font:inherit;font-size:2.6vh;padding:.5vh .8vw;border-radius:10px;border:3px solid #C9C2B0;width:100%}
.mysent{font-size:3.8vh;font-weight:700;background:#FFF8E6;border:4px dashed #E8A33A;border-radius:14px;padding:1vh 1vw;line-height:1.5}
.mysent .bl{color:#B9B2A0}

@media (max-width:820px), (max-aspect-ratio:1/1){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  .stage{height:60vh}
  .txt{writing-mode:horizontal-tb;height:auto;font-size:22px}
  .acts button,.pnav button,nav button{font-size:16px}
  h1{font-size:26px}
  .tl{grid-template-columns:1fr 1fr;overflow:auto}.sp{grid-template-columns:1fr;overflow:auto}.idi{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion: reduce){ .flake,.hw,.bz,#sunR{animation:none} }
a.hall-back{position:fixed;z-index:40;top:0;right:0;font-family:var(--kai);font-size:1.7vh;line-height:1.2;padding:.45vh .8vw;white-space:nowrap;background:var(--panel);color:var(--soft);text-decoration:none;border:1px solid var(--soft);border-top:0;border-right:0;border-bottom-left-radius:12px}a.hall-back:hover,a.hall-back:focus-visible{color:var(--ink)}
</style>
</head>
<body>
<a class="hall-back" href="../">← 回課文大廳</a>
<header>
  <h1><small>二上第九課</small>赤腳國王<em>曹俊彥</em></h1>
  <nav id="tabs"></nav>
</header>

<main>
  <div class="stagewrap">
    <div class="stage" id="stage">
      <div class="scene" id="sc-1"><svg id="v1" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene" id="sc-2"><svg id="v2" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene" id="sc-3"><svg id="v3" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene" id="sc-4"><svg id="v4" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene" id="sc-5"><svg id="v5" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene" id="sc-6"><svg id="v6" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene html" id="sc-map"><div class="tl" id="tl"></div></div>
      <div class="scene html" id="sc-idiom"><div class="idi" id="idi"></div></div>
      <div class="scene html" id="sc-ys"><div class="sp"><div class="spl" id="ysl"></div><div class="spr" id="ysr"></div></div></div>
      <div id="ov"></div>
    </div>
    <div class="acts" id="acts"></div>
  </div>

  <aside>
    <div class="ptitle"><span id="ptag"></span><b id="pno"></b></div>
    <div class="txt" id="txt"></div>
    <div class="pnav">
      <button id="prev">◀ 上一頁</button>
      <button id="say" class="say">🔊 念給我聽</button>
      <button id="next">下一頁 ▶</button>
    </div>
  </aside>
</main>

<div id="pop"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
let timers=[];let autoOn=false;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;}
function stopAll(){timers.forEach(clearTimeout);timers=[];autoOn=false;try{speechSynthesis.cancel()}catch(e){};$('#ov').innerHTML='';$('#pop').classList.remove('on');}
function ov(html,style,cls='badge'){const d=document.createElement('div');d.className=cls;d.innerHTML=html;Object.assign(d.style,style||{});$('#ov').appendChild(d);return d;}
function temp(html,style,cls,ms=2000){const d=ov(html,style,cls);setTimeout(()=>d.remove(),ms);return d;}
function say1(html,cls=''){$('#ov').querySelectorAll('.badge').forEach(b=>b.remove());return ov(html,{left:'3%',top:'4%'},'badge '+cls)}
function bubbles(words,area){words.forEach((w,i)=>later(()=>temp(w,{left:(area.x+Math.random()*area.w)+'%',top:(area.y+Math.random()*area.h)+'%'},'bub',1950),i*(area.gap||300)))}
const clean=t=>t.replace(/\[\[|\]\]|\{\{|\}\}/g,'');
function speak(text,onend){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(text));u.lang='zh-TW';u.rate=.72;const v=speechSynthesis.getVoices().find(v=>/zh[-_]TW/i.test(v.lang));if(v)u.voice=v;if(onend)u.onend=onend;speechSynthesis.speak(u);}catch(e){onend&&setTimeout(onend,1500)}}
function bubbleNear(id,who,text,ms=4000){later(()=>{const n=$('#'+id);if(!n)return;const b=n.getBoundingClientRect(),s=$('#stage').getBoundingClientRect();const d=ov(`<b>${who}</b>${text}`,{},'bubble');const W=d.offsetWidth,H=d.offsetHeight;let x=b.left-s.left+b.width/2-W/2,y=b.top-s.top-H-10;x=Math.max(8,Math.min(s.width-W-8,x));if(y<8)y=8;d.style.left=x+'px';d.style.top=y+'px';later(()=>d.remove(),ms)},60)}

  $$('#txt .ln').forEach((l,i)=>{l.classList.toggle('on',i===k);l.classList.toggle('done',i<k)});
  $('#lineNo').textContent=`第 ${k+1} 句／共 ${S_.lines.length} 句`;
  let done=false;const fin=()=>{if(done)return;done=true;onend&&onend()};
  speak(S_.lines[k],()=>later(fin,700));later(fin,Math.max(2800,clean(S_.lines[k]).length*520+1500));
}
function nextLine(){const st=S[cur];if(st.st===undefined)return;const n=ST[st.st].lines.length;if(lineIdx<n-1)playLine(lineIdx+1);else temp('這一段念完了！按「下一頁」繼續',{left:'50%',top:'45%',transform:'translateX(-50%)'},'badge',2000)}
function autoPlay(){const st=S[cur];stopAll();lineIdx=-1;stateTo(st.st,-1);autoOn=true;const n=ST[st.st].lines.length;const step=i=>{if(!autoOn||i>=n){autoOn=false;return}playLine(i,{onend:()=>{if(autoOn)step(i+1)}})};later(()=>step(0),300);}

/* ---------- story map ---------- */
const TL=[
 ['主角','#C8362B',[['主角是誰？','赤腳國王。']],1],
 ['開始','#2E8B57',[['赤腳國裡，人人都打赤腳，夏天和冬天有什麼感受？','夏天地面又熱又燙，大家只好不停的跳；冬天腳最先知道冷。'],['赤腳國王和人們一樣都踩在土地上嗎？','不一樣。國王住在王宮踩地毯，外出坐馬車，腳從來沒有踩過土地。']],0],
 ['經過','#E8762A',[['馬車壞了，讓國王知道什麼事？','外面都是難走的路。'],['國王知道這件事後，有什麼願望？','希望大家都能走在地毯上，一定會更快樂。'],['誰幫國王想到了好主意？是從哪裡想到的呢？','幾個小朋友，在玩踩高蹺時想到「隨身地毯」。']],2],
 ['結果','#2E6FB3',[['國王收到這個好主意後，做了什麼事？','叫人做了好多好多「隨身地毯」，大家的腳都能踩在舒服的地毯上了。']],5]];
function buildTL(all){const t=$('#tl');t.innerHTML='<div class="roof">👑 赤腳國王 👑</div>';
  TL.forEach(([h,c,qs,st])=>{const d=document.createElement('div');d.className='tcard';d.style.setProperty('--c',c);d.innerHTML=`<h4>${h}</h4>`+qs.map(([q,a])=>`<div class="q">● ${q}</div><div class="a${all?' on':''}">${a}</div>`).join('')+`<div class="row"><button class="sh">看答案</button><button class="gv">🎬 看動畫</button></div>`;
    d.querySelector('.sh').onclick=()=>{d.querySelectorAll('.a').forEach(a=>a.classList.add('on'));speak(qs.map(x=>x[1]).join(''))};d.querySelector('.gv').onclick=()=>{go(st);later(autoPlay,400)};t.appendChild(d)});}

/* ---------- idioms ---------- */
const ID=[
 {n:'赤手空拳',e:'✊',c:'#C8362B',z:'赤',w:'赤腳',m:'手中空無一物，比喻沒有一點憑藉。',x:'小瑤竟然赤手空拳制服了歹徒，本領真是高強！'},
 {n:'水深火熱',e:'🌊🔥',c:'#E8762A',z:'熱',w:'又熱又燙',m:'比喻處境非常艱困、痛苦。',x:'只要發生戰爭，人民的生活就會變得水深火熱。'},
 {n:'天馬行空',e:'🐴☁️',c:'#2E6FB3',z:'馬',w:'馬車',m:'指思想、文筆自由奔放，或形容不切實際。',x:'這幅畫呈現天馬行空的創意，廣受好評。'},
 {n:'氣急敗壞',e:'😤',c:'#7A5AB0',z:'壞',w:'馬車壞了',m:'形容十分慌張或惱怒的樣子。',x:'小光和大志吵完架後，氣急敗壞的離開了。'}];
const IQ=[['小瑤竟然＿＿制服了歹徒，本領真是高強！','赤手空拳',1],['只要發生戰爭，人民的生活就會變得＿＿。','水深火熱',1],['這幅畫呈現＿＿的創意，廣受好評。','天馬行空',1],['小光和大志吵完架後，＿＿的離開了。','氣急敗壞',1],
 ['弟弟的作文寫了會飛的房子，想法真是＿＿。','天馬行空',0],['他找不到鑰匙，＿＿的在家裡翻來翻去。','氣急敗壞',0],['他沒帶任何工具，＿＿的把大石頭搬開。','赤手空拳',0]];
let iq=[],iqi=0;
function hl(n,z){return n.replace(z,`<span class="hz">${z}</span>`)}
function buildIdiom(sel){const box=$('#idi');box.innerHTML='';ID.forEach((d,i)=>{const b=document.createElement('button');b.className='icard'+(i===sel?' on':'');b.style.setProperty('--c',d.c);b.innerHTML=`<span class="em">${d.e}</span><b>${d.n}</b><small>生字：「${d.z}」</small>`;b.onclick=()=>buildIdiom(i);box.appendChild(b)});
  const det=document.createElement('div');det.className='idet';det.id='idet';box.appendChild(det);
  if(sel===undefined){det.innerHTML='<div style="color:#6E6152">從生字學成語：點上面的成語卡，看看意思和例句；或按下方「考考你」練習。</div>';return}
  const d=ID[sel];det.innerHTML=`<h3 style="color:${d.c}">${d.e} ${hl(d.n,d.z)}</h3><div class="mean"><b>意思：</b>${d.m}</div><div class="ex"><b>例句：</b>${d.x}</div><div class="lk">課文裡的生字「${d.z}」：${hl(d.w,d.z)}</div>`;speak(d.n+'。'+d.m+'。例句：'+d.x);}
function idiomQuiz(){iq=[...IQ].sort(()=>Math.random()-.5);iqi=0;buildIdiom();askIdiom();}
function askIdiom(){const det=$('#idet');if(iqi>=iq.length){det.innerHTML='<h3>全部完成！🎉</h3>';speak('全部完成，你好棒');return}
  const [s,a,b]=iq[iqi];det.innerHTML=`<div><span class="tg" style="background:${b?'#C8362B':'#9AA6B5'}">${b?'課本例句':'練習題'}</span>第 ${iqi+1}／${iq.length} 題：空格要填哪個成語？</div><div style="font-size:3.8vh;font-weight:700;margin-top:1vh">${s.replace('＿＿','<span class="blank">？</span>')}</div><div class="opts"></div><div class="fb"></div>`;speak(s.replace('＿＿','什麼'));
  ID.forEach(d=>{const x=document.createElement('button');x.textContent=d.n;x.onclick=()=>{const fb=det.querySelector('.fb');if(d.n===a){det.querySelector('.blank').textContent=a;fb.textContent='答對了！⭐';fb.style.color='#2E8B57';speak('答對了，'+s.replace('＿＿',a));iqi++;later(askIdiom,2600)}else{fb.textContent='再想想看：「'+d.n+'」的意思是'+d.m;fb.style.color='#C8362B'}};det.querySelector('.opts').appendChild(x)});}

/* ---------- ……於是…… ---------- */
const YS=[['小朋友告訴赤腳國王這個主意','國王叫人做了好多「隨身地毯」'],['奶奶最近學會包粽子','送給我們許多美味的粽子'],['家裡突然停電','我們拿出手電筒照明']];
const YC={A:['天黑了','弟弟肚子餓了','外面下起大雨','我的鉛筆斷了'],B:['我們打開電燈','媽媽煮了一碗麵','我們撐起雨傘','我拿出削鉛筆機']};
let ya='',yb='';
function buildYS(){$('#ysl').innerHTML='<h4>句子練習：……，於是……</h4><div class="note">用「……，於是……」可以連接<b>接連發生</b>的動作或事情：<span style="color:#C8362B">先發生的事</span>，於是<span style="color:#2E6FB3">接著發生的事</span>。點一點，聽聽看！</div>'+
  YS.map(([a,b])=>`<div class="sent"><span class="c1">${a}</span>，<em>於是</em><span class="c2">${b}</span>。</div>`).join('');
  $$('#ysl .sent').forEach((d,i)=>d.onclick=()=>speak(YS[i][0]+'，於是'+YS[i][1]));ya=yb='';renderYS();}
function renderYS(){const r=$('#ysr');r.innerHTML=`<h4>我來造句</h4><div class="note">看課本的圖，用「……，於是……」說一說。點一點，或自己寫！</div>
  <div class="slot"><h5>先發生了什麼事？</h5><div class="chips" id="yA">${YC.A.map(x=>`<button class="${x===ya?'on':''}">${x}</button>`).join('')}</div><input id="yi1" placeholder="自己寫"></div>
  <div class="slot"><h5>於是，接著發生了什麼事？</h5><div class="chips" id="yB">${YC.B.map(x=>`<button class="${x===yb?'on':''}">${x}</button>`).join('')}</div><input id="yi2" placeholder="自己寫"></div>
  <div class="mysent" id="ysent"></div>`;
  $$('#yA button').forEach(b=>b.onclick=()=>{ya=b.textContent;renderYS()});$$('#yB button').forEach(b=>b.onclick=()=>{yb=b.textContent;renderYS()});
  ['yi1','yi2'].forEach(i=>$('#'+i).oninput=updYS);updYS();}
function updYS(){const a=$('#yi1').value.trim()||ya,b=$('#yi2').value.trim()||yb;const B=x=>x?x:'<span class="bl">＿＿＿</span>';$('#ysent').innerHTML=`${B(a)}，<span class="g">於是</span>${B(b)}。`;}

/* ---------- steps ---------- */
const S=[
 {st:0,sc:'1',tag:'第一段',no:'赤腳國'},
 {st:1,sc:'2',tag:'第二段',no:'國王的腳'},
 {st:2,sc:'3',tag:'第三段',no:'馬車壞了'},
 {st:3,sc:'4',tag:'第四段',no:'國王的願望'},
 {st:4,sc:'5',tag:'第五段',no:'好主意'},
 {st:5,sc:'6',tag:'第六段',no:'隨身地毯',extra:[['🤔 隨身地毯是什麼？',()=>{$('#v6').classList.add('reveal');speak('想一想，隨身地毯就是我們現在穿的，鞋子！')}]]},
 {sc:'map',tag:'故事重點',no:'找出重點',guide:['主角是誰？','開始、經過、結果，','發生了什麼事？','點一點「看答案」，','也可以點「看動畫」。'],enter(){buildTL()},acts:[['📖 全部看答案',()=>buildTL(1)],['🙈 全部蓋起來',()=>buildTL()]]},
 {sc:'idiom',tag:'成語',no:'從生字學成語',guide:['從課文的生字，','認識四個成語：','赤、熱、馬、壞，','找找它們藏在','哪個成語裡！'],enter(){buildIdiom(0)},acts:[['🎯 考考你',idiomQuiz],['📖 看成語卡',()=>buildIdiom(0)]]},
 {sc:'ys',tag:'句子練習',no:'……於是……',guide:['他們把這個想法，','告訴了國王，','於是，國王叫人','做了好多好多','「隨身地毯」。'],enter(){buildYS()},acts:[['🔊 念我的句子',()=>speak($('#ysent').innerText.replace(/＿+/g,''))],['🧹 清空重寫',()=>{ya=yb='';renderYS()}]]}
];

/* ---------- navigation ---------- */
const TABS=[['赤腳國',0,1],['國王的腳',1,2],['馬車壞了',2,3],['願望',3,4],['好主意',4,5],['隨身地毯',5,6],['故事重點',6],['成語',7],['……於是……',8]];
TABS.forEach(([n,i,num],k)=>{if(k===6)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">｜</span>');else if(k>0&&k<6)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">›</span>');
  const b=document.createElement('button');b.innerHTML=(num?`<i>${num}</i>`:'')+n;b.onclick=()=>go(i);b.dataset.i=i;$('#tabs').appendChild(b)});
let cur=0;
function lineHTML(t){return t.replace(/\[\[(.+?)\]\]/g,(m,w)=>`<span class="v" role="button" tabindex="0" data-w="${w}">${w}</span>`).replace(/\{\{(.+?)\}\}/g,(m,w)=>`<span class="v b" role="button" tabindex="0" data-w="${w}">${w}</span>`)}
function go(i){
  stopAll();cur=Math.max(0,Math.min(S.length-1,i));const st=S[cur];
  $$('.scene').forEach(s=>s.classList.toggle('on',s.id==='sc-'+st.sc));
  $('#ptag').textContent=st.tag;$('#pno').textContent=st.no;
  const isT=st.st!==undefined;const lines=isT?ST[st.st].lines:st.guide;
  const t=$('#txt');t.classList.toggle('guide',!isT);
  t.innerHTML=lines.map((l,k)=>`<span class="ln" data-k="${k}" ${isT?'tabindex="0"':''}>${lineHTML(l)}</span>`).join('');
  t.querySelectorAll('.v').forEach(v=>{v.onclick=e=>{e.stopPropagation();showVocab(v.dataset.w)};v.onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();showVocab(v.dataset.w)}}});
  if(isT){t.querySelectorAll('.ln').forEach(l=>{l.onclick=()=>{autoOn=false;playLine(+l.dataset.k)};l.onkeydown=e=>{if(e.key==='Enter')l.onclick()}});lineIdx=-1;$('#v'+(st.st+1)).setAttribute('class','');}
  t.scrollTop=0;t.scrollLeft=0;
  const A=$('#acts');A.innerHTML='';
  const acts=isT?[['▶ 下一句',nextLine,1],['🎬 整段自動播',autoPlay],['🔁 從頭來',()=>{stopAll();lineIdx=-1;$('#v'+(st.st+1)).setAttribute('class','');$$('#txt .ln').forEach(l=>l.classList.remove('on','done'))}],...(st.extra||[])]:(st.acts||[]);
  acts.forEach(([l,f,m])=>{const b=document.createElement('button');b.textContent=l;if(m)b.className='main';b.onclick=f;A.appendChild(b)});
  if(isT)A.insertAdjacentHTML('beforeend','<span class="hint" id="lineNo">點右邊的句子，也可以一句一句看</span>');
  let active=0;TABS.forEach(([n,ti])=>{if(cur>=ti)active=ti});
  $$('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===active));
  $('#prev').disabled=cur===0;$('#next').disabled=cur===S.length-1;
  st.enter&&st.enter();
}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#say').onclick=()=>{const st=S[cur];const lines=st.st!==undefined?ST[st.st].lines:st.guide;speak(lines.join(''))};
document.addEventListener('keydown',e=>{if(e.target.closest('input,.v,.ln'))return;if(e.key===' '&&S[cur].st!==undefined){e.preventDefault();nextLine()}if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
go(0);
</script>
