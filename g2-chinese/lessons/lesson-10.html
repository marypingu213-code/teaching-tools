<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二上第十課 去農場玩｜課文動起來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --bg:#E6F0E4; --panel:#FFFFFF; --ink:#22301F; --soft:#5F6E5A;
  --grass:#6BB04A; --sky:#9FD3EE; --orange:#E8762A; --gold:#E8A33A; --pink:#E86A8A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#162016; --panel:#212D20; --ink:#EEF5EC; --soft:#AFC2AA; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--kai);background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:1.2vw;padding:1vh 1.6vw .8vh;flex-wrap:wrap}
h1{margin:0;font-size:4.4vh;color:var(--orange);letter-spacing:.12em;white-space:nowrap}
h1 small{font-size:.5em;color:var(--soft);letter-spacing:.05em;margin-right:.4em}
h1 em{font-style:normal;font-size:.45em;color:var(--soft);margin-left:.5em;letter-spacing:0}
nav{display:flex;gap:.25vw;flex-wrap:wrap;align-items:center}
nav button{font:inherit;font-size:2.4vh;padding:.5vh .7vw;border-radius:10px;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:.3em}
nav button i{font-style:normal;display:inline-grid;place-items:center;width:2.7vh;height:2.7vh;border-radius:50%;background:var(--orange);color:#fff;font-size:1.7vh}
nav button.on{background:var(--panel);border-color:var(--orange);color:var(--orange);font-weight:700}
nav .sep{color:var(--soft)}
main{display:grid;grid-template-columns:1fr 46vh;gap:1.2vw;padding:0 1.6vw 1.4vh;min-height:0}
.stagewrap{display:grid;grid-template-rows:1fr auto;gap:1vh;min-height:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#D3E8D0;min-height:0}
#ov{position:absolute;inset:0;pointer-events:none;z-index:7}
.acts{display:flex;flex-wrap:wrap;gap:.7vw;min-height:6vh;align-items:center}
.acts button{font:inherit;font-size:2.7vh;padding:.9vh 1.4vw;border-radius:999px;border:3px solid var(--orange);background:var(--panel);color:var(--ink);cursor:pointer}
.acts button:hover{background:var(--orange);color:#fff}
.acts button.main{background:var(--orange);color:#fff;font-weight:700}
.acts .hint{font-size:2.3vh;color:var(--soft)}
button:focus-visible,.v:focus-visible,.ln:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
aside{background:var(--panel);border-radius:20px;padding:1.6vh 1.4vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:1vh;min-height:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh;color:var(--soft)}
.ptitle b{color:var(--orange);font-size:1.15em}
.txt{writing-mode:vertical-rl;font-size:4.4vh;line-height:1.7;letter-spacing:.08em;width:100%;height:100%;min-height:0;overflow:auto;display:block}
.txt.long{font-size:3.6vh}
.ln{cursor:pointer;border-radius:8px;transition:background .3s;padding:.1em 0}
.ln:hover{background:rgba(0,0,0,.05)}
.ln.on{background:#FFE7A8;color:#22301F}
.ln.done{color:var(--soft)}
.guide .ln{cursor:default;display:block;font-size:.85em}
.v{border:2px solid var(--gold);border-radius:6px;cursor:pointer;color:#1F6FA0;padding:.1em 0}
@media (prefers-color-scheme: dark){ .v{color:#86C9F0} .ln.on .v{color:#1F6FA0} }
.pnav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.8vh}
.pnav button{font:inherit;font-size:2.6vh;padding:1vh 0;border-radius:12px;border:2px solid var(--soft);background:transparent;color:var(--ink);cursor:pointer}
.pnav .say{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.pnav button:disabled{opacity:.35}
#pop{position:fixed;left:3vw;bottom:13vh;max-width:48vw;background:#fff;color:#22301F;border:4px solid var(--gold);border-radius:16px;padding:1.4vh 1.6vw;font-size:3.2vh;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:20}
#pop.on{display:block;animation:pop .3s}
#pop h3{margin:0 0 .4vh;color:#C8622A;font-size:1.3em}
#pop .row{display:flex;gap:1vw;margin-top:.8vh}
#pop button{font:inherit;font-size:.85em;border-radius:10px;border:2px solid #C8622A;background:#fff;color:#C8622A;padding:.3vh 1vw;cursor:pointer}

.badge{position:absolute;background:#fff;color:#22301F;border:4px solid var(--orange);border-radius:14px;padding:.6vh 1.2vw;font-size:3.2vh;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.6,1);white-space:nowrap;z-index:8}
.badge.gold{border-color:var(--gold)}.badge.green{border-color:#2E8B57}.badge.blue{border-color:#2E6FB3}
.bubble{position:absolute;background:#fff;color:#22301F;border:4px solid #22301F;border-radius:18px;padding:.8vh 1.2vw;font-size:3vh;line-height:1.5;max-width:46%;animation:pop .3s cubic-bezier(.3,1.6,.6,1);z-index:8}
.bubble b{display:block;font-size:.8em;color:#C8622A}
.bub{position:absolute;font-size:5.2vh;font-weight:700;color:#fff;-webkit-text-stroke:2px #C8622A;paint-order:stroke fill;animation:floatup 1.9s ease-out forwards;z-index:8}
@keyframes floatup{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1)}to{transform:translateY(-90px);opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.lbl{font-family:var(--kai);font-weight:700}

/* ===== 流暢動畫版：場景（只動 transform / opacity，交給 GPU 合成） ===== */
.fit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--k,1));transform-origin:50% 50%}
#W{width:1000px;height:560px;pointer-events:none;contain:layout style}
#W .L{position:absolute;inset:0}
#W svg{overflow:visible;display:block}
.bleed{position:absolute;left:-300px;top:-300px;width:1600px;height:1200px}
.abs{position:absolute}
.w{position:absolute;left:0;top:0}
.box{position:absolute}
.pt{position:absolute;inset:0}
.pt>svg,.box>svg{position:absolute;inset:0;width:100%;height:100%}
/* sky */
.sky{position:absolute;inset:-400px;transition:opacity 2.6s ease-in-out}
#skyDay{background:linear-gradient(#7CC6EE 30%,#BFE8F7 52%,#E4F6EA 62%)}
#skyDusk{background:linear-gradient(#F08E6B 30%,#F9C48A 52%,#FCE3B0 62%);opacity:0}
#skyNight{background:linear-gradient(#4D447F 30%,#8E6FA6 50%,#C9A0B5 62%);opacity:0}
#W.s4.a2 #skyDusk{opacity:1}
#W.s4.a3 #skyNight{opacity:1}
#skyWrap{position:absolute;inset:0;transform-origin:330px 430px;transition:transform 1.9s cubic-bezier(.45,0,.25,1)}
#W.s2.a3:not(.a4) #skyWrap{transform:scale(1.12)}
#sun{left:70px;top:20px;width:140px;height:140px;transition:transform 3.4s cubic-bezier(.45,0,.4,1),opacity 3s}
#W.s4.a2 #sun{transform:translateY(310px) scale(.9)}
#sunRays{animation:spin 24s linear infinite}
#sunDusk{opacity:0;transition:opacity 2.4s}
#W.s4.a2 #sunDusk{opacity:1}
#W.s1.a0 #sunCore{animation:sunHappy 2.4s ease-in-out infinite}
@keyframes sunHappy{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
#moon{left:800px;top:40px;width:90px;height:90px;opacity:0;transform:translateY(60px);transition:opacity 2s 1s,transform 3s 1s cubic-bezier(.2,.7,.3,1)}
#W.s4.a3 #moon{opacity:1;transform:none}
#stars{opacity:0;transition:opacity 2.5s .8s}
#W.s4.a3 #stars{opacity:1}
.star{position:absolute;width:14px;height:14px;animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.6)}}
.cloud{animation:cloudGo linear infinite}
@keyframes cloudGo{from{transform:translateX(0)}to{transform:translateX(-1700px)}}
.bird{animation:birdGo 22s linear infinite}
.bird .wing{animation:flap .5s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes birdGo{from{transform:translate(0,0)}50%{transform:translate(-750px,-30px)}to{transform:translate(-1500px,10px)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.6)}}
#birds{transition:opacity 1.5s}
#W.s4.a2 #birds{opacity:0}
/* camera & parallax */
#cam{position:absolute;inset:0;transform-origin:330px 430px;transition:transform 1.9s cubic-bezier(.45,0,.25,1)}
#W.s2.a3:not(.a4) #cam{transform:scale(1.9)}
#W.s5 #cam,#W.s5 #skyWrap{visibility:hidden;transition:transform 1.9s cubic-bezier(.45,0,.25,1),visibility 0s 1.1s}
.px{transition:transform 2.9s cubic-bezier(.33,0,.2,1)}
#W.s1:not(.a1) #pxFar{transform:translateX(22px)}
#W.s1:not(.a1) #pxMid{transform:translateX(55px)}
#W.s1:not(.a1) #pxNear{transform:translateX(105px)}
#blades{left:560px;top:118px;width:80px;height:80px;animation:spin 9s linear infinite}
.flw{transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.bfly{animation:bflyX 7s ease-in-out infinite alternate}
.bfly>.w{animation:bflyY 2.3s ease-in-out infinite alternate}
.bfly .wg{animation:bflap .22s ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes bflyX{from{transform:translateX(-60px)}to{transform:translateX(70px)}}
@keyframes bflyY{from{transform:translateY(-22px)}to{transform:translateY(16px)}}
@keyframes bflap{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
#bflies{transition:opacity 1.5s}
#W.s4.a2 #bflies,#W.s5 #bflies{opacity:0}
/* breeze */
#breeze{opacity:0;transition:opacity 1s}
#W.s1 #breeze{opacity:1}
.bz{animation:breeze 3.4s cubic-bezier(.4,0,.6,1) infinite}
@keyframes breeze{0%{transform:translateX(-160px);opacity:0}25%{opacity:.95}80%{opacity:.8}100%{transform:translateX(760px);opacity:0}}
/* figure common */
.blink{animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.breathe{animation:breathe 3.4s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1,1)}to{transform:scale(1.015,1.035)}}
.tail{animation:wag 1.6s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.head{transition:transform .9s cubic-bezier(.4,0,.2,1)}
.hm{transition:transform .6s}
/* flock */
#flock>.w{opacity:0;transform:translateY(18px) scale(.92);transition:opacity .7s,transform 1s cubic-bezier(.3,1.5,.5,1)}
#W:not(.s1) #flock>.w{opacity:1;transform:none}
#W.s2.a1 .eat .head{transform:rotate(-30deg)}
#W.s2.a1 .eat .hm{animation:chew .9s ease-in-out infinite}
@keyframes chew{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
#W.s2.a2 .look .head{transform:rotate(20deg)}
#W.s2.a2 .look .hm{animation:hello 1.4s ease-in-out infinite}
@keyframes hello{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
#W.s2.a3:not(.a4) #flock .breathe{animation-duration:1.6s}
/* walkers */
#walkers{transition:transform 2.9s cubic-bezier(.3,.1,.3,1)}
#W.s1:not(.a1) #walkers{transform:translateX(340px)}
.legA,.legB,.armB{transition:transform .4s}
#W.s1.a1 #walkers .legA,#W:not(.s1) #walkers .legA{animation:stepA .56s ease-in-out 5}
#W.s1.a1 #walkers .legB,#W:not(.s1) #walkers .legB{animation:stepB .56s ease-in-out 5}
#W.s1.a1 #walkers .stp,#W:not(.s1) #walkers .stp{animation:stepBob .28s ease-in-out 10}
#W.s1.a1 #walkers .armB,#W:not(.s1) #walkers .armB{animation:stepB .56s ease-in-out 5}
@keyframes stepA{0%,100%{transform:rotate(0)}25%{transform:rotate(16deg)}75%{transform:rotate(-16deg)}}
@keyframes stepB{0%,100%{transform:rotate(0)}25%{transform:rotate(-16deg)}75%{transform:rotate(16deg)}}
@keyframes stepBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.lift{transform:rotate(-118deg);transition:transform .7s cubic-bezier(.4,1.35,.5,1)}
.wave{transform-origin:inherit}
#W.s3.a1:not(.a2) #girl .lift,#W.s4.a3 #girl .lift,#W.s5.a0 #girlF .lift,#W.s5.a1 #dadF .lift{transform:rotate(0)}
#W.s3.a1:not(.a2) #girl .wave,#W.s4.a3 #girl .wave,#W.s5.a0 #girlF .wave,#W.s5.a1 #dadF .wave{animation:wave .8s ease-in-out .6s infinite}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(16deg)}}
.sad,.tear{opacity:0;transition:opacity .8s}
#W.s4.a3 #girl .sad,#W.s4.a3 #girl .tear{opacity:1}
#W.s4.a3 #girl .happy{opacity:0}
.happy{transition:opacity .8s}
.tear>svg{animation:tear 1.3s ease-in infinite}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(22px);opacity:0}}
#W.s4.a3 #girl .head{transform:rotate(-6deg)}
#W.s4.a0 #girl .head{transform:rotate(8deg)}
/* lamb */
#lamb{opacity:0;transition:opacity .7s}
#W.s3 #lamb{opacity:1}
#W.s3.a0:not(.a1) #lamb .head{transform:rotate(18deg)}
#W.s3.a0:not(.a1) #lamb .hm{animation:bleat .55s ease-in-out infinite}
@keyframes bleat{0%,100%{transform:rotate(0)}50%{transform:rotate(10deg)}}
#lamb .flip{transition:transform .7s cubic-bezier(.5,0,.3,1)}
#W.s3.a1:not(.a2) #lamb .flip{transform:scaleX(-1)}
#W.s3.a2 #lamb .run{animation:runaway 2.4s cubic-bezier(.5,0,.85,.6) forwards}
@keyframes runaway{0%{transform:translateX(0)}14%{transform:translateX(16px)}100%{transform:translateX(-860px)}}
#W.s3.a2 #lamb .hop{animation:hop .26s ease-in-out .3s 9}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
#W.s3.a2 #lamb .legA{animation:gallop .26s ease-in-out .3s 9}
#W.s3.a2 #lamb .legB{animation:gallop .26s ease-in-out .43s 9}
@keyframes gallop{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}
#dust{opacity:0}
#W.s3.a2 #dust .puff{animation:puff 1.1s ease-out .35s 2}
.puff{position:absolute;width:30px;height:30px;border-radius:50%;background:#F4EEDF;opacity:0}
@keyframes puff{0%{opacity:0;transform:scale(.3)}20%{opacity:.9}100%{opacity:0;transform:translate(40px,-16px) scale(1.4)}}
#W.s3.a2 #dust{opacity:1}
#lambPeek>.w{opacity:0;transform:translateY(34px);transition:opacity 1s 1s,transform 1.4s 1s cubic-bezier(.2,.8,.3,1)}
#W.s4.a3 #lambPeek>.w{opacity:1;transform:none}
#lambPeek .hm{animation:hello 1.8s ease-in-out infinite}
/* tints */
.tint{position:absolute;inset:-400px;opacity:0;transition:opacity 2.6s ease-in-out}
#tintDusk{background:linear-gradient(rgba(255,150,90,0) 40%,rgba(240,110,60,.26))}
#tintNight{background:rgba(52,40,110,.30)}
#W.s4.a2 #tintDusk{opacity:1}
#W.s4.a3 #tintNight{opacity:1}
.ffly{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(#FFF9B0,rgba(255,240,120,.0) 70%);animation:ffly 4s ease-in-out infinite alternate}
@keyframes ffly{0%{transform:translate(0,0);opacity:.2}50%{opacity:1}100%{transform:translate(30px,-26px);opacity:.3}}
#fflies{opacity:0;transition:opacity 2s 1.5s}
#W.s4.a3 #fflies{opacity:1}
/* overlays in scene */
.pop{opacity:0;transform:scale(.7);transition:opacity .6s,transform .8s cubic-bezier(.3,1.5,.5,1)}
#cotton{transform-origin:805px 160px;transition-delay:.9s}
#W.s2.a3:not(.a4) #cotton{opacity:1;transform:none}
.cpuff{animation:cbob 2.6s ease-in-out infinite alternate}
@keyframes cbob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
#frame{opacity:0;transform:scale(1.06);transform-origin:500px 280px;transition:opacity 1.2s .6s,transform 1.6s .6s cubic-bezier(.2,.8,.3,1)}
#W.s2.a4 #frame{opacity:1;transform:none}
#think4{transform-origin:830px 330px}
#W.s4.a0:not(.a2) #think4{opacity:1;transform:none}
.heart{animation:heart 1.8s ease-in-out infinite}
@keyframes heart{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.15)}}
.thinkLamb{animation:hop2 1.2s ease-in-out infinite}
@keyframes hop2{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.spk{position:absolute;font-size:36px;opacity:0;transform:scale(.3)}
#W.s4.a1:not(.a2) .spk{animation:spark 1.8s ease-in-out infinite}
@keyframes spark{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(25deg)}}
/* home */
#home{opacity:0;visibility:hidden;transform:scale(1.05);transform-origin:500px 300px;transition:opacity 1.1s,transform 1.6s cubic-bezier(.2,.7,.2,1),visibility 0s 1.1s}
#W.s5 #home{opacity:1;visibility:visible;transform:none;transition:opacity 1.1s,transform 1.6s cubic-bezier(.2,.7,.2,1),visibility 0s}
#W.s5.a0:not(.a1) #girlF .stp{animation:happyHop .7s ease-in-out infinite}
@keyframes happyHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
#W.s5 #dadF .hm{animation:nodYes 2.2s ease-in-out infinite}
@keyframes nodYes{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-7deg)}80%{transform:rotate(0)}90%{transform:rotate(-6deg)}}
#think5{transform-origin:700px 300px}
#W.s5.a1 #think5{opacity:1;transform:none;transition-delay:.2s}
.hday,.cal-legend{opacity:0;transform:scale(.35);transform-box:fill-box;transform-origin:center;transition:opacity .45s ease,transform .55s cubic-bezier(.3,1.5,.5,1)}
#W.s5.a1 .hday,#W.s5.a1 .cal-legend{opacity:1;transform:none}
.cal-legend{transition-delay:.7s}
#lampGlow{animation:glow 3.5s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55;transform:scale(.95)}to{opacity:.9;transform:scale(1.05)}}
.wstar{position:absolute;width:10px;height:10px;animation:twinkle 2.4s ease-in-out infinite}
/* scenes crossfade */
.scene{position:absolute;inset:0;display:block!important;opacity:0;visibility:hidden;transition:opacity .55s ease,visibility 0s .55s}
.scene.on{opacity:1;visibility:visible;transition:opacity .55s ease,visibility 0s}
.scene:not(.on) *{animation-play-state:paused!important}
#sc-farm{background:linear-gradient(#BFE8F7,#6FB64F 70%)}
#Wfit{width:1000px;height:560px}
#W{position:relative}
.bird{animation-delay:-6s}

/* html pages */
.html{background:linear-gradient(#EEF6EC,#FAFDF9)}
.wx{position:absolute;inset:3%;display:grid;grid-template-columns:1.3fr 1fr;gap:1.4vw}
.wxs{background:#fff;border-radius:18px;overflow:hidden;position:relative}
.wxs svg{width:100%;height:100%;display:block}
.wxr{display:flex;flex-direction:column;gap:1vh}
.wcards{display:grid;grid-template-columns:1fr 1fr;gap:1vh}
.wcard{font:inherit;font-size:3.6vh;font-weight:700;padding:1.4vh 0;border-radius:16px;border:4px solid var(--c);background:#fff;color:var(--c);cursor:pointer}
.wcard.on{background:var(--c);color:#fff}
.wdet{background:#fff;border-radius:16px;padding:1.4vh 1.2vw;font-size:3vh;line-height:1.6;color:#22301F;flex:1;overflow:auto}
.wdet h3{margin:0 0 .4vh;font-size:4.2vh}
.wdet .ex{background:#FFF2D6;border-radius:12px;padding:.6vh .8vw;margin-top:.8vh}
.wdet .fb{min-height:4vh;margin-top:.6vh}
#wsvg{width:600px;height:420px;overflow:hidden}
.wxs{background:#BFE3F2}
.wl{position:absolute;inset:-60px;opacity:0;transition:opacity .7s ease}
.wl>.in{position:absolute;left:60px;top:60px;width:600px;height:420px}
.w-sun #L-sun,.w-cloud #L-cloud,.w-storm #L-storm,.w-cold #L-cold{opacity:1}
#wsvg:not(.w-sun) #L-sun *,#wsvg:not(.w-cloud) #L-cloud *,#wsvg:not(.w-storm) #L-storm *,#wsvg:not(.w-cold) #L-cold *{animation-play-state:paused}
.sheet{position:absolute;left:-60px;right:-60px}
.rainA{top:-120px;height:calc(100% + 240px);animation:fallA .42s linear infinite}
.rainB{top:-80px;height:calc(100% + 160px);opacity:.6;animation:fallB .6s linear infinite}
@keyframes fallA{from{transform:translateY(0)}to{transform:translateY(120px)}}
@keyframes fallB{from{transform:translateY(0)}to{transform:translateY(80px)}}
.snowA{top:-160px;height:calc(100% + 320px);animation:fallC 7s linear infinite}
.snowB{top:-110px;height:calc(100% + 220px);opacity:.8;animation:fallD 4.6s linear infinite}
@keyframes fallC{from{transform:translateY(0)}to{transform:translateY(160px)}}
@keyframes fallD{from{transform:translateY(0)}to{transform:translateY(110px)}}
.swayX{position:absolute;inset:0;animation:swayX 3.4s ease-in-out infinite alternate}
@keyframes swayX{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.dcl{animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(26px)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash 3.2s infinite}
@keyframes flash{0%,46%,54%,100%{opacity:0}48%{opacity:.45}51%{opacity:.15}}
.bolt{animation:bolt 3.2s infinite}
@keyframes bolt{0%,45%,57%,100%{opacity:0}47%,55%{opacity:1}}
.wobble{transform-origin:50% 100%;animation:wobble 3s ease-in-out infinite alternate}
@keyframes wobble{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}

.sp{position:absolute;inset:3%;display:grid;grid-template-columns:1fr 1.15fr;gap:1.4vw;color:#22301F}
.spl,.spr{background:#fff;border-radius:18px;padding:1.4vh 1.2vw;display:flex;flex-direction:column;gap:.8vh;overflow:auto}
.spl h4,.spr h4{margin:0;font-size:3.2vh;color:#C8622A}
.note{font-size:2.6vh;background:#FFF2D6;border-radius:12px;padding:.8vh .8vw;line-height:1.5}
.blocks{display:flex;flex-wrap:wrap;gap:.5vw;align-items:flex-end;font-size:3.4vh;font-weight:700}
.blk{display:flex;flex-direction:column;align-items:center;gap:.3vh}
.blk small{font-size:1.9vh;color:#fff;border-radius:6px;padding:.1vh .4vw;background:var(--c)}
.blk span{border:3px solid var(--c);border-radius:10px;padding:.2vh .6vw;background:#fff;min-width:2.4em;text-align:center}
.blk.plain span{border-color:transparent}
.slot h5{margin:.3vh 0;font-size:2.4vh;color:#5F6E5A}
.chips{display:flex;flex-wrap:wrap;gap:.5vh}
.chips button{font:inherit;font-size:2.5vh;padding:.3vh .9vw;border-radius:999px;border:3px solid var(--c);background:#fff;color:#22301F;cursor:pointer}
.chips button.on{background:var(--c);color:#fff}
.spr input{font:inherit;font-size:2.4vh;padding:.4vh .7vw;border-radius:10px;border:3px solid #C9C2B0;width:100%}
.idi{position:absolute;inset:3%;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:auto 1fr;gap:1.2vh 1vw}
.icard{font:inherit;background:#fff;border:4px solid var(--c);border-radius:18px;padding:1vh .6vw;cursor:pointer;color:#22301F;display:flex;flex-direction:column;align-items:center;gap:.4vh}
.icard .em{font-size:5.6vh;line-height:1}
.icard b{font-size:3.8vh;color:var(--c)}
.icard small{font-size:2.2vh;color:#5F6E5A}
.icard.on{background:color-mix(in srgb,var(--c) 14%,#fff)}
.idet{grid-column:1/-1;background:#fff;border-radius:18px;padding:2vh 2vw;color:#22301F;font-size:3.1vh;line-height:1.7;overflow:auto}
.idet h3{margin:0 0 .6vh;font-size:4.4vh}
.idet .mean{background:#EEF6E8;border-radius:12px;padding:.8vh 1vw}
.idet .ex{background:#FFF2D6;border-radius:12px;padding:.8vh 1vw;margin-top:1vh}
.idet .lk{background:#FDE7DA;border-radius:12px;padding:.8vh 1vw;margin-top:1vh;font-weight:700;color:#B5481F}
.idet .opts{display:flex;gap:1vw;flex-wrap:wrap;margin-top:1.4vh}
.idet .opts button{font:inherit;font-size:3.2vh;padding:1vh 1.6vw;border-radius:14px;border:3px solid #C8622A;background:#fff;color:#22301F;cursor:pointer;font-weight:700}
.idet .fb{min-height:4.5vh;margin-top:1.2vh}
.idet .tg{font-size:2.1vh;color:#fff;border-radius:6px;padding:.1vh .6vw;margin-right:.6vw}
.blank{display:inline-block;min-width:6em;border-bottom:4px solid #E8762A;text-align:center;color:#E8762A}
.hz{color:#C8362B;font-size:1.15em}

@media (max-width:820px), (max-aspect-ratio:1/1){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  .stage{height:60vh}
  .txt,.txt.long{writing-mode:horizontal-tb;height:auto;font-size:22px}

/* ……像…… 比較圖：放在左欄下方，右側選詞維持完整高度 */

.spr{gap:.45vh}
.spr #lkout{font-size:2.6vh;gap:.35vw;flex-shrink:0}
.spr #lkout .blk span{padding:.15vh .45vw}
.spr .slot h5{margin:.12vh 0}

@media (max-width:820px), (max-aspect-ratio:1/1){

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="gWool" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#FBF8F2"/><stop offset="1" stop-color="#ECE4D6"/></radialGradient></defs></svg>

<div id="pop"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
let timers=[];let autoOn=false;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;}
function stopAll(){timers.forEach(clearTimeout);timers=[];autoOn=false;try{speechSynthesis.cancel()}catch(e){};$('#ov').innerHTML='';$('#pop').classList.remove('on');}
function ov(html,style,cls='badge'){const d=document.createElement('div');d.className=cls;d.innerHTML=html;Object.assign(d.style,style||{});$('#ov').appendChild(d);return d;}
function temp(html,style,cls,ms=2000){const d=ov(html,style,cls);setTimeout(()=>d.remove(),ms);return d;}
function say1(html,cls=''){$('#ov').querySelectorAll('.badge').forEach(b=>b.remove());return ov(html,{left:'3%',top:'4%'},'badge '+cls)}
function bubbles(words,area){words.forEach((w,i)=>later(()=>temp(w,{left:(area.x+Math.random()*area.w)+'%',top:(area.y+Math.random()*area.h)+'%'},'bub',1950),i*(area.gap||300)))}
const clean=t=>t.replace(/\[\[|\]\]|\{\{|\}\}/g,'');
function speak(text,onend){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(text).replace(/ㄇㄝ/g,'咩'));u.lang='zh-TW';u.rate=.72;if(onend)u.onend=onend;zhTwSpeak(u);}catch(e){onend&&setTimeout(onend,1500)}}
function bubbleNear(id,who,text,ms=4000){later(()=>{const n=$('#'+id);if(!n)return;const b=n.getBoundingClientRect(),s=$('#stage').getBoundingClientRect();const d=ov(`<b>${who}</b>${text}`,{},'bubble');const W=d.offsetWidth,H=d.offsetHeight;let x=b.left-s.left+b.width/2-W/2,y=b.top-s.top-H-10;x=Math.max(8,Math.min(s.width-W-8,x));if(y<8)y=8;d.style.left=x+'px';d.style.top=y+'px';later(()=>d.remove(),ms)},60)}

/* ---------- figures（HTML 圖層 + 靜態 SVG，每個會動的部位是獨立的 div，只做 transform） ---------- */
const sv=(vb,inner)=>`<svg viewBox="${vb.join(' ')}" preserveAspectRatio="none">${inner}</svg>`;
const rnd=(a,b)=>(a+Math.random()*(b-a)).toFixed(2);
/* 一個角色：pos(定位) > wraps... > sc(縮放) > box(與 SVG viewBox 相同座標) > parts */
const o_top=(vb,o)=>o.top!==undefined?`data-top="${o.top}"`:'';
function fig({x,y,s=1,vb,cls='',id='',wraps=[],parts,style='',raw=''}){
  const [vx,vy,vw,vh]=vb;
  let open='',close='';wraps.forEach(w=>{open+=`<div class="w ${w}">`;close+='</div>'});
  return `<div class="w ${cls}" style="left:${x}px;top:${y}px;${style}">${open}<div class="w sc" style="transform:scale(${s})">${raw}${raw?'':`<div class="box" ${id?`id="${id}"`:''} ${o_top(vb,arguments[0])} style="left:${vx}px;top:${vy}px;width:${vw}px;height:${vh}px">${parts(vb)}</div>`}</div>${close}</div>`;
}
/* 一個部位：與整個角色共用座標，ox/oy 是轉軸 */
function part(vb,cls,inner,ox=0,oy=0,kids='',style=''){return `<div class="pt ${cls}" style="transform-origin:${ox-vb[0]}px ${oy-vb[1]}px;${style}">${inner?sv(vb,inner):''}${kids}</div>`}

/* ---- 綿羊（臉朝左） ---- */
const SHEEP_VB=[-80,-90,160,96];
function sheepHTML(o){
  const wool=[[-24,-40,16],[-6,-48,18],[14,-46,17],[28,-36,14],[-16,-28,15],[6,-27,16],[24,-25,13],[-30,-28,11]];
  const out=wool.map(([cx,cy,r])=>`<circle cx="${cx}" cy="${cy}" r="${r+3}"/>`).join('');
  const inn=wool.map(([cx,cy,r])=>`<circle cx="${cx}" cy="${cy}" r="${r}"/>`).join('');
  const leg=(x,d)=>`<rect x="${x-4}" y="-24" width="8" height="22" rx="4" fill="${d?'#4C3D36':'#685349'}"/><ellipse cx="${x-1}" cy="-2" rx="6" ry="3.5" fill="#2F2622"/>`;
  const dl=rnd(-4,0),dt=rnd(-2,0),db=rnd(-3,0);
  return fig({...o,vb:SHEEP_VB,cls:'sheep '+(o.cls||''),parts:vb=>
    sv(vb,`<ellipse cx="0" cy="0" rx="44" ry="6" fill="rgba(40,70,20,.18)"/>`)+
    part(vb,'legB',leg(16,1),16,-22)+part(vb,'legA',leg(-22,1),-22,-22)+
    part(vb,'legB',leg(10,0),10,-22)+part(vb,'legA',leg(-14,0),-14,-22)+
    part(vb,'tail',`<circle cx="42" cy="-40" r="10" fill="#D9D0C1"/><circle cx="42" cy="-40" r="7.5" fill="url(#gWool)"/>`,36,-38,'',`animation-delay:${dt}s`)+
    part(vb,'breathe',`<g fill="#D9D0C1">${out}</g><g fill="url(#gWool)">${inn}</g><g fill="#fff" opacity=".9"><ellipse cx="-8" cy="-56" rx="7" ry="3.5"/><ellipse cx="14" cy="-54" rx="5" ry="2.6"/></g>`,0,-10,'',`animation-delay:${db}s`)+
    part(vb,'head','',-30,-40,
      part(vb,'hm',`<ellipse cx="-36" cy="-50" rx="10" ry="4.5" fill="#E7A190" transform="rotate(28 -36 -50)"/>
        <ellipse cx="-50" cy="-42" rx="15.5" ry="13.5" fill="#F6CFBF" stroke="#D9A491" stroke-width="2"/>
        <g fill="#D9D0C1"><circle cx="-52" cy="-56" r="7.5"/><circle cx="-44" cy="-58" r="7"/><circle cx="-58" cy="-53" r="6"/></g>
        <g fill="url(#gWool)"><circle cx="-52" cy="-56" r="5.8"/><circle cx="-44" cy="-58" r="5.3"/><circle cx="-58" cy="-53" r="4.4"/></g>
        <ellipse cx="-63" cy="-38" rx="3" ry="2.2" fill="#C97D6E"/>
        <path d="M-62,-33 q4,3 8,0" stroke="#9A5A4A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <circle cx="-48" cy="-36" r="3.6" fill="#F49B92" opacity=".6"/>`,-30,-40,
        part(vb,'blink',`<ellipse cx="-54" cy="-44" rx="2.6" ry="3.3" fill="#2B2420"/><circle cx="-53.2" cy="-45.3" r="1" fill="#fff"/>`,-54,-44,'',`animation-delay:${dl}s`)))
  });
}

/* ---- 人物：girl / mom / dad ---- */
const HUM_VB=[-60,-186,120,192];
function humanHTML(o){
  const k=o.kind,kid=k==='girl',man=k==='dad';
  const h=kid?-100:-140,R=kid?23:22,sh=h+R+6,hip=-38;
  const skin='#F7D4B4',skinS='#DDA982',ink='#3E2C22';
  const C={girl:{d:'#E85D4A',ds:'#B53F31',hair:'#5E3620',shoe:'#E8762A'},mom:{d:'#F0903F',ds:'#C26A22',hair:'#7A4A2C',shoe:'#B5533A'},dad:{d:'#4D82B8',ds:'#2F5C8C',hair:'#33241A',shoe:'#4A3A30'}}[k];
  const legC=man?'#38507A':skin;
  const leg=x=>`<path d="M${x},${hip} L${x},-6" stroke="${legC}" stroke-width="${man?12:10}" stroke-linecap="round"/><ellipse cx="${x+(x<0?-3:3)}" cy="-3" rx="9.5" ry="5" fill="${C.shoe}"/>`;
  let torso='';
  if(man){torso=`<path d="M-17,${sh-2} Q0,${sh-7} 17,${sh-2} L19,-36 Q0,-33 -19,-36Z" fill="${C.d}" stroke="${C.ds}" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-7,${sh-4} L0,${sh+6} L7,${sh-4}Z" fill="#fff"/><g fill="#fff"><circle cx="0" cy="${sh+16}" r="2"/><circle cx="0" cy="${sh+30}" r="2"/><circle cx="0" cy="${sh+44}" r="2"/></g>
    <rect x="-19" y="-42" width="38" height="7" rx="2" fill="#5A3E2A"/>`;}
  else{const hem=kid?-30:-26;torso=`<path d="M-13,${sh-2} Q0,${sh-7} 13,${sh-2} L${kid?27:25},${hem} Q0,${hem+6} -${kid?27:25},${hem}Z" fill="${C.d}" stroke="${C.ds}" stroke-width="2.5" stroke-linejoin="round"/>`+
    (kid?`<path d="M-8,${sh-4} Q0,${sh+4} 8,${sh-4}" fill="#fff" stroke="#fff" stroke-width="3"/><g fill="#fff" opacity=".85"><circle cx="-7" cy="-58" r="2.8"/><circle cx="8" cy="-50" r="2.8"/><circle cx="-12" cy="-40" r="2.8"/><circle cx="12" cy="-37" r="2.8"/><circle cx="1" cy="-43" r="2.8"/><circle cx="3" cy="-62" r="2.4"/></g>`
        :`<path d="M-11,${sh+20} L11,${sh+20} L16,-30 Q0,-26 -16,-30Z" fill="#FFF6E6" stroke="#E5CBA5" stroke-width="2"/><rect x="-6" y="-56" width="12" height="9" rx="2" fill="none" stroke="#E5CBA5" stroke-width="2"/>`);}
  const hairBack=kid?`<circle cx="-25" cy="${h+4}" r="10" fill="${C.hair}"/><circle cx="25" cy="${h+4}" r="10" fill="${C.hair}"/>
      <path d="M-30,${h-8} l-8,-6 v12z M-30,${h-8} l8,-6 v12z" fill="#E8435A" transform="translate(4,0)"/><path d="M30,${h-8} l-8,-6 v12z M30,${h-8} l8,-6 v12z" fill="#E8435A" transform="translate(-4,0)"/>`

function fitTo(el,w,h,cover){const p=el.parentElement;const f=()=>{const r=p.getBoundingClientRect();if(!r.width||!r.height)return;const k=cover?Math.max(r.width/w,r.height/h):Math.min(r.width/w,r.height/h);el.style.setProperty('--k',k.toFixed(4))};new ResizeObserver(f).observe(p);f();}

bubbleNear=function(id,who,text,ms=4000){later(()=>{const n=$('#'+id);if(!n)return;const d=ov(`<b>${who}</b>${text}`,{},'bubble');
  const place=()=>{if(!d.isConnected)return;const b=n.getBoundingClientRect(),s=$('#stage').getBoundingClientRect();const W=d.offsetWidth,H=d.offsetHeight;const top=b.top+b.height*(+n.dataset.top||0);
    let x=b.left-s.left+b.width/2-W/2,y=top-s.top-H-12;x=Math.max(8,Math.min(s.width-W-8,x));if(y<8)y=8;const L=Math.round(x)+'px',T=Math.round(y)+'px';if(d.style.left!==L)d.style.left=L;if(d.style.top!==T)d.style.top=T;requestAnimationFrame(place)};
  place();later(()=>d.remove(),ms)},60)};

const LOOK_CLS={'大大的':'lk-big','長長的':'lk-long','圓圓的':'lk-round','方方的':'lk-square','亮亮的':'lk-bright'};
function lkSvg(name){return `<svg viewBox="0 0 120 120" overflow="visible">${name==='月亮'?`<defs><radialGradient id="gMoon" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#FFF3C4"/><stop offset="1" stop-color="#FFD43B"/></radialGradient></defs>`:''}${ICN[name]||''}</svg>`}
function lkFig(name,look){
  const cls=LOOK_CLS[look]||'';
  const ring=(cls==='lk-round'||cls==='lk-square')?'<i class="lkring"></i>':'';
  return `<div class="lkitem ${cls}"><div class="lkfig"><i class="lkglow"></i>${ring}${lkSvg(name)}</div><div class="lklbl">${name}</div></div>`;
}
function lkOwn(text){
  return `<div class="lkitem"><div class="lkfig"><div class="lkthought"><b></b></div></div><div class="lklbl">自己寫的</div></div>`.replace('<b></b>',`<b>${lkEsc(text)}</b>`);
}
function lkEsc(t){return t.replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))}
function lkReady(){const own=($('#lkb')&&$('#lkb').value||'').trim();return !!(pk.look&&pk.a&&(own||(pk.q&&pk.b)))}
function lkSentence(){const own=($('#lkb')&&$('#lkb').value||'').trim();return `${pk.look}${pk.a}像${own||(pk.q+pk.b)}`}
function paintLK(){
  const box=$('#lkart');if(!box)return;
  const own=($('#lkb')&&$('#lkb').value||'').trim();
  let html,key;
  if(lkReady()){
    const right=own?lkOwn(own):lkFig(pk.b,'');
    html=`<div class="lkart pop"><div class="lkpair">${lkFig(pk.a,pk.look)}<div class="lklike">像</div>${right}</div><div class="lksent">${lkEsc(lkSentence())}。</div></div>`;
    key='ok:'+lkSentence();
  }else{
    html=`<div class="lkart lk-demo"><div class="lkpair">${lkFig('羊','')}<div class="lklike">像</div>${lkFig('棉花','')}</div><div class="lksent">課文例子：大大小小的羊，像一堆堆棉花。</div></div>`;
    key='demo';
  }
  if(box.dataset.key===key)return;
  box.dataset.key=key;box.innerHTML=html;
}
function buildLK(){$('#lkl').innerHTML=`<div class="lkteach"><h4>句子練習：……像……</h4>
  <div class="note"><b>1.</b> 先想一想，這個事物像什麼東西？</div>
  <div class="blocks">${blk('事物①','羊','#3A9AD6')}${blk('','像','#999',1)}${blk('事物②','棉花','#E8762A')}<span>。</span></div>
  <div class="note">🐑 ＋ ☁️ 羊和棉花都是<b>白色</b>的，而且<b>形狀相似</b>，所以說羊像棉花。</div>
  <div class="note"><b>2.</b> 再加入描述事物樣子的詞語和量詞，讓句子更完整。</div>
  <div class="blocks">${blk('什麼樣子','大大小小','#E86A8A')}${blk('','的','#999',1)}${blk('事物①','羊','#3A9AD6')}${blk('','像','#999',1)}${blk('量詞','一堆堆','#4A9A3C')}${blk('事物②','棉花','#E8762A')}<span>。</span></div></div>
  <div class="lkart-wrap" id="lkart"></div>`;
  renderLK();}
function renderLK(){const r=$('#lkr');const keep=$('#lkb')?$('#lkb').value:'';
  const sec=(k,t)=>`<div class="slot"><h5>${t}</h5><div class="chips" data-k="${k}" style="--c:${LK[k].c}">${LK[k].l.map(x=>`<button class="${pk[k]===x?'on':''}">${x}</button>`).join('')}</div></div>`;
  r.innerHTML=`<h4>我來說說看：${pk.a}像什麼東西？</h4>${sec('a','事物①（選一樣）')}${sec('look','什麼樣子')}${sec('q','量詞')}${sec('b','事物②（像什麼）')}
   <div class="slot"><h5>或自己寫事物②</h5><input id="lkb" placeholder="例如：一面鏡子"></div>
   <div class="blocks" id="lkout"></div>`;
  r.querySelectorAll('.chips').forEach(ch=>{const k=ch.dataset.k;ch.querySelectorAll('button').forEach(b=>b.onclick=()=>{pk[k]=b.textContent;renderLK()})});
  if(keep){$('#lkb').value=keep} $('#lkb').oninput=updLK;updLK();}
function updLK(){const own=($('#lkb')&&$('#lkb').value||'').trim();const B=(x,ph)=>x||ph;
  const de=(pk.look&&/的$/.test(pk.look))?'':blk('','的','#999',1);
  $('#lkout').innerHTML=`${blk('什麼樣子',B(pk.look,'？'),LK.look.c)}${de}${blk('事物①',pk.a,LK.a.c)}${blk('','像','#999',1)}${own?blk('事物②',own,LK.b.c):blk('量詞',B(pk.q,'？'),LK.q.c)+blk('事物②',B(pk.b,'？'),LK.b.c)}<span>。</span>`;
  paintLK();}
function resetLK(){pk={look:'',a:'窗戶',q:'',b:''};if($('#lkb'))$('#lkb').value='';if($('#lkart'))$('#lkart').dataset.key='';renderLK();}
function sayLK(){speak(lkSentence())}

/* ---------- idioms ---------- */
const ID=[
 {n:'平心靜氣',e:'😌',c:'#2E8B57',z:'靜',w:'靜靜的吃草',m:'形容心情平和，態度冷靜。',x:'當衝突發生時，應該平心靜氣的應對。'},
 {n:'平易近人',e:'🤗',c:'#E8762A',z:'近',w:'近看',m:'形容態度和藹親切，容易接近。也用來形容詩文淺白易懂。',x:'老師十分平易近人，有問題可以直接向他反應。'}];
const IQ=[['當衝突發生時，應該＿＿的應對。','平心靜氣',1],['老師十分＿＿，有問題可以直接向他反應。','平易近人',1],['姐姐和我吵架後，我們坐下來＿＿的好好談一談。','平心靜氣',0],['新來的校長常常笑咪咪的，很＿＿。','平易近人',0]];
let iq=[],iqi=0;
function hl(n,z){return n.replace(z,`<span class="hz">${z}</span>`)}
function buildIdiom(sel){const box=$('#idi');box.innerHTML='';ID.forEach((d,i)=>{const b=document.createElement('button');b.className='icard'+(i===sel?' on':'');b.style.setProperty('--c',d.c);b.innerHTML=`<span class="em">${d.e}</span><b>${d.n}</b><small>生字：「${d.z}」</small>`;b.onclick=()=>buildIdiom(i);box.appendChild(b)});
  const det=document.createElement('div');det.className='idet';det.id='idet';box.appendChild(det);
  if(sel===undefined){det.innerHTML='<div style="color:#5F6E5A">點上面的成語卡，看看意思和例句；或按下方「考考你」練習。</div>';return}
  const d=ID[sel];det.innerHTML=`<h3 style="color:${d.c}">${d.e} ${hl(d.n,d.z)}</h3><div class="mean"><b>意思：</b>${d.m}</div><div class="ex"><b>例句：</b>${d.x}</div><div class="lk">課文裡的生字「${d.z}」：${hl(d.w,d.z)}</div>`;speak(d.n+'。'+d.m+'。例句：'+d.x);}
function idiomQuiz(){iq=[...IQ].sort(()=>Math.random()-.5);iqi=0;buildIdiom();askIdiom();}
function askIdiom(){const det=$('#idet');if(iqi>=iq.length){det.innerHTML='<h3>全部完成！🎉</h3>';speak('全部完成，你好棒');return}
  const [s,a,b]=iq[iqi];det.innerHTML=`<div><span class="tg" style="background:${b?'#C8622A':'#9AA6B5'}">${b?'課本例句':'練習題'}</span>第 ${iqi+1}／${iq.length} 題：空格要填哪個成語？</div><div style="font-size:3.8vh;font-weight:700;margin-top:1vh">${s.replace('＿＿','<span class="blank">？</span>')}</div><div class="opts"></div><div class="fb"></div>`;speak(s.replace('＿＿','什麼'));
  ID.forEach(d=>{const x=document.createElement('button');x.textContent=d.n;x.onclick=()=>{const fb=det.querySelector('.fb');if(d.n===a){det.querySelector('.blank').textContent=a;fb.textContent='答對了！⭐';fb.style.color='#2E8B57';speak('答對了，'+s.replace('＿＿',a));iqi++;later(askIdiom,2600)}else{fb.textContent='再想想看：「'+d.n+'」的意思是'+d.m;fb.style.color='#C8362B'}};det.querySelector('.opts').appendChild(x)});}

/* ---------- steps ---------- */
const S=[
 {st:0,sc:'farm',tag:'第一段',no:'去農場'},
 {st:1,sc:'farm',tag:'第二段',no:'成群的羊'},
 {st:2,sc:'farm',tag:'第三段',no:'小羊跑開了'},
 {st:3,sc:'farm',tag:'第四段',no:'說再見'},
 {st:4,sc:'farm',tag:'第五段',no:'美好的一天'},
 {sc:'wx',tag:'天氣詞語',no:'四字詞語',guide:['風和日麗的天氣，','媽媽帶我去農場玩。','認識四個','有關天氣的四字詞語！'],enter(){buildWX(0)},acts:[['🎯 考考你',wxQuiz],['📖 看說明',()=>buildWX(0)]]},
 {sc:'like',tag:'句子練習',no:'……像……',guide:['大大小小的羊，','像一堆堆棉花。','想一想：','兩樣東西','哪裡很像？'],enter(){buildLK()},acts:[['🔊 念我的句子',sayLK],['🧹 清空重寫',resetLK]]},
 {sc:'idiom',tag:'成語',no:'從生字學成語',guide:['從課文的生字，','認識成語：','「靜」和「近」，','藏在哪個成語裡？'],enter(){buildIdiom(0)},acts:[['🎯 考考你',idiomQuiz],['📖 看成語卡',()=>buildIdiom(0)]]}
];

/* ---------- navigation ---------- */
const TABS=[['去農場',0,1],['成群的羊',1,2],['小羊跑開',2,3],['說再見',3,4],['美好的一天',4,5],['天氣詞語',5],['……像……',6],['成語',7]];
TABS.forEach(([n,i,num],k)=>{if(k===5)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">｜</span>');else if(k>0&&k<5)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">›</span>');
  const b=document.createElement('button');b.innerHTML=(num?`<i>${num}</i>`:'')+n;b.onclick=()=>go(i);b.dataset.i=i;$('#tabs').appendChild(b)});
let cur=0;
function lineHTML(t){return t.replace(/\[\[(.+?)\]\]/g,(m,w)=>`<span class="v" role="button" tabindex="0" data-w="${w}">${w}</span>`)}
function go(i){
  stopAll();cur=Math.max(0,Math.min(S.length-1,i));const st=S[cur];
  $$('.scene').forEach(s=>s.classList.toggle('on',s.id==='sc-'+st.sc));
  $('#ptag').textContent=st.tag;$('#pno').textContent=st.no;
  const isT=st.st!==undefined;const lines=isT?ST[st.st].lines:st.guide;
  const t=$('#txt');t.classList.toggle('guide',!isT);t.classList.toggle('long',isT&&!!ST[st.st].long);
  t.innerHTML=lines.map((l,k)=>`<span class="ln" data-k="${k}" ${isT?'tabindex="0"':''}>${lineHTML(l)}</span>`).join('');
  t.querySelectorAll('.v').forEach(v=>{v.onclick=e=>{e.stopPropagation();showVocab(v.dataset.w)};v.onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();showVocab(v.dataset.w)}}});
  if(isT){t.querySelectorAll('.ln').forEach(l=>{l.onclick=()=>{autoOn=false;playLine(+l.dataset.k)};l.onkeydown=e=>{if(e.key==='Enter')l.onclick()}});lineIdx=-1;stateTo(st.st,-1);}
  t.scrollTop=0;t.scrollLeft=0;
  const A=$('#acts');A.innerHTML='';
  const acts=isT?[['▶ 下一句',nextLine,1],['🎬 整段自動播',autoPlay],['🔁 從頭來',()=>{stopAll();lineIdx=-1;stateTo(st.st,-1);$$('#txt .ln').forEach(l=>l.classList.remove('on','done'))}]]:(st.acts||[]);
  acts.forEach(([l,f,m])=>{const b=document.createElement('button');b.textContent=l;if(m)b.className='main';b.onclick=f;A.appendChild(b)});
  if(isT)A.insertAdjacentHTML('beforeend','<span class="hint" id="lineNo">點右邊的句子，也可以一句一句看</span>');
  let active=0;TABS.forEach(([n,ti])=>{if(cur>=ti)active=ti});
  $$('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===active));
  $('#prev').disabled=cur===0;$('#next').disabled=cur===S.length-1;
  st.enter&&st.enter();
}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#say').onclick=()=>{const st=S[cur];const lines=st.st!==undefined?ST[st.st].lines:st.guide;speak(lines.join(''))};
document.addEventListener('keydown',e=>{if(e.target.closest('input,.v,.ln'))return;if(e.key===' '&&S[cur].st!==undefined){e.preventDefault();nextLine()}if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
go(0);
</script>
