<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第十課 老鼠嫁女兒｜課文動起來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --bg:#F6E7DF; --panel:#FFFFFF; --ink:#2B1E1A; --soft:#7A6058;
  --red:#C8362B; --deep:#8E1F17; --gold:#E8A33A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#231816; --panel:#302220; --ink:#F6ECE8; --soft:#C9AFA6; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--kai);background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:1.4vw;padding:1vh 1.6vw .8vh;flex-wrap:wrap}
h1{margin:0;font-size:4.4vh;color:var(--red);letter-spacing:.12em;white-space:nowrap}
h1 small{font-size:.5em;color:var(--soft);letter-spacing:.05em;margin-right:.4em}
nav{display:flex;gap:.3vw;flex-wrap:wrap;align-items:center}
nav button{font:inherit;font-size:2.4vh;padding:.5vh 1vw;border-radius:10px;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer}
nav button.on{background:var(--panel);border-color:var(--red);color:var(--red);font-weight:700}
nav .sep{color:var(--soft)}
main{display:grid;grid-template-columns:1fr 50vh;gap:1.2vw;padding:0 1.6vw 1.4vh;min-height:0}
.stagewrap{display:grid;grid-template-rows:1fr auto;gap:1vh;min-height:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#2A1C1A;min-height:0}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene>svg{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none;z-index:7}
.acts{display:flex;flex-wrap:wrap;gap:.6vw;min-height:6vh;align-items:center}
.acts button,.acts select{font:inherit;font-size:2.5vh;padding:.8vh 1.2vw;border-radius:999px;border:3px solid var(--red);background:var(--panel);color:var(--ink);cursor:pointer}
.acts button:hover{background:var(--red);color:#fff}
.acts button.main{background:var(--red);color:#fff;font-weight:700}
.acts label{font-size:2.4vh;color:var(--soft)}
button:focus-visible,.v:focus-visible,.ln:focus-visible,select:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
aside{background:var(--panel);border-radius:20px;padding:1.6vh 1.4vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:1vh;min-height:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh;color:var(--soft)}
.ptitle b{color:var(--red);font-size:1.15em}
.txt{writing-mode:vertical-rl;font-size:3.1vh;line-height:1.6;letter-spacing:.04em;width:100%;height:100%;min-height:0;overflow:auto;display:block;scroll-behavior:smooth}
.ln{display:block;cursor:pointer;border-radius:10px;padding:.4vh 0;transition:background .3s}
.ln:hover{background:rgba(0,0,0,.05)}
.ln.on{background:#FFE7A8;color:#2B1E1A}
.ln.mine{box-shadow:inset -4px 0 0 #3A7BD5}
.ln .who{font-weight:700}
.ln .dir{color:#8A6E66;font-size:.88em}
.ln.on .dir{color:#6A4E46}
.ln.stage{color:#9A4A20}
.ln.info{color:var(--soft)}
.ln.act{font-size:1.25em;font-weight:700;color:var(--red)}
.guide .ln{cursor:default}
.v{border:2px solid var(--gold);border-radius:6px;cursor:pointer;color:#1F6FA0;padding:.1em 0}
.v.x{border-style:dashed;border-color:#9AA6B5;color:inherit}
@media (prefers-color-scheme: dark){ .v{color:#86C9F0} .ln.on .v{color:#1F6FA0} }
.pnav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.8vh}
.pnav button{font:inherit;font-size:2.6vh;padding:1vh 0;border-radius:12px;border:2px solid var(--soft);background:transparent;color:var(--ink);cursor:pointer}
.pnav .say{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.pnav button:disabled{opacity:.35}
#pop{position:fixed;left:3vw;bottom:13vh;max-width:48vw;background:#fff;color:#2B1E1A;border:4px solid var(--gold);border-radius:16px;padding:1.4vh 1.6vw;font-size:3vh;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:20}
#pop.on{display:block;animation:pop .3s}
#pop h3{margin:0 0 .4vh;color:#C8362B;font-size:1.25em}
#pop .row{display:flex;gap:1vw;margin-top:.8vh}
#pop button{font:inherit;font-size:.85em;border-radius:10px;border:2px solid #C8362B;background:#fff;color:#C8362B;padding:.3vh 1vw;cursor:pointer}

/* curtain */
.cur{position:absolute;top:0;bottom:0;width:51%;z-index:6;background:repeating-linear-gradient(90deg,#A3141D 0 5%,#7E0E15 5% 6%);transition:transform 1.8s ease-in-out;box-shadow:inset 0 -30px 40px rgba(0,0,0,.3)}
#curL{left:0}#curR{right:0}
.stage.open #curL{transform:translateX(-100%)}
.stage.open #curR{transform:translateX(100%)}
.valance{position:absolute;left:0;right:0;top:0;height:5%;background:#7E0E15;z-index:6;border-bottom:4px solid #E8A33A}
.instant *, .instant{transition:none!important}
.instant .cur{transition:none!important}

/* overlays */
.bubble{position:absolute;background:#fff;color:#2B1E1A;border:4px solid #2B1E1A;border-radius:18px;padding:.7vh 1vw;font-size:2.7vh;line-height:1.45;max-width:42%;animation:pop .3s cubic-bezier(.3,1.6,.6,1);z-index:8}
.bubble b{display:block;font-size:.85em;color:var(--c,#C8362B)}
.bubble:after{content:"";position:absolute;left:var(--tx,30px);bottom:-18px;border:10px solid transparent;border-top:12px solid #2B1E1A}
.bubble.turn{border-color:#3A7BD5;background:#EAF2FF}
.narr{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);background:rgba(43,30,26,.88);color:#fff;border-radius:14px;padding:1vh 1.6vw;font-size:2.7vh;line-height:1.5;max-width:86%;animation:pop .3s;z-index:8}
.narr b{color:#FFD27A;margin-right:.6em}
.narr.dirn{background:rgba(255,248,230,.95);color:#6A3A10;border:3px dashed #C98A3C}
.narr.dirn b{color:#C8362B}
.badge{position:absolute;background:#fff;color:#2B1E1A;border:4px solid var(--red);border-radius:14px;padding:.6vh 1.1vw;font-size:2.8vh;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.6,1);white-space:nowrap;z-index:8}
.badge small{display:block;font-weight:400;font-size:.8em;color:#6A5550}
.tag{position:absolute;background:#FFE7A8;color:#2B1E1A;border:2px solid #8E1F17;border-radius:8px;padding:.1vh .5vw;font-size:2.2vh;font-weight:700;transform:translateX(-50%);animation:pop .4s;z-index:8;white-space:nowrap}
.bub{position:absolute;font-size:4.6vh;font-weight:700;color:#fff;-webkit-text-stroke:2px #C8362B;paint-order:stroke fill;animation:floatup 1.9s ease-out forwards;z-index:8}
@keyframes floatup{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1)}to{transform:translateY(-90px);opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.lbl{font-family:var(--kai);font-weight:700}

/* characters */
.mv{transition:transform 1.2s ease-in-out}
.bd{transform-box:fill-box;transform-origin:50% 100%}
.talk .bd{animation:talk .28s ease-in-out infinite alternate}
@keyframes talk{to{transform:translateY(-8px) scaleY(1.03)}}
.arm{transform-box:fill-box;transform-origin:50% 0;transition:transform .4s}
.hands .arm.l{transform:rotate(150deg)}.hands .arm.r{transform:rotate(-150deg)}
.hands .bd{animation:talk .25s ease-in-out infinite alternate}
.run .bd{animation:runb .18s ease-in-out infinite alternate}
@keyframes runb{to{transform:translateY(-10px) rotate(-6deg)}}
.spin .bd{animation:spin .5s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.jump .bd{animation:jump .7s ease-out}
@keyframes jump{40%{transform:translateY(-60px)}100%{transform:translateY(0)}}
.blush .blsh{opacity:1}
.blsh{opacity:0;transition:opacity .5s}
.sad .mouthS{display:none}.sad .mouthF{display:inline}
.mouthF{display:none}
.bigeye .eye{transform:scale(1.8);transform-box:fill-box;transform-origin:center}
.gone{opacity:0}
.fade{transition:opacity .8s}
.small .bd{transform:scale(.8)}
.bride .wedd{display:inline}.wedd{display:none}

/* act sets */
#a2out,#a2wall,#a3night{transition:opacity 1s}
.atwall #a2out{opacity:0}
#a2wall{opacity:0}.atwall #a2wall{opacity:1}
#a2skyDark{opacity:0;transition:opacity 1s}.dark #a2skyDark{opacity:.45}
.grassb{transform-box:fill-box;transform-origin:50% 100%;transition:transform .6s}
.bend .grassb{transform:rotate(38deg)}
.hot #a2sun .bd{filter:drop-shadow(0 0 20px #FFB020)}
.sweat{display:none}.hot .sweat{display:inline}
.drop{animation:drop 1s ease-in infinite}
@keyframes drop{from{transform:translateY(0);opacity:1}to{transform:translateY(18px);opacity:0}}
#a3night{opacity:0}.night #a3night{opacity:1}
#proc{transition:transform 7s linear}
.night #proc{transform:translateX(1300px)}
#ball{transition:transform 1.4s cubic-bezier(.3,.1,.5,1)}
.toss #ball{transform:translate(340px,190px)}
#ball1{transition:transform 1s,opacity 1s}
.drop1 #ball1{transform:translate(0,250px)}

/* html scenes */
.html{background:linear-gradient(#FBEFE8,#FFF9F6)}
.chain{position:absolute;inset:0}
.chain svg{width:100%;height:100%}
.alab{opacity:0;transition:opacity .6s}.alab.on{opacity:1}
.parts{position:absolute;inset:3%;display:grid;grid-template-columns:1fr 1fr;gap:2vw;color:#2B1E1A}
.sample{background:#fff;border-radius:18px;padding:2vh 1.4vw;writing-mode:vertical-rl;font-size:3vh;line-height:1.7;overflow:auto;border:3px solid #E5CFC6}
.sample span{border-radius:6px;transition:background .3s}
.sample span.hi{background:#FFD76A}
.pbtns{display:flex;flex-direction:column;gap:1.2vh}
.pbtns .grid{display:grid;grid-template-columns:1fr 1fr;gap:1vh}
.pbtns button{font:inherit;font-size:3vh;padding:1.2vh 0;border-radius:14px;border:3px solid #C8362B;background:#fff;color:#2B1E1A;cursor:pointer}
.pbtns button.on{background:#C8362B;color:#fff}
.pexp{background:#FFF2D6;border-radius:14px;padding:1.4vh 1.2vw;font-size:3vh;line-height:1.6;min-height:16vh}

@media (max-width:820px), (max-aspect-ratio:1/1){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  .stage{height:58vh}
  .txt{writing-mode:horizontal-tb;height:auto;max-height:50vh;font-size:19px}
  .acts button,.pnav button,nav button,.acts select{font-size:15px}
  h1{font-size:26px}
  .parts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ .talk .bd,.run .bd,.spin .bd{animation:none} }

/* ===== 修辭 ===== */
:root{--c-p:#2E8B57;--c-m:#8E5AD6;--c-e:#D9342B;--c-q:#2E6FB3}
#rhBtn{font:inherit;font-size:2.2vh;border-radius:999px;border:2px solid #8E5AD6;background:transparent;color:var(--ink);padding:.3vh .8vw;cursor:pointer}
#rhBtn.on{background:#8E5AD6;color:#fff}
.rh{border-radius:6px;transition:background .3s}
.rhon .rh{cursor:pointer;background:color-mix(in srgb,var(--rc) 18%,transparent);box-shadow:inset -3px 0 0 var(--rc)}
.rhon .rh::before{content:attr(data-l);font-size:.5em;background:var(--rc);color:#fff;border-radius:4px;padding:.1em .15em;margin-bottom:.2em;font-weight:700;letter-spacing:0}
.rhleg{grid-column:1/-1;display:none;gap:.4vw;font-size:2vh;flex-wrap:wrap;align-items:center}
.rhleg.legon{display:flex}
.rhleg span{color:#fff;border-radius:6px;padding:.1vh .5vw}
.rhleg small{color:var(--soft)}
#pop .why{background:#F3EEFF;border-radius:10px;padding:.6vh .8vw;margin-top:.6vh;font-size:.92em}
.rcards{position:absolute;inset:3% 3% auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw}
.rcard{background:#fff;border-radius:16px;border:4px solid var(--rc);padding:1.2vh .8vw;color:#222;cursor:pointer;font:inherit;text-align:left}
.rcard h4{margin:0 0 .6vh;color:var(--rc);font-size:3.6vh}
.rcard p{margin:0;font-size:2.3vh;line-height:1.5}
.rcard.on{background:color-mix(in srgb,var(--rc) 12%,#fff)}
.rex{position:absolute;left:3%;right:3%;top:42%;bottom:4%;background:#fff;border-radius:16px;padding:2vh 2vw;color:#222;font-size:3vh;line-height:1.7;overflow:auto}
.rex .q{font-size:3.8vh;font-weight:700;margin:1vh 0 2vh}
.rex .opts{display:flex;gap:1vw;flex-wrap:wrap}
.rex .opts button{font:inherit;font-size:3.6vh;padding:1vh 2vw;border-radius:16px;border:4px solid var(--rc);background:#fff;color:var(--rc);cursor:pointer;font-weight:700}
.rex .fb{font-size:3vh;min-height:4.5vh;margin-top:1.6vh}
.rex .tagq{font-size:2.2vh;color:#fff;border-radius:6px;padding:.1vh .6vw;margin-right:.6vw}
@media (max-width:820px), (max-aspect-ratio:1/1){.rcards{grid-template-columns:repeat(2,1fr)}.rex{top:52%}}
a.hall-back{position:fixed;z-index:40;top:0;right:0;font-family:var(--kai);font-size:1.7vh;line-height:1.2;padding:.45vh .8vw;white-space:nowrap;background:var(--panel);color:var(--soft);text-decoration:none;border:1px solid var(--soft);border-top:0;border-right:0;border-bottom-left-radius:12px}a.hall-back:hover,a.hall-back:focus-visible{color:var(--ink)}
</style>
</head>
<body>
<a class="hall-back" href="../">← 回課文大廳</a>
<header>
  <h1><small>第十課</small>老鼠嫁女兒</h1>
  <nav id="tabs"></nav>
</header>

<main>
  <div class="stagewrap">
    <div class="stage" id="stage">

      <!-- ACT 1 -->
      <div class="scene" id="sc-a1">
        <svg id="A1" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
          <rect width="1000" height="560" fill="#F7E3C8"/>
          <path d="M0,330 L80,280 L160,330 L160,420 L0,420Z M620,320 L700,270 L780,320 L780,420 L620,420Z M820,330 L890,290 L960,330 L960,420 L820,420Z" fill="#D9B48A"/>
          <rect y="420" width="1000" height="140" fill="#C9A273"/>
          <g id="plat1">
            <rect x="120" y="270" width="340" height="16" fill="#8A5A34"/>
            <rect x="140" y="286" width="16" height="200" fill="#8A5A34"/><rect x="424" y="286" width="16" height="200" fill="#8A5A34"/>
            <path d="M156,300 L424,470 M424,300 L156,470" stroke="#8A5A34" stroke-width="8"/>
            <path d="M120,290 Q290,350 460,290" stroke="#D9342B" stroke-width="12" fill="none"/>
            <circle cx="130" cy="290" r="18" fill="#D9342B"/><circle cx="290" cy="322" r="18" fill="#D9342B"/><circle cx="450" cy="290" r="18" fill="#D9342B"/>
            <rect x="150" y="190" width="10" height="80" fill="#8A5A34"/><rect x="420" y="190" width="10" height="80" fill="#8A5A34"/>
            <rect x="140" y="170" width="300" height="32" rx="6" fill="#D9342B"/><text x="290" y="194" text-anchor="middle" font-size="22" fill="#FFE7A8" class="lbl">綵球招親</text>
          </g>
          <g id="ball1"><circle cx="0" cy="0" r="0"/></g>
          <g id="A1chars"></g>
        </svg>
      </div>

      <!-- ACT 2 -->
      <div class="scene" id="sc-a2">
        <svg id="A2" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
          <defs><linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8CCBEA"/><stop offset="1" stop-color="#E8F5FB"/></linearGradient></defs>
          <rect width="1000" height="560" fill="url(#sky2)"/>
          <rect id="a2skyDark" width="1000" height="560" fill="#3A4250"/>
          <g id="a2out">
            <path d="M0,420 Q250,360 500,400 T1000,390 L1000,560 L0,560Z" fill="#9CCB7A"/>
            <g id="grass2"></g>
            <path d="M60,560 Q200,470 420,440" stroke="#D9C49A" stroke-width="40" fill="none"/>
          </g>
          <g id="a2wall">
            <rect width="1000" height="560" fill="#F3DDC0"/>
            <path d="M0,330 L80,280 L160,330 L160,420 L0,420Z M820,330 L890,290 L960,330 L960,420 L820,420Z" fill="#D9B48A"/>
            <rect y="420" width="1000" height="140" fill="#C9A273"/>
          </g>
          <g id="A2chars"></g>
        </svg>
      </div>

      <!-- ACT 3 -->
      <div class="scene" id="sc-a3">
        <svg id="A3" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
          <rect width="1000" height="560" fill="#FBE0D0"/>
          <path d="M0,330 L80,280 L160,330 L160,420 L0,420Z M620,320 L700,270 L780,320 L780,420 L620,420Z" fill="#E3B48E"/>
          <rect y="420" width="1000" height="140" fill="#D9A47A"/>
          <g id="lanterns3"></g>
          <g>
            <rect x="120" y="270" width="340" height="16" fill="#8A5A34"/>
            <rect x="140" y="286" width="16" height="200" fill="#8A5A34"/><rect x="424" y="286" width="16" height="200" fill="#8A5A34"/>
            <path d="M156,300 L424,470 M424,300 L156,470" stroke="#8A5A34" stroke-width="8"/>
            <path d="M120,290 Q290,350 460,290" stroke="#D9342B" stroke-width="12" fill="none"/>
            <circle cx="130" cy="290" r="18" fill="#D9342B"/><circle cx="290" cy="322" r="18" fill="#D9342B"/><circle cx="450" cy="290" r="18" fill="#D9342B"/>
          </g>
          <g transform="translate(860,180)"><rect x="-50" y="0" width="100" height="160" rx="8" fill="#D9342B" stroke="#8E1F17" stroke-width="3"/><text x="0" y="60" text-anchor="middle" font-size="34" fill="#FFE7A8" class="lbl">正月</text><text x="0" y="116" text-anchor="middle" font-size="34" fill="#FFE7A8" class="lbl">初三</text></g>
          <g id="A3chars"></g>
          <g id="a3night">
            <rect width="1000" height="560" fill="#141C3A" opacity=".82"/>
            <g id="stars3"></g>
            <circle cx="860" cy="90" r="36" fill="#FFF3C4"/>
            <g id="proc"></g>
          </g>
        </svg>
      </div>

      <!-- strength chain -->
      <div class="scene html" id="sc-chain"><div class="chain"><svg viewBox="0 0 1000 560" id="chainSvg"></svg></div></div>

      <!-- script parts -->
      <div class="scene html" id="sc-parts">
        <div class="parts">
          <div class="sample" id="sample"></div>
          <div class="pbtns"><div class="grid" id="pgrid"></div><div class="pexp" id="pexp">點一點右邊的按鈕，看看劇本的每個部分在哪裡。</div></div>
        </div>
      </div>

      <div class="valance" id="valance"></div>
      <div class="cur" id="curL"></div><div class="cur" id="curR"></div>
      <div class="scene html" id="sc-rh"><div class="rcards" id="rcards"></div><div class="rex" id="rex"></div></div>
      <div id="ov"></div>
    </div>
    <div class="acts" id="acts"></div>
  </div>

  <aside>
    <div class="ptitle"><span id="ptag"></span><button id="rhBtn" aria-pressed="false">🔍 修辭</button><b id="pno"></b></div>
    <div class="txt" id="txt"></div>
    <div class="pnav"><div class="rhleg" id="rhleg"><span style="background:var(--c-p)">擬人</span><span style="background:var(--c-m)">譬喻</span><span style="background:var(--c-e)">感嘆</span><span style="background:var(--c-q)">設問</span><small>點有顏色的句子看說明</small></div>
      <button id="prev">◀ 上一頁</button>
      <button id="say" class="say">🔊 念這一句</button>
      <button id="next">下一頁 ▶</button>
    </div>
  </aside>
</main>

<div id="pop"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
let timers=[];let INSTANT=false;let autoOn=false;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;}
function seq(fn,ms){if(INSTANT)fn();else later(fn,ms);}
function stopAll(){timers.forEach(clearTimeout);timers=[];autoOn=false;try{speechSynthesis.cancel()}catch(e){};$('#ov').innerHTML='';$('#pop').classList.remove('on');}

/* ---------- playing lines ---------- */
let lineIdx=-1,myRole='';
function curAct(){return S[cur].act}
function lineText(l){return l.t}
function showSpeech(l){
  if(l.w==='act'||l.w==='info')return;
  const text=noDir(l.t);
  if(l.w==='旁白'||l.w==='△'||l.w==='全體'){
    const d=ov(`<b>${l.w==='△'?'△ 舞臺指示':l.w==='全體'?'全體':'旁白'}</b>${clean(l.t).replace(/^△/,'')}`,{},'narr'+(l.w==='△'?' dirn':''));return;}
  const id=`${curAct()}-${IDK[l.w]}`;
  later(()=>{const b=screenBox(id);if(!b)return;const d=ov(`<b>${l.w}</b>${text}`,{},'bubble'+(l.w===myRole?' turn':''));d.style.setProperty('--c',COLORS[l.w]);
    const W=d.offsetWidth,H=d.offsetHeight;let x=b.x+b.w/2-40,y=b.y-H-18;if(x+W>b.sw-8)x=b.sw-W-8;if(x<8)x=8;if(y<8)y=Math.min(b.y+b.h+10,b.sh-H-8);d.style.left=x+'px';d.style.top=y+'px';d.style.setProperty('--tx',Math.max(16,Math.min(W-30,b.x+b.w/2-x-10))+'px');},l.bd||80);
}
function talkOn(l,on){if(!IDK[l.w])return;const id=`${curAct()}-${IDK[l.w]}`;if(l.w==='村中老鼠們')$$(`#${id} .cm`).forEach(c=>c.classList.toggle('talk',on));else cls(id,'talk',on);}
function playLine(k,{speakIt=true,onend}={}){
  const act=curAct(),L=ACTS[act];if(!L)return;
  later(()=>{},0);
  stopTimersOnly();$('#ov').innerHTML='';
  // rebuild state up to k-1 instantly
  INSTANT=true;$('#stage').classList.add('instant');setupAct(act);
  for(let i=0;i<k;i++){L[i].fx&&L[i].fx();}
  void $('#stage').offsetWidth;
  INSTANT=false;
  requestAnimationFrame(()=>{$('#stage').classList.remove('instant');
    const l=L[k];lineIdx=k;
    l.fx&&l.fx();
    showSpeech(l);
    $$('#txt .ln').forEach((x,i)=>x.classList.toggle('on',i===k));
    const ln=$(`#txt .ln[data-k="${k}"]`);if(ln)ln.scrollIntoView({block:'center',inline:'nearest',behavior:'smooth'});
    const txt=noDir(l.t).replace(/……/g,'，');
    const isMine=myRole&&l.w===myRole;
    if(isMine){autoWait=true;temp('輪到你了！請念出你的臺詞 🎤',{left:'50%',top:'40%',transform:'translateX(-50%)'},'badge',2600);return;}
    talkOn(l,true);
    const fin=()=>{talkOn(l,false);onend&&onend()};
    if(speakIt&&txt.trim()){let done=false;const once=()=>{if(done)return;done=true;fin()};speak(txt,l.w==='△'||l.w==='info'||l.w==='act'?'旁白':l.w,()=>later(once,500));later(once,Math.max(2500,txt.length*420+1500));}
    else later(fin,1800);
  });
}
let autoWait=false;
function stopTimersOnly(){timers.forEach(clearTimeout);timers=[];try{speechSynthesis.cancel()}catch(e){}}
function nextLine(){const L=ACTS[curAct()];if(!L)return;autoWait=false;if(lineIdx<L.length-1){playLine(lineIdx+1,{onend:autoOn?()=>{if(autoOn)nextLine()}:null})}else{autoOn=false;}}
function autoPlay(){autoOn=true;lineIdx=-1;nextLineAuto();}
function nextLineAuto(){const L=ACTS[curAct()];if(!autoOn)return;if(lineIdx>=L.length-1){autoOn=false;return}
  playLine(lineIdx+1,{onend:()=>{if(autoOn&&!autoWait)nextLineAuto()}});
  if(myRole&&L[lineIdx+1]&&L[lineIdx+1].w===myRole){}}
function continueAfterMine(){if(autoWait){autoWait=false;if(autoOn)nextLineAuto();else nextLine();}else nextLine();}

 {sc:'a2',act:'a2',tag:'第二幕',no:'誰最強？',roles:['鼠爸','鼠媽','太陽','烏雲','大風','牆壁','鼠郎']},
 {sc:'a3',act:'a3',tag:'第三幕',no:'鼠妞出嫁',roles:['鼠爸','鼠媽','鼠妞','鼠郎','旁白']},
 {sc:'chain',tag:'誰最強？',no:'統整一',guide:['鼠爸鼠媽到處問：','誰是世上最強的？','太陽怕烏雲，烏雲怕風，','風怕牆，牆怕老鼠咬。','最後才發現，','我們老鼠本事也不差！'],
  enter(){chainReset()},acts:[['▶ 下一個',chainNext,1],['🔁 重來',chainReset]]},
 {sc:'parts',tag:'劇本小百科',no:'統整二',guide:['這一課是「劇本」，','和一般的文章不一樣。','劇本有幕、時間、地點、','角色、旁白、臺詞，','還有舞臺指示和括號。','點一點，認識它們！'],acts:[]}
];


/* ===== 修辭 ===== */
function rhStrip(t){return String(t).replace(/\(@[^|@]+\|[^|@]+\|/g,'').replace(/@\)/g,'')}
const RH={'擬人':['p','把不是人的東西，寫得像人一樣：會說話、會感覺、會做事。'],'譬喻':['m','用另一樣相像的東西來比方，常用「像、好像、有如、就像、是」。'],'感嘆':['e','用「！」或「啊、呀、唉、哇……」，表達強烈的感情，像高興、驚訝、難過。'],'設問':['q','用問句引起注意，或說出心裡的疑問；有時自己問、自己答，有時問了不回答。']};
const RHWHY={"c1": "用了好幾個「！」，表現黑貓得意又兇狠的樣子。", "c2": "「唉！」表達鼠爸擔心、害怕的心情。", "c3": "太陽本來不會說話，在劇本裡卻像人一樣說話，還會「躲起來」。整個劇本裡，太陽、烏雲、大風、牆壁都會說話，都是擬人。", "c4": "草木像人一樣會「彎腰」。", "c5": "牆壁用問句反問「我最強？誰說的？」，意思其實是「我不是最強的」。牆壁會說話、會睜大眼，也是擬人。", "c6": "「唉呀！」表達鼠爸恍然大悟、有點後悔的心情。", "c7": "「啦！」表達鼠爸放心又快樂的心情。"};
const RQ=[["「哈哈！吃大餐時間到！喵！」", "感嘆", 1], ["「我雖然能給大地帶來溫暖，但是烏雲一來，我就只能躲起來。」（太陽說）", "擬人", 1], ["「我最強？誰說的？」（牆壁說）", "設問", 1], ["「唉呀！我真是捨近求遠！」", "感嘆", 1], ["「只要我一吹氣，煙消雲散，草木彎腰。」", "擬人", 1]].concat([['「天上的白雲，像一團團棉花糖。」','譬喻',0],['「太陽公公笑咪咪的看著大家。」','擬人',0],['「哇！雪花好美啊！」','感嘆',0],['「冬天為什麼要多穿衣服？因為天氣冷，容易著涼。」','設問',0],['「小雨點在窗戶上跳舞。」','擬人',0],['「雪地白得像鋪了一層糖粉。」','譬喻',0]]);
let rhOn=false,rqList=[],rqi=0;
function rhWrap(t){return String(t).replace(/\(@([^|@]+)\|([^|@]+)\|(.+?)@\)/g,(m,types,key,inner)=>{const ts=types.split(',');return `<span class="rh" role="button" tabindex="0" data-t="${types}" data-k="${key}" data-l="${ts.join('＋')}" style="--rc:var(--c-${RH[ts[0]][0]})">${inner}</span>`})}
function showRh(types,key,text){const p=$('#pop');p.innerHTML=`<h3>修辭：${types.join('＋')}</h3>${types.map(t=>`<div><b style="color:var(--c-${RH[t][0]})">${t}</b>：${RH[t][1]}</div>`).join('')}<div class="why">${RHWHY[key]||''}</div><div class="row"><button id="pSay">🔊 念這句</button><button id="pClose">關閉</button></div>`;p.classList.add('on');$('#pSay').onclick=()=>speak(text);$('#pClose').onclick=()=>p.classList.remove('on');}
function bindRh(c){c.querySelectorAll('.rh').forEach(r=>{const f=e=>{if(!rhOn)return;e.stopPropagation();showRh(r.dataset.t.split(','),r.dataset.k,r.textContent)};r.addEventListener('click',f);r.addEventListener('keydown',e=>{if(e.key==='Enter')f(e)})});}
function rhToggle(){rhOn=!rhOn;$('#txt').classList.toggle('rhon',rhOn);$('#rhleg').classList.toggle('legon',rhOn);$('#rhBtn').classList.toggle('on',rhOn);$('#rhBtn').setAttribute('aria-pressed',rhOn);if(rhOn&&!$('#txt .rh')){const d=document.createElement('div');d.className='badge';d.textContent='這一頁沒有標示修辭，換一段看看！';Object.assign(d.style,{left:'50%',top:'45%',transform:'translateX(-50%)'});$('#ov').appendChild(d);setTimeout(()=>d.remove(),2000)}}
function buildRh(){const c=$('#rcards');c.innerHTML='';Object.entries(RH).forEach(([n,[k,d]])=>{const b=document.createElement('button');b.className='rcard';b.style.setProperty('--rc',`var(--c-${k})`);b.innerHTML=`<h4>${n}</h4><p>${d}</p>`;b.onclick=()=>{$$('.rcard').forEach(x=>x.classList.toggle('on',x===b));const ex=RQ.filter(r=>r[1]===n&&r[2]);const pr=RQ.find(r=>r[1]===n&&!r[2]);$('#rex').innerHTML=ex.length?`<b style="color:var(--c-${k})">課文裡的${n}：</b>${ex.map(e=>`<div class="q">${e[0]}</div>`).join('')}`:`<b style="color:var(--c-${k})">這一課沒有用到「${n}」，看看這個例子：</b><div class="q">${pr[0]}</div>`;speak(n+'。'+d)};c.appendChild(b)});$('#rex').innerHTML='<div style="font-size:3vh;color:#55636A">點上面的卡片，認識四種修辭；或按下方「考考你」來練習。</div>';}
function rhQuiz(){rqList=[...RQ].sort(()=>Math.random()-.5);rqi=0;rhAsk();}
function rhAsk(){const ex=$('#rex');if(rqi>=rqList.length){ex.innerHTML='<div class="q">全部完成！🎉</div>';speak('全部完成，你好棒');return}
  const [s,a,fromText]=rqList[rqi];ex.innerHTML=`<div><span class="tagq" style="background:${fromText?'#2F6F78':'#9AA6B5'}">${fromText?'課文':'練習題'}</span>第 ${rqi+1}／${rqList.length} 題：這句用了什麼修辭？</div><div class="q">${s}</div><div class="opts"></div><div class="fb"></div>`;speak(s);
  Object.entries(RH).forEach(([n,[k]])=>{const b=document.createElement('button');b.textContent=n;b.style.setProperty('--rc',`var(--c-${k})`);b.onclick=()=>{const fb=ex.querySelector('.fb');if(n===a){fb.textContent='答對了！這是「'+a+'」⭐';fb.style.color='#2E8B57';speak('答對了');rqi++;setTimeout(rhAsk,1500)}else{fb.textContent='再想想看：句子裡有沒有「像」「！」「？」，或是把東西寫成人？';fb.style.color='#C8362B'}};ex.querySelector('.opts').appendChild(b)});}
$('#rhBtn').onclick=rhToggle;
S.push({sc:'rh',tag:'修辭小教室',no:'統整三',guide:['認識四種修辭：','擬人、譬喻、感嘆、設問。','點上面的卡片看說明，','再按「考考你」練習。','回到課文打開「🔍 修辭」，','找找句子藏在哪裡！'],enter(){buildRh()},acts:[['🎯 考考你',rhQuiz],['📖 看說明',buildRh]]});

/* ---------- navigation ---------- */
const TABS=[['第一幕',0],['第二幕',1],['第三幕',2],['誰最強？',3],['劇本小百科',4]];
TABS.push(['修辭小教室',S.length-1]);TABS.forEach(([n,i],k)=>{if(k===3)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">｜</span>');const b=document.createElement('button');b.textContent=n;b.onclick=()=>go(i);b.dataset.i=i;$('#tabs').appendChild(b)});
let cur=0;
function lineHTML(l,k){let t=rhWrap(l.t).replace(/\[\[(.+?)\]\]/g,(m,w)=>`<span class="v" role="button" tabindex="0" data-w="${w}">${w}</span>`).replace(/\{\{(.+?)\}\}/g,(m,w)=>`<span class="v x" role="button" tabindex="0" data-w="${w}">${w}</span>`).replace(/（([^）]*)）/g,'<span class="dir">（$1）</span>');
  let cls='ln',who='';if(l.w==='act')cls+=' act';else if(l.w==='info')cls+=' info';else if(l.w==='△')cls+=' stage';else who=`<span class="who" style="color:${COLORS[l.w]}">${l.w}：</span>`;
  return `<span class="${cls}" data-k="${k}" tabindex="0">${who}${t}</span>`;}
function go(i){
  stopAll();cur=Math.max(0,Math.min(S.length-1,i));const st=S[cur];
  $$('.scene').forEach(s=>s.classList.toggle('on',s.id==='sc-'+st.sc));
  const isAct=!!st.act;
  $$('#curL,#curR,#valance').forEach(e=>e.style.display=isAct?'':'none');
  $('#ptag').textContent=st.tag;$('#pno').textContent=st.no;
  const t=$('#txt');t.classList.toggle('guide',!isAct);
  if(isAct){myRole='';lineIdx=-1;setupAct(st.act);t.innerHTML=ACTS[st.act].map(lineHTML).join('');
    t.querySelectorAll('.ln').forEach(l=>{l.onclick=()=>{autoOn=false;autoWait=false;playLine(+l.dataset.k)};l.onkeydown=e=>{if(e.key==='Enter')l.onclick()}});}
  else t.innerHTML=st.guide.map((g,k)=>`<span class="ln" data-k="${k}">${g}</span>`).join('');
  t.querySelectorAll('.v').forEach(v=>{v.onclick=e=>{e.stopPropagation();showVocab(v.dataset.w)};v.onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();showVocab(v.dataset.w)}}});
  bindRh(t);t.scrollTop=0;t.scrollLeft=0;
  const A=$('#acts');A.innerHTML='';
  if(isAct){
    [['▶ 下一句',()=>{ac();continueAfterMine()},1],['🎬 自動演出',()=>{ac();stopAll();autoWait=false;autoPlay()}],['🔁 從頭來',()=>{stopAll();lineIdx=-1;setupAct(st.act);$$('#txt .ln').forEach(l=>l.classList.remove('on'))}]].forEach(([l,f,m])=>{const b=document.createElement('button');b.textContent=l;if(m)b.className='main';b.onclick=f;A.appendChild(b)});
    A.insertAdjacentHTML('beforeend',`<label for="role">我來演：</label><select id="role"><option value="">不演，看就好</option>${st.roles.map(r=>`<option>${r}</option>`).join('')}</select>`);
    $('#role').onchange=e=>{myRole=e.target.value;$$('#txt .ln').forEach((l,k)=>l.classList.toggle('mine',!!myRole&&ACTS[st.act][k].w===myRole));};
  }else (st.acts||[]).forEach(([l,f,m])=>{const b=document.createElement('button');b.textContent=l;if(m)b.className='main';b.onclick=f;A.appendChild(b)});
  $$('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===cur));
  $('#prev').disabled=cur===0;$('#next').disabled=cur===S.length-1;
  $('#say').textContent=isAct?'🔊 念這一句':'🔊 念給我聽';
  st.enter&&st.enter();
}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#say').onclick=()=>{const st=S[cur];if(st.act){const l=ACTS[st.act][Math.max(0,lineIdx)];speak(noDir(l.t),l.w==='△'?'旁白':l.w)}else speak(st.guide.join(''))};
document.addEventListener('keydown',e=>{if(e.target.closest('select,.v,.ln'))return;if(e.key===' '&&S[cur].act){e.preventDefault();ac();continueAfterMine()}if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
go(0);
</script>
