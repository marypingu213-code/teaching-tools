<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二上第十課 去農場玩｜課文動起來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --bg:#E6F0E4; --panel:#FFFFFF; --ink:#22301F; --soft:#5F6E5A;
  --grass:#6BB04A; --sky:#9FD3EE; --orange:#E8762A; --gold:#E8A33A; --pink:#E86A8A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#162016; --panel:#212D20; --ink:#EEF5EC; --soft:#AFC2AA; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--kai);background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:1.2vw;padding:1vh 1.6vw .8vh;flex-wrap:wrap}
h1{margin:0;font-size:4.4vh;color:var(--orange);letter-spacing:.12em;white-space:nowrap}
h1 small{font-size:.5em;color:var(--soft);letter-spacing:.05em;margin-right:.4em}
h1 em{font-style:normal;font-size:.45em;color:var(--soft);margin-left:.5em;letter-spacing:0}
nav{display:flex;gap:.25vw;flex-wrap:wrap;align-items:center}
nav button{font:inherit;font-size:2.4vh;padding:.5vh .7vw;border-radius:10px;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:.3em}
nav button i{font-style:normal;display:inline-grid;place-items:center;width:2.7vh;height:2.7vh;border-radius:50%;background:var(--orange);color:#fff;font-size:1.7vh}
nav button.on{background:var(--panel);border-color:var(--orange);color:var(--orange);font-weight:700}
nav .sep{color:var(--soft)}
main{display:grid;grid-template-columns:1fr 46vh;gap:1.2vw;padding:0 1.6vw 1.4vh;min-height:0}
.stagewrap{display:grid;grid-template-rows:1fr auto;gap:1vh;min-height:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#D3E8D0;min-height:0}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene>svg{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none;z-index:7}
.acts{display:flex;flex-wrap:wrap;gap:.7vw;min-height:6vh;align-items:center}
.acts button{font:inherit;font-size:2.7vh;padding:.9vh 1.4vw;border-radius:999px;border:3px solid var(--orange);background:var(--panel);color:var(--ink);cursor:pointer}
.acts button:hover{background:var(--orange);color:#fff}
.acts button.main{background:var(--orange);color:#fff;font-weight:700}
.acts .hint{font-size:2.3vh;color:var(--soft)}
button:focus-visible,.v:focus-visible,.ln:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
aside{background:var(--panel);border-radius:20px;padding:1.6vh 1.4vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:1vh;min-height:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh;color:var(--soft)}
.ptitle b{color:var(--orange);font-size:1.15em}
.txt{writing-mode:vertical-rl;font-size:4.4vh;line-height:1.7;letter-spacing:.08em;width:100%;height:100%;min-height:0;overflow:auto;display:block}
.txt.long{font-size:3.6vh}
.ln{cursor:pointer;border-radius:8px;transition:background .3s;padding:.1em 0}
.ln:hover{background:rgba(0,0,0,.05)}
.ln.on{background:#FFE7A8;color:#22301F}
.ln.done{color:var(--soft)}
.guide .ln{cursor:default;display:block;font-size:.85em}
.v{border:2px solid var(--gold);border-radius:6px;cursor:pointer;color:#1F6FA0;padding:.1em 0}
@media (prefers-color-scheme: dark){ .v{color:#86C9F0} .ln.on .v{color:#1F6FA0} }
.pnav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.8vh}
.pnav button{font:inherit;font-size:2.6vh;padding:1vh 0;border-radius:12px;border:2px solid var(--soft);background:transparent;color:var(--ink);cursor:pointer}
.pnav .say{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.pnav button:disabled{opacity:.35}
#pop{position:fixed;left:3vw;bottom:13vh;max-width:48vw;background:#fff;color:#22301F;border:4px solid var(--gold);border-radius:16px;padding:1.4vh 1.6vw;font-size:3.2vh;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:20}
#pop.on{display:block;animation:pop .3s}
#pop h3{margin:0 0 .4vh;color:#C8622A;font-size:1.3em}
#pop .row{display:flex;gap:1vw;margin-top:.8vh}
#pop button{font:inherit;font-size:.85em;border-radius:10px;border:2px solid #C8622A;background:#fff;color:#C8622A;padding:.3vh 1vw;cursor:pointer}

.badge{position:absolute;background:#fff;color:#22301F;border:4px solid var(--orange);border-radius:14px;padding:.6vh 1.2vw;font-size:3.2vh;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.6,1);white-space:nowrap;z-index:8}
.badge.gold{border-color:var(--gold)}.badge.green{border-color:#2E8B57}.badge.blue{border-color:#2E6FB3}
.bubble{position:absolute;background:#fff;color:#22301F;border:4px solid #22301F;border-radius:18px;padding:.8vh 1.2vw;font-size:3vh;line-height:1.5;max-width:46%;animation:pop .3s cubic-bezier(.3,1.6,.6,1);z-index:8}
.bubble b{display:block;font-size:.8em;color:#C8622A}
.bub{position:absolute;font-size:5.2vh;font-weight:700;color:#fff;-webkit-text-stroke:2px #C8622A;paint-order:stroke fill;animation:floatup 1.9s ease-out forwards;z-index:8}
@keyframes floatup{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1)}to{transform:translateY(-90px);opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.lbl{font-family:var(--kai);font-weight:700}

/* scene */
#sky{fill:#9FD3EE;transition:fill 2s}
#W.s4.a2 #sky{fill:#E9A27A}#W.s4.a3 #sky{fill:#7A6A9A}
#sunG{transition:transform 2s,opacity 2s}
#W.s4.a2 #sunG{transform:translateY(260px);opacity:.6}
#sunRays{transform-box:fill-box;transform-origin:center;animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#W.s1.a0 .flw{animation:sway 1.2s ease-in-out infinite alternate}
.flw{transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
#breeze{display:none}#W.s1 #breeze{display:inline}
.bz{animation:breeze 2.4s linear infinite}
@keyframes breeze{from{transform:translateX(-100px);opacity:0}30%{opacity:.9}to{transform:translateX(700px);opacity:0}}
#world{transform-box:view-box;transform-origin:330px 430px;transition:transform 1.6s ease-in-out}
#W.s2.a3:not(.a4) #world{transform:scale(1.9)}
#flock{opacity:0;transition:opacity 1s}#W.s2 #flock,#W.s3 #flock,#W.s4 #flock{opacity:1}
.head{transform-box:fill-box;transform-origin:100% 50%}
#W.s2.a1 .eat .head{animation:nod .6s ease-in-out infinite alternate}
@keyframes nod{from{transform:rotate(0)}to{transform:rotate(-14deg)}}
#W.s2.a2 .look .head{animation:tilt .8s ease-in-out infinite alternate}
@keyframes tilt{from{transform:rotate(8deg)}to{transform:rotate(-10deg)}}
#cotton{opacity:0;transition:opacity .8s .8s}#W.s2.a3:not(.a4) #cotton{opacity:1}
#frame{opacity:0;transition:opacity 1s .4s}#W.s2.a4 #frame{opacity:1}
#walkers{transform:translateX(320px);transition:transform 2.4s ease-out}
#W:not(.s1) #walkers,#W.s1.a1 #walkers{transform:translateX(0)}
#W.s1.a1 #walkers .bd{animation:bob .3s ease-in-out 8 alternate}
.bd{transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{to{transform:translateY(-6px)}}
#lamb{display:none}#W.s3 #lamb{display:inline}
#lambMv{transition:transform 1.6s ease-in}
#W.s3.a2 #lambMv{transform:translateX(-760px)}
#W.s3.a2 #lamb .leg{animation:legs .14s linear infinite alternate}
.leg{transform-box:fill-box;transform-origin:50% 0}
@keyframes legs{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}
#W.s3.a0:not(.a2) #lamb .head{animation:tilt .3s ease-in-out infinite alternate}
.arm{transform-box:fill-box;transform-origin:50% 100%}
#W.s3.a1 #girl .arm,#W.s4.a3 #girl .arm{animation:wave .35s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-20deg)}to{transform:rotate(25deg)}}
#think4{opacity:0;transition:opacity .6s}#W.s4.a0 #think4{opacity:1}#W.s4.a2 #think4{opacity:0}
#spark4{display:none}#W.s4.a1:not(.a2) #spark4{display:inline}
.spk{animation:twk 1.2s ease-in-out infinite}
@keyframes twk{50%{opacity:.1}}
.tear{display:none}#W.s4.a3 .tear{display:inline}
.tr{animation:tear 1s ease-in infinite}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(24px);opacity:0}}
#home{display:none}#W.s5 #home{display:inline}
#think5{opacity:0;transition:opacity .6s}#W.s5.a1 #think5{opacity:1}
#circle5{stroke-dasharray:260;stroke-dashoffset:260;transition:stroke-dashoffset 1.2s .4s}#W.s5.a1 #circle5{stroke-dashoffset:0}
#W.s5.a0 #home .bd{animation:bob .4s ease-in-out infinite alternate}

/* html pages */
.html{background:linear-gradient(#EEF6EC,#FAFDF9)}
.wx{position:absolute;inset:3%;display:grid;grid-template-columns:1.3fr 1fr;gap:1.4vw}
.wxs{background:#fff;border-radius:18px;overflow:hidden;position:relative}
.wxs svg{width:100%;height:100%;display:block}
.wxr{display:flex;flex-direction:column;gap:1vh}
.wcards{display:grid;grid-template-columns:1fr 1fr;gap:1vh}
.wcard{font:inherit;font-size:3.6vh;font-weight:700;padding:1.4vh 0;border-radius:16px;border:4px solid var(--c);background:#fff;color:var(--c);cursor:pointer}
.wcard.on{background:var(--c);color:#fff}
.wdet{background:#fff;border-radius:16px;padding:1.4vh 1.2vw;font-size:3vh;line-height:1.6;color:#22301F;flex:1;overflow:auto}
.wdet h3{margin:0 0 .4vh;font-size:4.2vh}
.wdet .ex{background:#FFF2D6;border-radius:12px;padding:.6vh .8vw;margin-top:.8vh}
.wdet .fb{min-height:4vh;margin-top:.6vh}
#wsvg .layer{display:none}
.w-sun #L-sun,.w-cloud #L-cloud,.w-storm #L-storm,.w-cold #L-cold{display:inline}
.rain{animation:rainf .5s linear infinite}
@keyframes rainf{from{transform:translateY(-40px)}to{transform:translateY(60px)}}
.bolt{animation:bolt 1.6s infinite}
@keyframes bolt{0%,40%,100%{opacity:0}45%,55%{opacity:1}}
.dcl{animation:drift 4s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(40px)}}
.sn{animation:snow 4s linear infinite}
@keyframes snow{from{transform:translate(0,-60px)}to{transform:translate(20px,420px)}}
.sp{position:absolute;inset:3%;display:grid;grid-template-columns:1fr 1.15fr;gap:1.4vw;color:#22301F}
.spl,.spr{background:#fff;border-radius:18px;padding:1.4vh 1.2vw;display:flex;flex-direction:column;gap:.8vh;overflow:auto}
.spl h4,.spr h4{margin:0;font-size:3.2vh;color:#C8622A}
.note{font-size:2.6vh;background:#FFF2D6;border-radius:12px;padding:.8vh .8vw;line-height:1.5}
.blocks{display:flex;flex-wrap:wrap;gap:.5vw;align-items:flex-end;font-size:3.4vh;font-weight:700}
.blk{display:flex;flex-direction:column;align-items:center;gap:.3vh}
.blk small{font-size:1.9vh;color:#fff;border-radius:6px;padding:.1vh .4vw;background:var(--c)}
.blk span{border:3px solid var(--c);border-radius:10px;padding:.2vh .6vw;background:#fff;min-width:2.4em;text-align:center}
.blk.plain span{border-color:transparent}
.slot h5{margin:.3vh 0;font-size:2.4vh;color:#5F6E5A}
.chips{display:flex;flex-wrap:wrap;gap:.5vh}
.chips button{font:inherit;font-size:2.5vh;padding:.3vh .9vw;border-radius:999px;border:3px solid var(--c);background:#fff;color:#22301F;cursor:pointer}
.chips button.on{background:var(--c);color:#fff}
.spr input{font:inherit;font-size:2.4vh;padding:.4vh .7vw;border-radius:10px;border:3px solid #C9C2B0;width:100%}
.idi{position:absolute;inset:3%;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:auto 1fr;gap:1.2vh 1vw}
.icard{font:inherit;background:#fff;border:4px solid var(--c);border-radius:18px;padding:1vh .6vw;cursor:pointer;color:#22301F;display:flex;flex-direction:column;align-items:center;gap:.4vh}
.icard .em{font-size:5.6vh;line-height:1}
.icard b{font-size:3.8vh;color:var(--c)}
.icard small{font-size:2.2vh;color:#5F6E5A}
.icard.on{background:color-mix(in srgb,var(--c) 14%,#fff)}
.idet{grid-column:1/-1;background:#fff;border-radius:18px;padding:2vh 2vw;color:#22301F;font-size:3.1vh;line-height:1.7;overflow:auto}
.idet h3{margin:0 0 .6vh;font-size:4.4vh}
.idet .mean{background:#EEF6E8;border-radius:12px;padding:.8vh 1vw}
.idet .ex{background:#FFF2D6;border-radius:12px;padding:.8vh 1vw;margin-top:1vh}
.idet .lk{background:#FDE7DA;border-radius:12px;padding:.8vh 1vw;margin-top:1vh;font-weight:700;color:#B5481F}
.idet .opts{display:flex;gap:1vw;flex-wrap:wrap;margin-top:1.4vh}
.idet .opts button{font:inherit;font-size:3.2vh;padding:1vh 1.6vw;border-radius:14px;border:3px solid #C8622A;background:#fff;color:#22301F;cursor:pointer;font-weight:700}
.idet .fb{min-height:4.5vh;margin-top:1.2vh}
.idet .tg{font-size:2.1vh;color:#fff;border-radius:6px;padding:.1vh .6vw;margin-right:.6vw}
.blank{display:inline-block;min-width:6em;border-bottom:4px solid #E8762A;text-align:center;color:#E8762A}
.hz{color:#C8362B;font-size:1.15em}

@media (max-width:820px), (max-aspect-ratio:1/1){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  .stage{height:60vh}
  .txt,.txt.long{writing-mode:horizontal-tb;height:auto;font-size:22px}
  .acts button,.pnav button,nav button{font-size:16px}
  h1{font-size:26px}
  .wx,.sp{grid-template-columns:1fr;overflow:auto}
}
@media (prefers-reduced-motion: reduce){ .bz,#sunRays,.rain,.sn,.dcl{animation:none} }
a.hall-back{position:fixed;z-index:40;top:0;right:0;font-family:var(--kai);font-size:1.7vh;line-height:1.2;padding:.45vh .8vw;white-space:nowrap;background:var(--panel);color:var(--soft);text-decoration:none;border:1px solid var(--soft);border-top:0;border-right:0;border-bottom-left-radius:12px}a.hall-back:hover,a.hall-back:focus-visible{color:var(--ink)}
</style>
</head>
<body>
<a class="hall-back" href="../">← 回課文大廳</a>
<header>
  <h1><small>二上第十課</small>去農場玩<em>林榮勤</em></h1>
  <nav id="tabs"></nav>
</header>

<main>
  <div class="stagewrap">
    <div class="stage" id="stage">
      <div class="scene" id="sc-farm"><svg id="W" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="scene html" id="sc-wx">
        <div class="wx">
          <div class="wxs"><svg id="wsvg" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid slice"></svg></div>
          <div class="wxr"><div class="wcards" id="wcards"></div><div class="wdet" id="wdet"></div></div>
        </div>
      </div>
      <div class="scene html" id="sc-like"><div class="sp"><div class="spl" id="lkl"></div><div class="spr" id="lkr"></div></div></div>
      <div class="scene html" id="sc-idiom"><div class="idi" id="idi"></div></div>
      <div id="ov"></div>
    </div>
    <div class="acts" id="acts"></div>
  </div>

  <aside>
    <div class="ptitle"><span id="ptag"></span><b id="pno"></b></div>
    <div class="txt" id="txt"></div>
    <div class="pnav">
      <button id="prev">◀ 上一頁</button>
      <button id="say" class="say">🔊 念給我聽</button>
      <button id="next">下一頁 ▶</button>
    </div>
  </aside>
</main>

<div id="pop"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
let timers=[];let autoOn=false;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;}
function stopAll(){timers.forEach(clearTimeout);timers=[];autoOn=false;try{speechSynthesis.cancel()}catch(e){};$('#ov').innerHTML='';$('#pop').classList.remove('on');}
function ov(html,style,cls='badge'){const d=document.createElement('div');d.className=cls;d.innerHTML=html;Object.assign(d.style,style||{});$('#ov').appendChild(d);return d;}
function temp(html,style,cls,ms=2000){const d=ov(html,style,cls);setTimeout(()=>d.remove(),ms);return d;}
function say1(html,cls=''){$('#ov').querySelectorAll('.badge').forEach(b=>b.remove());return ov(html,{left:'3%',top:'4%'},'badge '+cls)}
function bubbles(words,area){words.forEach((w,i)=>later(()=>temp(w,{left:(area.x+Math.random()*area.w)+'%',top:(area.y+Math.random()*area.h)+'%'},'bub',1950),i*(area.gap||300)))}
const clean=t=>t.replace(/\[\[|\]\]|\{\{|\}\}/g,'');
function speak(text,onend){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(text).replace(/ㄇㄝ/g,'咩'));u.lang='zh-TW';u.rate=.72;const v=speechSynthesis.getVoices().find(v=>/zh[-_]TW/i.test(v.lang));if(v)u.voice=v;if(onend)u.onend=onend;speechSynthesis.speak(u);}catch(e){onend&&setTimeout(onend,1500)}}
function bubbleNear(id,who,text,ms=4000){later(()=>{const n=$('#'+id);if(!n)return;const b=n.getBoundingClientRect(),s=$('#stage').getBoundingClientRect();const d=ov(`<b>${who}</b>${text}`,{},'bubble');const W=d.offsetWidth,H=d.offsetHeight;let x=b.left-s.left+b.width/2-W/2,y=b.top-s.top-H-10;x=Math.max(8,Math.min(s.width-W-8,x));if(y<8)y=8;d.style.left=x+'px';d.style.top=y+'px';later(()=>d.remove(),ms)},60)}

/* ---------- figures ---------- */
function sheep(parent,x,y,s,cls='',id=''){const g=el('g',{transform:`translate(${x},${y}) scale(${s})`,class:cls},parent);if(id)g.id=id;
  g.innerHTML=`<g class="leg"><rect x="-26" y="-14" width="7" height="16" fill="#6A5A50"/></g><g class="leg"><rect x="18" y="-14" width="7" height="16" fill="#6A5A50"/></g>
  <g fill="#FFFFFF" stroke="#E3DED4" stroke-width="2">${[[-24,-30,16],[-6,-38,18],[14,-36,17],[28,-26,13],[-16,-18,14],[6,-18,15],[22,-16,12]].map(([cx,cy,r])=>`<circle cx="${cx}" cy="${cy}" r="${r}"/>`).join('')}</g>
  <g class="head"><ellipse cx="-44" cy="-28" rx="14" ry="11" fill="#F6CDBE"/><ellipse cx="-38" cy="-38" rx="8" ry="4" fill="#F6CDBE" transform="rotate(-30 -38 -38)"/><circle cx="-48" cy="-30" r="2.2" fill="#333"/><circle cx="-56" cy="-24" r="2" fill="#E08A8A"/></g>`;return g;}
function human(parent,x,y,s,{dress='#E85D4A',hair='#7A4A2A',kid=false,id='',pig=false,man=false}={}){const g=el('g',{transform:`translate(${x},${y}) scale(${s})`},parent);if(id)g.id=id;const bd=el('g',{class:'bd'},g);
  const h=kid?-92:-130;
  bd.innerHTML=`<rect x="-12" y="-36" width="9" height="34" fill="${man?'#3A5A8A':'#F2C9A0'}"/><rect x="3" y="-36" width="9" height="34" fill="${man?'#3A5A8A':'#F2C9A0'}"/>
   <ellipse cx="-8" cy="-2" rx="9" ry="4" fill="#E8762A"/><ellipse cx="8" cy="-2" rx="9" ry="4" fill="#E8762A"/>
   <path d="M-24,-34 L-18,${h+26} L18,${h+26} L24,-34Z" fill="${dress}"/>${dress==='#E85D4A'&&kid?`<g fill="#fff" opacity=".7"><circle cx="-8" cy="-50" r="3"/><circle cx="8" cy="-62" r="3"/><circle cx="-2" cy="-40" r="3"/></g>`:''}
   <g class="arm"><line x1="16" y1="${h+34}" x2="34" y2="${h+4}" stroke="${dress}" stroke-width="8" stroke-linecap="round"/><circle cx="35" cy="${h+1}" r="5" fill="#F2C9A0"/></g>
   <line x1="-16" y1="${h+34}" x2="-26" y2="${h+62}" stroke="${dress}" stroke-width="8" stroke-linecap="round"/>

/* ---------- idioms ---------- */
const ID=[
 {n:'平心靜氣',e:'😌',c:'#2E8B57',z:'靜',w:'靜靜的吃草',m:'形容心情平和，態度冷靜。',x:'當衝突發生時，應該平心靜氣的應對。'},
 {n:'平易近人',e:'🤗',c:'#E8762A',z:'近',w:'近看',m:'形容態度和藹親切，容易接近。也用來形容詩文淺白易懂。',x:'老師十分平易近人，有問題可以直接向他反應。'}];
const IQ=[['當衝突發生時，應該＿＿的應對。','平心靜氣',1],['老師十分＿＿，有問題可以直接向他反應。','平易近人',1],['姐姐和我吵架後，我們坐下來＿＿的好好談一談。','平心靜氣',0],['新來的校長常常笑咪咪的，很＿＿。','平易近人',0]];
let iq=[],iqi=0;
function hl(n,z){return n.replace(z,`<span class="hz">${z}</span>`)}
function buildIdiom(sel){const box=$('#idi');box.innerHTML='';ID.forEach((d,i)=>{const b=document.createElement('button');b.className='icard'+(i===sel?' on':'');b.style.setProperty('--c',d.c);b.innerHTML=`<span class="em">${d.e}</span><b>${d.n}</b><small>生字：「${d.z}」</small>`;b.onclick=()=>buildIdiom(i);box.appendChild(b)});
  const det=document.createElement('div');det.className='idet';det.id='idet';box.appendChild(det);
  if(sel===undefined){det.innerHTML='<div style="color:#5F6E5A">點上面的成語卡，看看意思和例句；或按下方「考考你」練習。</div>';return}
  const d=ID[sel];det.innerHTML=`<h3 style="color:${d.c}">${d.e} ${hl(d.n,d.z)}</h3><div class="mean"><b>意思：</b>${d.m}</div><div class="ex"><b>例句：</b>${d.x}</div><div class="lk">課文裡的生字「${d.z}」：${hl(d.w,d.z)}</div>`;speak(d.n+'。'+d.m+'。例句：'+d.x);}
function idiomQuiz(){iq=[...IQ].sort(()=>Math.random()-.5);iqi=0;buildIdiom();askIdiom();}
function askIdiom(){const det=$('#idet');if(iqi>=iq.length){det.innerHTML='<h3>全部完成！🎉</h3>';speak('全部完成，你好棒');return}
  const [s,a,b]=iq[iqi];det.innerHTML=`<div><span class="tg" style="background:${b?'#C8622A':'#9AA6B5'}">${b?'課本例句':'練習題'}</span>第 ${iqi+1}／${iq.length} 題：空格要填哪個成語？</div><div style="font-size:3.8vh;font-weight:700;margin-top:1vh">${s.replace('＿＿','<span class="blank">？</span>')}</div><div class="opts"></div><div class="fb"></div>`;speak(s.replace('＿＿','什麼'));
  ID.forEach(d=>{const x=document.createElement('button');x.textContent=d.n;x.onclick=()=>{const fb=det.querySelector('.fb');if(d.n===a){det.querySelector('.blank').textContent=a;fb.textContent='答對了！⭐';fb.style.color='#2E8B57';speak('答對了，'+s.replace('＿＿',a));iqi++;later(askIdiom,2600)}else{fb.textContent='再想想看：「'+d.n+'」的意思是'+d.m;fb.style.color='#C8362B'}};det.querySelector('.opts').appendChild(x)});}

/* ---------- steps ---------- */
const S=[
 {st:0,sc:'farm',tag:'第一段',no:'去農場'},
 {st:1,sc:'farm',tag:'第二段',no:'成群的羊'},
 {st:2,sc:'farm',tag:'第三段',no:'小羊跑開了'},
 {st:3,sc:'farm',tag:'第四段',no:'說再見'},
 {st:4,sc:'farm',tag:'第五段',no:'美好的一天'},
 {sc:'wx',tag:'天氣詞語',no:'四字詞語',guide:['風和日麗的天氣，','媽媽帶我去農場玩。','認識四個','有關天氣的四字詞語！'],enter(){buildWX(0)},acts:[['🎯 考考你',wxQuiz],['📖 看說明',()=>buildWX(0)]]},
 {sc:'like',tag:'句子練習',no:'……像……',guide:['大大小小的羊，','像一堆堆棉花。','想一想：','兩樣東西','哪裡很像？'],enter(){buildLK()},acts:[['🔊 念我的句子',sayLK],['🧹 清空重寫',()=>{pk={look:'',a:'窗戶',q:'',b:''};renderLK()}]]},
 {sc:'idiom',tag:'成語',no:'從生字學成語',guide:['從課文的生字，','認識成語：','「靜」和「近」，','藏在哪個成語裡？'],enter(){buildIdiom(0)},acts:[['🎯 考考你',idiomQuiz],['📖 看成語卡',()=>buildIdiom(0)]]}
];

/* ---------- navigation ---------- */
const TABS=[['去農場',0,1],['成群的羊',1,2],['小羊跑開',2,3],['說再見',3,4],['美好的一天',4,5],['天氣詞語',5],['……像……',6],['成語',7]];
TABS.forEach(([n,i,num],k)=>{if(k===5)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">｜</span>');else if(k>0&&k<5)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">›</span>');
  const b=document.createElement('button');b.innerHTML=(num?`<i>${num}</i>`:'')+n;b.onclick=()=>go(i);b.dataset.i=i;$('#tabs').appendChild(b)});
let cur=0;
function lineHTML(t){return t.replace(/\[\[(.+?)\]\]/g,(m,w)=>`<span class="v" role="button" tabindex="0" data-w="${w}">${w}</span>`)}
function go(i){
  stopAll();cur=Math.max(0,Math.min(S.length-1,i));const st=S[cur];
  $$('.scene').forEach(s=>s.classList.toggle('on',s.id==='sc-'+st.sc));
  $('#ptag').textContent=st.tag;$('#pno').textContent=st.no;
  const isT=st.st!==undefined;const lines=isT?ST[st.st].lines:st.guide;
  const t=$('#txt');t.classList.toggle('guide',!isT);t.classList.toggle('long',isT&&!!ST[st.st].long);
  t.innerHTML=lines.map((l,k)=>`<span class="ln" data-k="${k}" ${isT?'tabindex="0"':''}>${lineHTML(l)}</span>`).join('');
  t.querySelectorAll('.v').forEach(v=>{v.onclick=e=>{e.stopPropagation();showVocab(v.dataset.w)};v.onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();showVocab(v.dataset.w)}}});
  if(isT){t.querySelectorAll('.ln').forEach(l=>{l.onclick=()=>{autoOn=false;playLine(+l.dataset.k)};l.onkeydown=e=>{if(e.key==='Enter')l.onclick()}});lineIdx=-1;stateTo(st.st,-1);}
  t.scrollTop=0;t.scrollLeft=0;
  const A=$('#acts');A.innerHTML='';
  const acts=isT?[['▶ 下一句',nextLine,1],['🎬 整段自動播',autoPlay],['🔁 從頭來',()=>{stopAll();lineIdx=-1;stateTo(st.st,-1);$$('#txt .ln').forEach(l=>l.classList.remove('on','done'))}]]:(st.acts||[]);
  acts.forEach(([l,f,m])=>{const b=document.createElement('button');b.textContent=l;if(m)b.className='main';b.onclick=f;A.appendChild(b)});
  if(isT)A.insertAdjacentHTML('beforeend','<span class="hint" id="lineNo">點右邊的句子，也可以一句一句看</span>');
  let active=0;TABS.forEach(([n,ti])=>{if(cur>=ti)active=ti});
  $$('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===active));
  $('#prev').disabled=cur===0;$('#next').disabled=cur===S.length-1;
  st.enter&&st.enter();
}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#say').onclick=()=>{const st=S[cur];const lines=st.st!==undefined?ST[st.st].lines:st.guide;speak(lines.join(''))};
document.addEventListener('keydown',e=>{if(e.target.closest('input,.v,.ln'))return;if(e.key===' '&&S[cur].st!==undefined){e.preventDefault();nextLine()}if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
go(0);
</script>
</body>
</html>
