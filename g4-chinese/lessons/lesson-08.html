<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第八課 四季的頭髮｜課文動起來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --bg:#D7ECE8; --panel:#FFFFFF; --ink:#1E2D2B; --soft:#56706B;
  --teal:#2F7F76; --su:#2E7FC1; --au:#C4862E; --wi:#5A7FA8; --sp:#4E9E3A; --gold:#E8A33A;
  --sea:var(--teal);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#142321; --panel:#1E302D; --ink:#EAF4F2; --soft:#A7C1BC; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--kai);background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:1.4vw;padding:1vh 1.6vw .8vh;flex-wrap:wrap}
h1{margin:0;font-size:4.4vh;color:var(--teal);letter-spacing:.12em;white-space:nowrap}
h1 small{font-size:.5em;color:var(--soft);letter-spacing:.05em;margin-right:.4em}
h1 em{font-style:normal;font-size:.45em;color:var(--soft);margin-left:.5em;letter-spacing:0}
nav{display:flex;gap:.4vw;flex-wrap:wrap;align-items:center}
nav button{font:inherit;font-size:2.4vh;padding:.5vh 1vw;border-radius:10px;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer}
nav button.on{background:var(--panel);border-color:var(--c,var(--teal));color:var(--c,var(--teal));font-weight:700}
nav .sep{color:var(--soft)}
main{display:grid;grid-template-columns:1fr 52vh;gap:1.2vw;padding:0 1.6vw 1.4vh;min-height:0}
.stagewrap{display:grid;grid-template-rows:1fr auto;gap:1vh;min-height:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#CFE6E2;min-height:0}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene>svg{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none;z-index:5}
.acts{display:flex;flex-wrap:wrap;gap:.7vw;min-height:6vh;align-items:center}
.acts button{font:inherit;font-size:2.6vh;padding:.9vh 1.4vw;border-radius:999px;border:3px solid var(--sea);background:var(--panel);color:var(--ink);cursor:pointer}
.acts button:hover{background:var(--sea);color:#fff}
.acts button.main{background:var(--sea);color:#fff;font-weight:700}
button:focus-visible,.v:focus-visible,.ln:focus-visible,.cell:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
aside{background:var(--panel);border-radius:20px;padding:1.6vh 1.4vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:1vh;min-height:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh;color:var(--soft)}
.ptitle b{color:var(--sea);font-size:1.15em}
.txt{writing-mode:vertical-rl;font-size:3.9vh;line-height:1.5;letter-spacing:.06em;width:100%;height:100%;min-height:0;overflow:auto;display:block}
.ln{display:block;cursor:pointer;border-radius:10px;padding:.3vh 0;transition:background .3s}
.ln:hover{background:rgba(0,0,0,.05)}
.ln.on{background:#FFF0B8;color:#1E2D2B}
.ln.done{color:var(--soft)}
.txt.guide .ln{cursor:default}
.v{border:2px solid var(--gold);border-radius:6px;cursor:pointer;color:#1F6FA0;padding:.1em 0}
.v.x{border-style:dashed;border-color:#9AA6B5;color:inherit}
@media (prefers-color-scheme: dark){ .v{color:#86C9F0} .ln.on .v{color:#1F6FA0} }
.pnav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.8vh}
.pnav button{font:inherit;font-size:2.6vh;padding:1vh 0;border-radius:12px;border:2px solid var(--soft);background:transparent;color:var(--ink);cursor:pointer}
.pnav .say{background:var(--sea);border-color:var(--sea);color:#fff;font-weight:700}
.pnav button:disabled{opacity:.35}
#pop{position:fixed;left:3vw;bottom:13vh;max-width:48vw;background:#fff;color:#1E2D2B;border:4px solid var(--gold);border-radius:16px;padding:1.4vh 1.6vw;font-size:3vh;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:20}
#pop.on{display:block;animation:pop .3s}
#pop h3{margin:0 0 .4vh;color:#2F7F76;font-size:1.25em}
#pop .row{display:flex;gap:1vw;margin-top:.8vh}
#pop button{font:inherit;font-size:.85em;border-radius:10px;border:2px solid #2F7F76;background:#fff;color:#2F7F76;padding:.3vh 1vw;cursor:pointer}

.badge{position:absolute;background:#fff;color:#1E2D2B;border:4px solid var(--sea);border-radius:14px;padding:.6vh 1.1vw;font-size:3vh;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.6,1);white-space:nowrap}
.badge small{display:block;font-weight:400;font-size:.78em;color:#4B5B58}
.bub{position:absolute;font-size:5vh;font-weight:700;color:#fff;-webkit-text-stroke:2px var(--sea);paint-order:stroke fill;animation:floatup 1.9s ease-out forwards}
@keyframes floatup{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1)}to{transform:translateY(-90px);opacity:0}}
.huge{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:16vh;font-weight:700;color:#fff;-webkit-text-stroke:4px var(--sea);paint-order:stroke fill;animation:ahh 1.8s ease-out forwards;white-space:nowrap}
@keyframes ahh{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.qm{position:absolute;font-size:9vh;font-weight:700;color:var(--sea);animation:qbob 1s ease-in-out 3 alternate}
@keyframes qbob{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-16px) rotate(10deg)}}
.lens{position:absolute;font-size:9vh;animation:search 3s ease-in-out forwards}
@keyframes search{0%{left:10%;top:60%}25%{left:70%;top:20%}50%{left:20%;top:20%}75%{left:75%;top:60%}100%{left:45%;top:35%;opacity:0}}
.flash{position:absolute;inset:0;background:#fff;animation:flash .8s ease-out forwards}
@keyframes flash{0%,40%{opacity:0}45%{opacity:.85}60%{opacity:0}70%{opacity:.6}100%{opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.lbl{font-family:var(--kai);font-weight:700}

/* compass */
#compass{position:absolute;right:2%;top:3%;width:19vh;z-index:4;display:none;text-align:center}
#compass.on{display:block;animation:pop .4s}
#compass svg{width:100%;height:auto;display:block}
#compass .cl{font-size:2.8vh;font-weight:700;color:#1E2D2B;background:#fff;border-radius:10px;margin-top:.4vh;padding:.2vh 0;border:3px solid var(--sea)}
.carr{animation:blowin 1.6s ease-in-out infinite}
@keyframes blowin{from{transform:translateY(-34px);opacity:0}30%{opacity:1}to{transform:translateY(0);opacity:.2}}

/* faces */
.face .mo,.face .eb{display:none}
.wow .face .mo,.wow .face .eb{display:inline}
.wow .face .ms,.wow .face .en{display:none}
.look .face .pup{animation:look 1.1s ease-in-out 2}
@keyframes look{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wind{display:none}
.a1 .wind{display:inline}
.wl{animation:windgo 2s linear infinite}
@keyframes windgo{from{transform:translateX(-300px);opacity:0}30%{opacity:.9}to{transform:translateX(900px);opacity:0}}
.gust .wl{animation-duration:.8s}

/* summer */
#suSky{fill:#8FD0F0;transition:fill 1.5s}
.a5 #suSky{fill:#4E5B68}
#suSun{transition:opacity 1s}
.a3 #suSun{opacity:.35}.a5 #suSun{opacity:0}
#suCloud{opacity:0;transform:translateY(-220px);transition:transform 1.6s ease-out,opacity 1s;transform-box:view-box;transform-origin:500px 110px}
.a3 #suCloud{opacity:1;transform:translateY(0)}
.a5 #suCloud{transform:scale(2.7,1.6)}
.rain{display:none}
.rain line{stroke:#D6ECFF;stroke-width:2.5;stroke-dasharray:34 20;animation:fall .6s linear infinite}
@keyframes fall{to{stroke-dashoffset:-108}}
.a3 #suRain{display:inline}
.a4 .rain line{animation-duration:.28s;stroke-width:3}
.a5 #suRain2{display:inline}
#suTears,#suPud{display:none}
.a6 #suTears,.a6 #suPud{display:inline}
.tear{animation:tear 1.1s ease-in infinite}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(60px);opacity:0}}
#suBolt{opacity:0}
.bolt #suBolt{animation:bolt .8s}
@keyframes bolt{0%,40%{opacity:0}45%,58%{opacity:1}60%{opacity:0}70%,80%{opacity:1}100%{opacity:0}}
.a6 .face .ms{display:none}.a6 .face .sad{display:inline}
.face .sad{display:none}
.wet{display:none}.a6 .wet{display:inline}

/* autumn */
#auSkyFace{opacity:0;transition:opacity 1.2s}
.a6 #auSkyFace,.a7 #auSkyFace{opacity:1}
.pl{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .9s cubic-bezier(.3,1.5,.6,1)}
.a3 .pl{transform:scaleY(1)}
.pls{transform-box:fill-box;transform-origin:50% 100%}
.a5 .pls{animation:sway 1.3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.cloud{transform-box:fill-box;transform-origin:center}
.a5 .cloud{animation:cdance 2.6s ease-in-out infinite alternate}
@keyframes cdance{from{transform:translateX(-30px) rotate(-4deg)}to{transform:translateX(30px) rotate(4deg)}}
#auKiss{opacity:0}
.kiss #auKiss{animation:kiss 2.2s ease-out}
@keyframes kiss{0%{opacity:0;transform:translateY(10px) scale(.5)}30%{opacity:1;transform:translateY(0) scale(1.2)}80%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
#auKiss{transform-box:fill-box;transform-origin:center}

/* winter */
#wiSky{fill:#C9D6E3;transition:fill 1.5s}
.a4 #wiSky{fill:#A9C3E0}
#wiCap{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);transition:transform 1.8s ease-out}
.a3 #wiCap{transform:scaleY(1)}
#wiSnow{display:none}.a3 #wiSnow{display:inline}
.flake{animation:snow 5s linear infinite}
@keyframes snow{from{transform:translate(0,-40px)}to{transform:translate(30px,600px)}}
.shiver #wiMt{animation:shake .12s 14}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#wiFrost{display:none}.a4 #wiFrost{display:inline}
#wiSkier{display:none}.a5 #wiSkier{display:inline}
.braid path{fill:none;stroke:#7FA7D6;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 2.6s ease-in-out}
.a4 .face .ms{display:none}.a4 .face .cold{display:inline}
.face .cold{display:none}
.wow .face .cold{display:none}

/* spring */
#spHills{fill:#D8D2B4;transition:fill 2s}
.a5 #spHills{fill:#9ACF74}
.gw{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .6s cubic-bezier(.3,1.6,.6,1)}
.a3 #spGrass .gw{transform:scaleY(1)}
.a5 #spField .gw{transform:scaleY(1)}
.gs{transform-box:fill-box;transform-origin:50% 100%;transition:transform .8s cubic-bezier(.3,1.8,.6,1)}
.a4 .gs{transform:scaleY(1.4) translateY(-2px)}
.a6 .gs{animation:wig .6s ease-in-out infinite alternate}
@keyframes wig{from{transform:scaleY(1.4) rotate(-6deg)}to{transform:scaleY(1.4) rotate(6deg)}}
#spSay{display:none}.a7 #spSay{display:inline}
#spEar{display:none}.a6 #spEar{display:inline}
.bfly{animation:bfly 6s ease-in-out infinite}
@keyframes bfly{0%{transform:translate(0,0)}25%{transform:translate(120px,-40px)}50%{transform:translate(240px,10px)}75%{transform:translate(120px,40px)}100%{transform:translate(0,0)}}
#spBf{display:none}.a7 #spBf{display:inline}
.a7 .face .ms{display:none}.a7 .face .grin{display:inline}
.face .grin{display:none}

/* html scenes */
.html{background:linear-gradient(#E3F2EF,#F5FBFA)}
.tiles{position:absolute;inset:4%;display:grid;grid-template-columns:1fr 1fr;gap:2.4vh}
.tile{font:inherit;border:0;border-radius:22px;color:#fff;font-size:5vh;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)}
.tile span{font-size:11vh;line-height:1}
.tile small{font-size:2.8vh;font-weight:400;opacity:.95}
.tq{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#2F7F76;border-radius:50%;width:24vh;height:24vh;display:flex;align-items:center;justify-content:center;text-align:center;font-size:3.4vh;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.2);line-height:1.4;pointer-events:none}
.wind2{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:3%}
.wind2 svg{width:100%;height:auto;max-height:88%}
.wq{text-align:center;color:#1E2D2B}
.wq .q{font-size:5vh;font-weight:700;margin-bottom:3vh}
.wq .opts{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh;max-width:40vh;margin:0 auto}
.wq .opts button{font:inherit;font-size:4.4vh;padding:1.6vh 0;border-radius:16px;border:4px solid #2F7F76;background:#fff;color:#2F7F76;cursor:pointer}
.wq .fb{font-size:3.4vh;min-height:5vh;margin-top:2.4vh}
.wtable{position:absolute;inset:4%;display:grid;grid-template-columns:12% 14% 22% 1fr;grid-template-rows:auto repeat(4,1fr);gap:1vh;font-size:2.8vh;color:#1E2D2B}
.wtable .h{background:#2F7F76;color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:.6vh}
.wtable .s{border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:5vh;font-weight:700}
.cell{position:relative;background:#fff;border-radius:12px;padding:.6vh 1vw;display:flex;align-items:center;cursor:pointer;line-height:1.4;overflow:hidden}
.cell .cover{position:absolute;inset:0;background:#F2C14E;display:flex;align-items:center;justify-content:center;font-size:2.6vh;color:#6A4A00;transition:transform .45s}
.cell.open .cover{transform:translateY(-102%)}
.writer{position:absolute;inset:3%;display:grid;grid-template-columns:1fr 1fr;gap:2vw;color:#1E2D2B}
.wpanel{display:flex;flex-direction:column;gap:1.4vh;overflow:auto}
.wpanel h4{margin:0;font-size:2.8vh;color:#2F7F76}
.chips{display:flex;flex-wrap:wrap;gap:.8vh}
.chips button{font:inherit;font-size:2.7vh;padding:.6vh 1.2vw;border-radius:999px;border:3px solid #2F7F76;background:#fff;color:#1E2D2B;cursor:pointer}
.chips button.on{background:#2F7F76;color:#fff}
.wpanel input{font:inherit;font-size:2.8vh;padding:.8vh 1vw;border-radius:12px;border:3px solid #9AA6B5;width:100%}
.poem{background:#fff;border-radius:20px;padding:2vh 2vw;writing-mode:vertical-rl;font-size:4.2vh;line-height:1.7;letter-spacing:.06em;border:4px dashed #E8A33A;overflow:auto}
.poem .blank{color:#B0B8B6}

@media (max-width:820px), (max-aspect-ratio:1/1){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  .stage{height:58vh}
  .txt{writing-mode:horizontal-tb;height:auto;font-size:21px}
  .acts button,.pnav button,nav button{font-size:16px}
  h1{font-size:26px}
  .writer{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ .wl,.flake,.bfly,.rain line{animation:none} }

/* ===== 修辭 ===== */
:root{--c-p:#2E8B57;--c-m:#8E5AD6;--c-e:#D9342B;--c-q:#2E6FB3}
#rhBtn{font:inherit;font-size:2.2vh;border-radius:999px;border:2px solid #8E5AD6;background:transparent;color:var(--ink);padding:.3vh .8vw;cursor:pointer}
#rhBtn.on{background:#8E5AD6;color:#fff}
.rh{border-radius:6px;transition:background .3s}
.rhon .rh{cursor:pointer;background:color-mix(in srgb,var(--rc) 18%,transparent);box-shadow:inset -3px 0 0 var(--rc)}
.rhon .rh::before{content:attr(data-l);font-size:.5em;background:var(--rc);color:#fff;border-radius:4px;padding:.1em .15em;margin-bottom:.2em;font-weight:700;letter-spacing:0}
.rhleg{grid-column:1/-1;display:none;gap:.4vw;font-size:2vh;flex-wrap:wrap;align-items:center}
.rhleg.legon{display:flex}
.rhleg span{color:#fff;border-radius:6px;padding:.1vh .5vw}
.rhleg small{color:var(--soft)}
#pop .why{background:#F3EEFF;border-radius:10px;padding:.6vh .8vw;margin-top:.6vh;font-size:.92em}
.rcards{position:absolute;inset:3% 3% auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw}
.rcard{background:#fff;border-radius:16px;border:4px solid var(--rc);padding:1.2vh .8vw;color:#222;cursor:pointer;font:inherit;text-align:left}
.rcard h4{margin:0 0 .6vh;color:var(--rc);font-size:3.6vh}
.rcard p{margin:0;font-size:2.3vh;line-height:1.5}
.rcard.on{background:color-mix(in srgb,var(--rc) 12%,#fff)}
.rex{position:absolute;left:3%;right:3%;top:42%;bottom:4%;background:#fff;border-radius:16px;padding:2vh 2vw;color:#222;font-size:3vh;line-height:1.7;overflow:auto}
.rex .q{font-size:3.8vh;font-weight:700;margin:1vh 0 2vh}
.rex .opts{display:flex;gap:1vw;flex-wrap:wrap}
.rex .opts button{font:inherit;font-size:3.6vh;padding:1vh 2vw;border-radius:16px;border:4px solid var(--rc);background:#fff;color:var(--rc);cursor:pointer;font-weight:700}
.rex .fb{font-size:3vh;min-height:4.5vh;margin-top:1.6vh}
.rex .tagq{font-size:2.2vh;color:#fff;border-radius:6px;padding:.1vh .6vw;margin-right:.6vw}
@media (max-width:820px), (max-aspect-ratio:1/1){.rcards{grid-template-columns:repeat(2,1fr)}.rex{top:52%}}
a.hall-back{position:fixed;z-index:40;top:0;right:0;font-family:var(--kai);font-size:1.7vh;line-height:1.2;padding:.45vh .8vw;white-space:nowrap;background:var(--panel);color:var(--soft);text-decoration:none;border:1px solid var(--soft);border-top:0;border-right:0;border-bottom-left-radius:12px}a.hall-back:hover,a.hall-back:focus-visible{color:var(--ink)}
</style>
</head>
<body>
<a class="hall-back" href="../">← 回課文大廳</a>
<header>
  <h1><small>第八課</small>四季的頭髮<em>林世仁</em></h1>
  <nav id="tabs"></nav>
</header>

<main>
  <div class="stagewrap">
    <div class="stage" id="stage">

      <!-- cover -->
      <div class="scene html" id="sc-cover">
        <div class="tiles">
          <button class="tile" style="background:#2E7FC1" data-go="1"><span>⛈️</span>夏天<small>南風吹來</small></button>
          <button class="tile" style="background:#C4862E" data-go="2"><span>🌾</span>秋天<small>西風吹來</small></button>
          <button class="tile" style="background:#5A7FA8" data-go="3"><span>🏔️</span>冬天<small>北風吹來</small></button>
          <button class="tile" style="background:#4E9E3A" data-go="4"><span>🌱</span>春天<small>東風吹來</small></button>
        </div>
        <div class="tq">四季的頭髮<br>在哪裡？</div>
      </div>

      <!-- summer -->
      <div class="scene" id="sc-su">
        <svg id="su" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
          <rect id="suSky" width="1000" height="560"/>
          <g id="suSun"><circle cx="150" cy="110" r="52" fill="#FFD43B"/><g stroke="#FFD43B" stroke-width="6" stroke-linecap="round"><line x1="150" y1="36" x2="150" y2="18"/><line x1="76" y1="110" x2="58" y2="110"/><line x1="224" y1="110" x2="242" y2="110"/><line x1="98" y1="58" x2="85" y2="45"/><line x1="202" y1="58" x2="215" y2="45"/></g></g>
          <path d="M0,400 Q150,330 300,380 T600,370 T1000,360 L1000,560 L0,560Z" fill="#6FAF5C"/>
          <g id="suRain2" class="rain"></g>
          <g id="suCloud"></g>
          <g id="suRain" class="rain"></g>
          <path id="suBolt" d="M610,190 L570,280 L605,280 L560,380 L650,260 L612,260 L650,190Z" fill="#FFE45C" stroke="#fff" stroke-width="3"/>
          <ellipse cx="500" cy="660" rx="520" ry="260" fill="#79B35F"/>
          <g id="suFace"></g>

let timers=[];let autoOn=false;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;}
function stopAll(){timers.forEach(clearTimeout);timers=[];autoOn=false;try{speechSynthesis.cancel()}catch(e){};$('#ov').innerHTML='';$('#pop').classList.remove('on');}
function ov(html,style,cls='badge'){const d=document.createElement('div');d.className=cls;d.innerHTML=html;Object.assign(d.style,style||{});$('#ov').appendChild(d);return d;}

function bubbles(words,area){words.forEach((w,i)=>later(()=>temp(w,{left:(area.x+Math.random()*area.w)+'%',top:(area.y+Math.random()*area.h)+'%'},'bub',1950),i*280))}
const clean=t=>rhStrip(t).replace(/\[\[|\]\]|\{\{|\}\}/g,'');

function replay(node,cls,ms){node.classList.remove(cls);void node.getBoundingClientRect();node.classList.add(cls);if(ms)later(()=>node.classList.remove(cls),ms);}

}

(function(){

  const r1=$('#suRain');for(let x=330;x<=690;x+=14)el('line',{x1:x,y1:190,x2:x-14,y2:460,style:`animation-delay:${-Math.random()}s`},r1);
  const r2=$('#suRain2');for(let x=-20;x<=1020;x+=16)el('line',{x1:x,y1:20,x2:x-16,y2:470,style:`animation-delay:${-Math.random()}s`},r2);
  face($('#suFace'),500,470,1.3);
  const tg=el('g',{id:'suTears'},$('#suFace'));[[-44*1.3+500,490],[44*1.3+500,490]].forEach(([x,y],i)=>{for(let k=0;k<2;k++)el('path',{class:'tear',d:`M${x},${y} q7,12 0,18 q-7,-6 0,-18Z`,fill:'#5BB4E8',style:`animation-delay:${k*.55+i*.2}s`},tg)});

  const ap=$('#auPlumes');
  const topY=x=>{const t=(x-40)/920;return 560*(1-t)*(1-t)+2*(1-t)*t*240+t*t*560;}; // approx along quad (y)
  const pts=[];for(let i=0;i<19;i++){pts.push(250+i*28)}
  pts.forEach((x,i)=>{
    const tt=(x-40)/920; const qx=(1-tt)*(1-tt)*40+2*(1-tt)*tt*500+tt*tt*960; // not exact; use simple curve instead
    const y=236+Math.pow((x-500)/460,2)*324+6;

  const fr=$('#wiFrost');for(let k=0;k<14;k++){const x=40+Math.random()*920,y=40+Math.random()*200;el('path',{d:`M${x},${y-10} V${y+10} M${x-9},${y-5} L${x+9},${y+5} M${x-9},${y+5} L${x+9},${y-5}`,stroke:'#fff','stroke-width':2.5,'stroke-linecap':'round'},fr);}

function wipeSeason(k){const s=SEA[k].svg();s.setAttribute('class','');if(k==='au'){$$('#auPlumes .pl').forEach(p=>p.style.transform='')}if(k==='wi'){$$('#wiBraids path').forEach(p=>{p.style.transitionDelay='0s';p.style.strokeDashoffset=p.dataset.len})}}
let lineIdx=-1;
function playLine(k,{speakIt=true,onend}={}){
  const st=S[cur];if(!st.season)return;const se=SEA[st.season],svg=se.svg();
  lineIdx=k;
  const keep=[...svg.classList].filter(c=>!/^a\d$/.test(c));svg.setAttribute('class',keep.join(' '));
  for(let i=0;i<=k;i++)svg.classList.add('a'+i);
  se.fx[k](svg);
  $$('#txt .ln').forEach((l,i)=>{l.classList.toggle('on',i===k);l.classList.toggle('done',i<k)});
  $('#lineNo')&&($('#lineNo').textContent=`第 ${k+1} 句／共 ${se.lines.length} 句`);
  if(speakIt){const txt=se.lines[k];let done=false;const fin=()=>{if(done)return;done=true;onend&&onend()};
    speak(txt.replace('啊——','啊'),()=>later(fin,700));later(fin,Math.max(2600,clean(txt).length*480+1400));}
}
function nextLine(){const st=S[cur];if(!st.season)return;const n=SEA[st.season].lines.length;if(lineIdx<n-1)playLine(lineIdx+1);else{temp('這一段念完了！',{left:'50%',top:'45%',transform:'translateX(-50%)'},'badge',1800)}}
function autoPlay(){const st=S[cur];if(!st.season)return;stopAll();wipeSeason(st.season);$('#compass').classList.remove('on');autoOn=true;const n=SEA[st.season].lines.length;
  const step=i=>{if(!autoOn||i>=n){autoOn=false;return}playLine(i,{onend:()=>{if(autoOn)step(i+1)}})};later(()=>step(0),300);}
function restart(){const st=S[cur];stopAll();wipeSeason(st.season);$('#compass').classList.remove('on');lineIdx=-1;$$('#txt .ln').forEach(l=>l.classList.remove('on','done'));}

function rhAsk(){const ex=$('#rex');if(rqi>=rqList.length){ex.innerHTML='<div class="q">全部完成！🎉</div>';speak('全部完成，你好棒');return}
  const [s,a,fromText]=rqList[rqi];ex.innerHTML=`<div><span class="tagq" style="background:${fromText?'#2F6F78':'#9AA6B5'}">${fromText?'課文':'練習題'}</span>第 ${rqi+1}／${rqList.length} 題：這句用了什麼修辭？</div><div class="q">${s}</div><div class="opts"></div><div class="fb"></div>`;speak(s);
  Object.entries(RH).forEach(([n,[k]])=>{const b=document.createElement('button');b.textContent=n;b.style.setProperty('--rc',`var(--c-${k})`);b.onclick=()=>{const fb=ex.querySelector('.fb');if(n===a){fb.textContent='答對了！這是「'+a+'」⭐';fb.style.color='#2E8B57';speak('答對了');rqi++;setTimeout(rhAsk,1500)}else{fb.textContent='再想想看：句子裡有沒有「像」「！」「？」，或是把東西寫成人？';fb.style.color='#C8362B'}};ex.querySelector('.opts').appendChild(b)});}
$('#rhBtn').onclick=rhToggle;
S.push({sc:'rh',tag:'修辭小教室',no:'統整',guide:1,lines:['認識四種修辭：','擬人、譬喻、感嘆、設問。','點上面的卡片看說明，','再按「考考你」練習。','回到課文打開「🔍 修辭」，','找找句子藏在哪裡！'],enter(){buildRh()},acts:[['🎯 考考你',rhQuiz],['📖 看說明',buildRh]]});

/* ---------- navigation ---------- */
const TABS=[['開始',0],['夏',1,'#2E7FC1'],['秋',2,'#C4862E'],['冬',3,'#5A7FA8'],['春',4,'#4E9E3A'],['風從哪裡來',5],['統整表',6],['我來寫詩',7]];
TABS.push(['修辭小教室',S.length-1]);TABS.forEach(([n,i,c],k)=>{if(k===5)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">｜</span>');const b=document.createElement('button');b.textContent=n;if(c)b.style.setProperty('--c',c);b.onclick=()=>go(i);b.dataset.i=i;$('#tabs').appendChild(b)});
$$('.tile').forEach(t=>t.onclick=()=>go(+t.dataset.go));
let cur=0;
function lineHTML(t){return rhWrap(t).replace(/\[\[(.+?)\]\]/g,(m,w)=>`<span class="v" role="button" tabindex="0" data-w="${w}">${w}</span>`)}
function go(i){
  stopAll();cur=Math.max(0,Math.min(S.length-1,i));const st=S[cur];
  $$('.scene').forEach(s=>s.classList.toggle('on',s.id==='sc-'+st.sc));
  $('#compass').classList.remove('on');
  const color=st.season?SEA[st.season].color:'#2F7F76';document.documentElement.style.setProperty('--sea',color);
  $('#ptag').textContent=st.tag;$('#pno').textContent=st.no;
  const lines=st.season?SEA[st.season].lines:st.lines;
  const t=$('#txt');t.classList.toggle('guide',!!st.guide);
  t.innerHTML=lines.map((l,k)=>`<span class="ln" data-k="${k}" ${st.season?'tabindex="0"':''}>${lineHTML(l)}</span>`).join('');
  t.querySelectorAll('.v').forEach(v=>{v.onclick=e=>{e.stopPropagation();showVocab(v.dataset.w)};v.onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();showVocab(v.dataset.w)}}});
  if(st.season){t.querySelectorAll('.ln').forEach(l=>{l.onclick=()=>{autoOn=false;playLine(+l.dataset.k)};l.onkeydown=e=>{if(e.key==='Enter')l.onclick()}});}
  bindRh(t);t.scrollTop=0;t.scrollLeft=0;
  const A=$('#acts');A.innerHTML='';
  let acts=st.acts||[];
  if(st.season){wipeSeason(st.season);lineIdx=-1;acts=[['▶ 下一句',nextLine,1],['🎬 整段自動播',autoPlay],['🔁 從頭來',restart]];}
  acts.forEach(([l,f,m])=>{const b=document.createElement('button');b.textContent=l;if(m)b.className='main';b.onclick=f;A.appendChild(b)});
  if(st.season)A.insertAdjacentHTML('beforeend','<span id="lineNo" style="font-size:2.4vh;color:var(--soft);margin-left:.6vw">點右邊的詩句，也可以一句一句看</span>');
  let active=0;TABS.forEach(([n,ti])=>{if(cur>=ti)active=ti});
  $$('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===active));
  $('#prev').disabled=cur===0;$('#next').disabled=cur===S.length-1;
  st.enter&&st.enter();
}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#say').onclick=()=>{const st=S[cur];const lines=st.season?SEA[st.season].lines:st.lines;speak(lines.join('').replace('啊——','啊，'))};
document.addEventListener('keydown',e=>{if(e.target.closest('input,.v,.ln,.cell'))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);if(e.key===' '&&S[cur].season){e.preventDefault();nextLine()}});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
go(0);
</script>
</body>
</html>
