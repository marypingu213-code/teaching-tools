<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第十一課 豆粥婆婆｜課文動起來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --bg:#E9ECE2; --panel:#FFFFFF; --ink:#26211B; --soft:#6B6358;
  --bean:#A3263A; --tiger:#E9862A; --gold:#E8A33A; --navy:#24365E;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1A1C17; --panel:#26281F; --ink:#F1EFE8; --soft:#BDB6A8; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--kai);background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:1.2vw;padding:1vh 1.6vw .8vh;flex-wrap:wrap}
h1{margin:0;font-size:4.4vh;color:var(--bean);letter-spacing:.12em;white-space:nowrap}
h1 small{font-size:.5em;color:var(--soft);letter-spacing:.05em;margin-right:.4em}
h1 em{font-style:normal;font-size:.42em;color:var(--soft);margin-left:.5em;letter-spacing:0}
nav{display:flex;gap:.15vw;flex-wrap:wrap;align-items:center}
nav button{font:inherit;font-size:2.2vh;padding:.5vh .6vw;border-radius:10px;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:.25em}
nav button i{font-style:normal;display:inline-grid;place-items:center;width:2.5vh;height:2.5vh;border-radius:50%;background:var(--bean);color:#fff;font-size:1.5vh}
nav button.on{background:var(--panel);border-color:var(--bean);color:var(--bean);font-weight:700}
nav .sep{color:var(--soft);font-size:1.8vh}
main{display:grid;grid-template-columns:1fr 50vh;gap:1.2vw;padding:0 1.6vw 1.4vh;min-height:0}
.stagewrap{display:grid;grid-template-rows:1fr auto;gap:1vh;min-height:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#DDE3D3;min-height:0}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene>svg{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none;z-index:7}
#tchip{position:absolute;right:2%;top:3%;z-index:6;background:#26211B;color:#fff;border-radius:999px;padding:.5vh 1.2vw;font-size:2.6vh;font-weight:700;display:none}
#tchip.on{display:block;animation:pop .4s}
.acts{display:flex;flex-wrap:wrap;gap:.6vw;min-height:6vh;align-items:center}
.acts button{font:inherit;font-size:2.5vh;padding:.8vh 1.2vw;border-radius:999px;border:3px solid var(--bean);background:var(--panel);color:var(--ink);cursor:pointer}
.acts button:hover{background:var(--bean);color:#fff}
.acts button.main{background:var(--bean);color:#fff;font-weight:700}
.acts button.done{opacity:.55}
button:focus-visible,.v:focus-visible,.cell:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
aside{background:var(--panel);border-radius:20px;padding:1.6vh 1.4vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:1vh;min-height:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh;color:var(--soft)}
.ptitle b{color:var(--bean);font-size:1.15em}
.txt{writing-mode:vertical-rl;font-size:3.9vh;line-height:1.8;letter-spacing:.05em;width:100%;height:100%;min-height:0;overflow:auto;display:block}
.txt.long{font-size:3.4vh}
.v{border:2px solid var(--gold);border-radius:6px;cursor:pointer;color:#1F6FA0;padding:.1em 0}
.v.x{border-style:dashed;border-color:#9AA6B5;color:inherit}
@media (prefers-color-scheme: dark){ .v{color:#86C9F0} }
.pnav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.8vh}
.pnav button{font:inherit;font-size:2.6vh;padding:1vh 0;border-radius:12px;border:2px solid var(--soft);background:transparent;color:var(--ink);cursor:pointer}
.pnav .say{background:var(--bean);border-color:var(--bean);color:#fff;font-weight:700}
.pnav button:disabled{opacity:.35}
#pop{position:fixed;left:3vw;bottom:13vh;max-width:48vw;background:#fff;color:#26211B;border:4px solid var(--gold);border-radius:16px;padding:1.4vh 1.6vw;font-size:3vh;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:20}
#pop.on{display:block;animation:pop .3s}
#pop h3{margin:0 0 .4vh;color:#A3263A;font-size:1.25em}
#pop .row{display:flex;gap:1vw;margin-top:.8vh}
#pop button{font:inherit;font-size:.85em;border-radius:10px;border:2px solid #A3263A;background:#fff;color:#A3263A;padding:.3vh 1vw;cursor:pointer}

.badge{position:absolute;background:#fff;color:#26211B;border:4px solid var(--bean);border-radius:14px;padding:.6vh 1.1vw;font-size:2.9vh;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.6,1);white-space:nowrap;z-index:8}
.badge.gold{border-color:var(--gold)}.badge.navy{border-color:var(--navy)}
.badge small{display:block;font-weight:400;font-size:.78em;color:#5A5246}
.say{z-index:8}
.bubble{position:absolute;background:#fff;color:#26211B;border:4px solid #26211B;border-radius:18px;padding:.7vh 1vw;font-size:2.7vh;line-height:1.45;max-width:44%;animation:pop .3s cubic-bezier(.3,1.6,.6,1);z-index:8}
.bubble b{display:block;font-size:.85em;color:#A3263A}
.bub{position:absolute;font-size:5vh;font-weight:700;color:#fff;-webkit-text-stroke:2px #A3263A;paint-order:stroke fill;animation:floatup 1.9s ease-out forwards;z-index:8}
@keyframes floatup{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1)}to{transform:translateY(-90px);opacity:0}}
.huge{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:14vh;font-weight:700;color:#fff;-webkit-text-stroke:4px #A3263A;paint-order:stroke fill;animation:ahh 1.6s ease-out forwards;white-space:nowrap;z-index:8}
@keyframes ahh{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.lbl{font-family:var(--kai);font-weight:700}
.instant,.instant *{transition:none!important}

/* moving parts */
.mv{transition:transform 1.2s ease-in-out,opacity .6s}
.bd{transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s}
.roll .bd{animation:roll .6s linear infinite;transform-origin:50% 50%}
@keyframes roll{to{transform:rotate(360deg)}}
.hop .bd{animation:hop .35s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-14px)}}
.run .bd{animation:runb .18s ease-in-out infinite alternate}
@keyframes runb{to{transform:translateY(-10px) rotate(-4deg)}}
.jump .bd{animation:jump .7s ease-out}
@keyframes jump{40%{transform:translateY(-80px)}100%{transform:translateY(0)}}
.shake .bd{animation:shk .1s linear 10}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.out{opacity:0}
.cry .tears{display:inline}.tears{display:none}
.tear{animation:tear 1s ease-in infinite}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(40px);opacity:0}}
.pale .gface{fill:#F4F1EC}.pale .pmark{display:inline}.pmark{display:none}
.bow .upper{transform:rotate(-24deg);transform-box:fill-box;transform-origin:50% 100%}
.upper{transition:transform .6s}
.happy .mS{display:none}.happy .mH{display:inline}.mH{display:none}
.angry .brow{display:inline}.brow{display:none}
/* tiger */
.tsplat,.tseal,.tcrab,.tsweat,.trolled,.tglow{display:none}
.splat .tsplat,.seal .tseal,.pinch .tcrab,.sweat .tsweat,.rolled .trolled,.glow .tglow{display:inline}
.dip .bd{transform:rotate(-24deg)}
.trip .bd{transform:rotate(-70deg)}
.flinch .bd{animation:shk .1s linear 8}
.drip{animation:tear 1s ease-in infinite}
.matflat{transition:opacity .4s}.matflat.matgone{opacity:0}
.legout .jleg{transform:rotate(-55deg)}
.jleg{transform-box:fill-box;transform-origin:50% 0;transition:transform .4s}
.tailshow .ktail{display:inline}.ktail{display:none}

/* scene specific */
#steam1 path{animation:steam 2.4s ease-out infinite}
@keyframes steam{from{transform:translateY(0);opacity:.9}to{transform:translateY(-60px);opacity:0}}
#mapCard{transition:opacity .6s}
#sand{display:none}.storm #sand{display:inline}
.sandp{animation:sandf 1.4s linear infinite}
@keyframes sandf{from{transform:translate(-200px,40px) rotate(0)}to{transform:translate(1100px,-60px) rotate(720deg)}}
#tiger2W{opacity:0;transition:opacity 1s}.tigerin #tiger2W{opacity:1}
#think3{opacity:0;transition:opacity .6s}.think #think3{opacity:1}
#cal3{opacity:0;transition:opacity .6s}.cal #cal3{opacity:1}
#nightR{opacity:0;transition:opacity 1.5s}.night #nightR{opacity:.62}
#lampG{opacity:0}.night #lampG{opacity:1}
#endTiger .bd{animation:shk .12s linear infinite}

/* html scenes */
.html{background:linear-gradient(#EFF2E8,#FAFBF7)}
.track{position:absolute;left:2.5%;right:2.5%;top:4%;display:flex;gap:.6%;align-items:center}
.slot{flex:1;height:12vh;border:3px dashed #9AA38D;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.2vh;color:#26211B;background:rgba(255,255,255,.6)}
.slot b{font-size:4vh}
.slot.done{border:3px solid #A3263A;background:#fff;animation:pop .4s}
.arrow{font-size:2.4vh;color:#9AA38D}
.cards{position:absolute;left:5%;right:5%;top:23%;bottom:5%;display:grid;grid-template-columns:repeat(4,1fr);gap:1.8vh}
.card{font:inherit;border:4px solid #E9862A;border-radius:18px;background:#fff;color:#26211B;font-size:2.8vh;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vh;line-height:1.35;padding:.6vh}
.card span{font-size:6vh}
.card.used{visibility:hidden}
.card.bad{animation:shake .12s 4;border-color:#999}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.rtable{position:absolute;inset:20% 2.5% 2.5%;display:none;grid-template-columns:16% 1fr 1fr;gap:.6vh;font-size:2.5vh;color:#26211B;overflow:auto}
.rtable.on{display:grid}
.rtable div{background:#fff;border-radius:10px;padding:.5vh .7vw;display:flex;align-items:center;line-height:1.35}
.rtable .h{background:#A3263A;color:#fff;font-weight:700;justify-content:center}
.rtable .p{font-weight:700;color:#A3263A;justify-content:center}
.rtable .f{position:relative;background:#FFF2D6;cursor:pointer}
.rtable .f .cover{position:absolute;inset:0;background:#F2C14E;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#6A4A00;transition:transform .4s}
.rtable .f.open .cover{transform:scaleY(0);transform-origin:top}
.wgrid{position:absolute;inset:4% 4%;display:grid;grid-template-columns:13% 1fr;grid-template-rows:repeat(5,1fr);gap:1.2vh;font-size:3vh;color:#26211B}
.wgrid .k{display:flex;align-items:center;justify-content:center;font-size:5.4vh;font-weight:700;color:#fff;background:#A3263A;border-radius:14px}
.cell{position:relative;background:#fff;border-radius:14px;padding:.6vh 1.4vw;display:flex;align-items:center;cursor:pointer;line-height:1.45;overflow:hidden}
.cell .cover{position:absolute;inset:0;background:#F2C14E;display:flex;align-items:center;justify-content:center;font-size:3vh;color:#6A4A00;transition:transform .45s}
.cell.open .cover{transform:translateY(-102%)}
.quiz{position:absolute;inset:0;background:rgba(26,28,23,.84);display:none;align-items:center;justify-content:center;z-index:9}
.quiz.on{display:flex}
.qbox{background:#fff;color:#26211B;border-radius:20px;padding:3vh 3vw;text-align:center;min-width:55%}
.qword{font-size:6.6vh;font-weight:700;color:#A3263A;margin:1vh 0 2vh}
.qbtns{display:flex;gap:1.2vw;justify-content:center}
.qbtns button{font:inherit;font-size:5vh;width:11vh;height:11vh;border-radius:50%;border:4px solid #A3263A;background:#fff;color:#A3263A;cursor:pointer}
.qfb{font-size:3.4vh;min-height:5vh;margin-top:2vh}
.qbox .close{font:inherit;font-size:2.4vh;margin-top:1vh;background:none;border:2px solid #999;border-radius:10px;padding:.4vh 1.2vw;cursor:pointer}

@media (max-width:820px), (max-aspect-ratio:1/1){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  .stage{height:58vh}
  .txt,.txt.long{writing-mode:horizontal-tb;height:auto;font-size:21px}
  .acts button,.pnav button,nav button{font-size:15px}
  h1{font-size:26px}
  .cards{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion: reduce){ .sandp,#steam1 path,.tear{animation:none} }

/* ===== 修辭 ===== */
:root{--c-p:#2E8B57;--c-m:#8E5AD6;--c-e:#D9342B;--c-q:#2E6FB3}
#rhBtn{font:inherit;font-size:2.2vh;border-radius:999px;border:2px solid #8E5AD6;background:transparent;color:var(--ink);padding:.3vh .8vw;cursor:pointer}
#rhBtn.on{background:#8E5AD6;color:#fff}
.rh{border-radius:6px;transition:background .3s}
.rhon .rh{cursor:pointer;background:color-mix(in srgb,var(--rc) 18%,transparent);box-shadow:inset -3px 0 0 var(--rc)}
.rhon .rh::before{content:attr(data-l);font-size:.5em;background:var(--rc);color:#fff;border-radius:4px;padding:.1em .15em;margin-bottom:.2em;font-weight:700;letter-spacing:0}
.rhleg{grid-column:1/-1;display:none;gap:.4vw;font-size:2vh;flex-wrap:wrap;align-items:center}
.rhleg.legon{display:flex}
.rhleg span{color:#fff;border-radius:6px;padding:.1vh .5vw}
.rhleg small{color:var(--soft)}
#pop .why{background:#F3EEFF;border-radius:10px;padding:.6vh .8vw;margin-top:.6vh;font-size:.92em}
.rcards{position:absolute;inset:3% 3% auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw}
.rcard{background:#fff;border-radius:16px;border:4px solid var(--rc);padding:1.2vh .8vw;color:#222;cursor:pointer;font:inherit;text-align:left}
.rcard h4{margin:0 0 .6vh;color:var(--rc);font-size:3.6vh}
.rcard p{margin:0;font-size:2.3vh;line-height:1.5}
.rcard.on{background:color-mix(in srgb,var(--rc) 12%,#fff)}
.rex{position:absolute;left:3%;right:3%;top:42%;bottom:4%;background:#fff;border-radius:16px;padding:2vh 2vw;color:#222;font-size:3vh;line-height:1.7;overflow:auto}
.rex .q{font-size:3.8vh;font-weight:700;margin:1vh 0 2vh}
.rex .opts{display:flex;gap:1vw;flex-wrap:wrap}
.rex .opts button{font:inherit;font-size:3.6vh;padding:1vh 2vw;border-radius:16px;border:4px solid var(--rc);background:#fff;color:var(--rc);cursor:pointer;font-weight:700}
.rex .fb{font-size:3vh;min-height:4.5vh;margin-top:1.6vh}
.rex .tagq{font-size:2.2vh;color:#fff;border-radius:6px;padding:.1vh .6vw;margin-right:.6vw}
@media (max-width:820px), (max-aspect-ratio:1/1){.rcards{grid-template-columns:repeat(2,1fr)}.rex{top:52%}}
a.hall-back{position:fixed;z-index:40;top:0;right:0;font-family:var(--kai);font-size:1.7vh;line-height:1.2;padding:.45vh .8vw;white-space:nowrap;background:var(--panel);color:var(--soft);text-decoration:none;border:1px solid var(--soft);border-top:0;border-right:0;border-bottom-left-radius:12px}a.hall-back:hover,a.hall-back:focus-visible{color:var(--ink)}
</style>
</head>
<body>
<a class="hall-back" href="../">← 回課文大廳</a>
<header>
  <h1><small>第十一課</small>豆粥婆婆<em>改寫自韓國民間故事</em></h1>
  <nav id="tabs"></nav>
</header>

<main>
  <div class="stagewrap">
    <div class="stage" id="stage">

      <!-- 1 -->
      <div class="scene" id="sc-s1">
        <svg id="S1" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
          <rect width="1000" height="560" fill="#F3E9D6"/>
          <rect y="430" width="1000" height="130" fill="#C9A273"/>
          <path d="M380,560 L380,250 Q520,200 660,250 L660,560Z" fill="#E7D3B0"/>
          <path d="M360,256 Q520,170 680,256 L668,270 Q520,196 372,270Z" fill="#5A4A3A"/>
          <g id="stove1"><rect x="560" y="360" width="160" height="80" rx="10" fill="#8A6A4A"/><path d="M580,360 q60,-70 120,0Z" fill="#3A3A3A"/><ellipse cx="640" cy="352" rx="62" ry="12" fill="#7A2030"/>
            <g id="steam1" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"><path d="M610,330 q-10,-20 0,-40 q10,-20 0,-40"/><path d="M645,330 q-10,-20 0,-40 q10,-20 0,-40" style="animation-delay:.8s"/><path d="M680,330 q-10,-20 0,-40 q10,-20 0,-40" style="animation-delay:1.6s"/></g></g>
          <g id="gm1"></g>
          <g id="vill1"></g>
          <g id="mapCard"></g>
        </svg>
      </div>

      <!-- 2 & 3 field -->
      <div class="scene" id="sc-s2">
        <svg id="S2" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
          <rect width="1000" height="560" fill="#BFD9E8"/>
          <path d="M0,300 L140,180 L260,260 L420,140 L600,270 L760,170 L1000,280 L1000,400 L0,400Z" fill="#7FA66A"/>
          <rect y="380" width="1000" height="180" fill="#A9864E"/>
          <g id="beans2"></g>
          <g id="tiger2W"></g>
          <g id="gm2"></g>
          <g id="think3"><circle cx="760" cy="150" r="10" fill="#fff"/><circle cx="790" cy="110" r="16" fill="#fff"/><ellipse cx="880" cy="70" rx="100" ry="56" fill="#fff" stroke="#A3263A" stroke-width="3"/><ellipse cx="880" cy="80" rx="44" ry="16" fill="#7A2030"/><path d="M836,80 q44,40 88,0" fill="#E8D6C0" stroke="#8A6A4A" stroke-width="3"/><path d="M860,52 q-6,-14 0,-26 M884,52 q-6,-14 0,-26 M906,52 q-6,-14 0,-26" stroke="#B9B9B9" stroke-width="4" fill="none"/></g>
          <g id="cal3"><rect x="40" y="40" width="160" height="150" rx="12" fill="#fff" stroke="#A3263A" stroke-width="4"/><rect x="40" y="40" width="160" height="44" rx="12" fill="#A3263A"/><text x="120" y="72" text-anchor="middle" font-size="26" fill="#fff" class="lbl">等到</text><text x="120" y="150" text-anchor="middle" font-size="48" fill="#A3263A" class="lbl">冬至</text></g>
          <g id="sand"></g>
        </svg>
      </div>

      <!-- house 4-8 -->
      <div class="scene" id="sc-h">
        <svg id="H" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
          <rect width="1000" height="560" fill="#E9D7B8"/>
          <g stroke="#B9A17A" stroke-width="3"><rect x="90" y="70" width="200" height="140" fill="#F7EFDC"/><line x1="156" y1="70" x2="156" y2="210"/><line x1="222" y1="70" x2="222" y2="210"/><line x1="90" y1="140" x2="290" y2="140"/></g>
          <rect x="880" y="110" width="120" height="330" fill="#3A3A50"/><rect x="872" y="104" width="14" height="336" fill="#7A5A34"/>
          <rect x="470" y="186" width="190" height="12" fill="#7A5A34"/><rect x="480" y="198" width="8" height="24" fill="#7A5A34"/><rect x="642" y="198" width="8" height="24" fill="#7A5A34"/>
          <rect y="430" width="1000" height="130" fill="#D9B67A"/>
          <g stroke="#C9A060" stroke-width="2"><line x1="0" y1="470" x2="1000" y2="470"/><line x1="0" y1="515" x2="1000" y2="515"/></g>
          <g id="stoveH"><rect x="250" y="340" width="150" height="100" rx="10" fill="#8A6A4A"/><path d="M262,340 q63,-60 126,0Z" fill="#3A3A3A"/><text x="325" y="410" text-anchor="middle" font-size="20" fill="#F3E9D6" class="lbl">灶</text></g>
          <g id="matFlat" class="matflat"><path d="M440,500 L720,500 L690,456 L470,456Z" fill="#E8C66A" stroke="#B08A2A" stroke-width="3"/><g stroke="#C9A040" stroke-width="2"><line x1="480" y1="470" x2="700" y2="470"/><line x1="470" y1="486" x2="712" y2="486"/></g>

   ['🌀 缸一滾，好遠好遠……',()=>{cl('h-kim','roll');pos('h-kim',700,0,3000);later(()=>say1('老虎被滾得好遠、好遠……'),1600)}]]},
 {sc:'end',tag:'從此以後',no:'第9段',time:'從此以後',text:'從此，老虎再也不敢到婆婆家了。',
  acts:[['🎉 大家好開心',()=>bubbles(['耶！','成功了！','謝謝大家！','耶——！'],{x:10,y:40,w:50,h:20})]]},
 {sc:'order',tag:'誰先出手？',no:'統整一',text:'老虎進門以後，小幫手們一個接一個出手。請按照課文的順序，點一點小幫手！排好以後，想一想：每個小幫手用了自己的什麼特點？',
  enter(){startOrder()},acts:[['🔄 重新排',startOrder],['📋 直接看答案',()=>{$$('.slot').forEach((s,i)=>{s.classList.add('done');s.innerHTML=`<b>${OR[i].e}</b>${OR[i].n}`});showOrder()}]]},
 {sc:'w',tag:'人事時地物',no:'統整二',text:'找一找課文裡的人、事、時、地、物。點一點黃色的格子，看看答案；也可以按「考考你」來練習分類。',
  enter(){$$('.cell').forEach(c=>c.classList.remove('open'));$('#quiz').classList.remove('on')},
  acts:[['📖 全部打開',()=>$$('.cell').forEach(c=>c.classList.add('open'))],['🙈 全部蓋起來',()=>$$('.cell').forEach(c=>c.classList.remove('open'))],['🎯 考考你',startQuiz]]}
];


/* ===== 修辭 ===== */
function rhStrip(t){return String(t).replace(/\(@[^|@]+\|[^|@]+\|/g,'').replace(/@\)/g,'')}
const RH={'擬人':['p','把不是人的東西，寫得像人一樣：會說話、會感覺、會做事。'],'譬喻':['m','用另一樣相像的東西來比方，常用「像、好像、有如、就像、是」。'],'感嘆':['e','用「！」或「啊、呀、唉、哇……」，表達強烈的感情，像高興、驚訝、難過。'],'設問':['q','用問句引起注意，或說出心裡的疑問；有時自己問、自己答，有時問了不回答。']};
const RHWHY={"d1": "「呀！」表達婆婆害怕又著急，大聲呼喊的心情。", "d2": "老虎像人一樣會說話，還想喝豆粥。", "d3": "蛋和栗子本來不會說話，這裡卻像人一樣關心婆婆、問問題。", "d4": "「吃你？」是反問，意思是「怎麼可以吃你！」；木背架會說話、會生氣，也是擬人。", "d5": "用兩個「！」表達小幫手們生氣又勇敢的心情。", "d6": "草蓆像人一樣會說話、會抱怨。", "d7": "「好痛！」表達老虎被夾住鼻子時痛得受不了。", "d8": "草蓆像人一樣會「翻身」，還能捲住老虎。"};
const RQ=[["「婆婆，你為什麼哭呢？」蛋和栗子滾動著身子問。", "擬人", 1], ["「吃你？哪有這種事！」", "設問", 1], ["「竟然比我們還橫！即便牠來了，我們也不怕！」", "感嘆", 1], ["「別在我身上又跳又爬的！」草蓆說。", "擬人", 1], ["「好痛！」", "感嘆", 1]].concat([['「天上的白雲，像一團團棉花糖。」','譬喻',0],['「太陽公公笑咪咪的看著大家。」','擬人',0],['「哇！雪花好美啊！」','感嘆',0],['「冬天為什麼要多穿衣服？因為天氣冷，容易著涼。」','設問',0],['「小雨點在窗戶上跳舞。」','擬人',0],['「雪地白得像鋪了一層糖粉。」','譬喻',0]]);
let rhOn=false,rqList=[],rqi=0;
function rhWrap(t){return String(t).replace(/\(@([^|@]+)\|([^|@]+)\|(.+?)@\)/g,(m,types,key,inner)=>{const ts=types.split(',');return `<span class="rh" role="button" tabindex="0" data-t="${types}" data-k="${key}" data-l="${ts.join('＋')}" style="--rc:var(--c-${RH[ts[0]][0]})">${inner}</span>`})}
function showRh(types,key,text){const p=$('#pop');p.innerHTML=`<h3>修辭：${types.join('＋')}</h3>${types.map(t=>`<div><b style="color:var(--c-${RH[t][0]})">${t}</b>：${RH[t][1]}</div>`).join('')}<div class="why">${RHWHY[key]||''}</div><div class="row"><button id="pSay">🔊 念這句</button><button id="pClose">關閉</button></div>`;p.classList.add('on');$('#pSay').onclick=()=>speak(text);$('#pClose').onclick=()=>p.classList.remove('on');}
function bindRh(c){c.querySelectorAll('.rh').forEach(r=>{const f=e=>{if(!rhOn)return;e.stopPropagation();showRh(r.dataset.t.split(','),r.dataset.k,r.textContent)};r.addEventListener('click',f);r.addEventListener('keydown',e=>{if(e.key==='Enter')f(e)})});}
function rhToggle(){rhOn=!rhOn;$('#txt').classList.toggle('rhon',rhOn);$('#rhleg').classList.toggle('legon',rhOn);$('#rhBtn').classList.toggle('on',rhOn);$('#rhBtn').setAttribute('aria-pressed',rhOn);if(rhOn&&!$('#txt .rh')){const d=document.createElement('div');d.className='badge';d.textContent='這一頁沒有標示修辭，換一段看看！';Object.assign(d.style,{left:'50%',top:'45%',transform:'translateX(-50%)'});$('#ov').appendChild(d);setTimeout(()=>d.remove(),2000)}}
function buildRh(){const c=$('#rcards');c.innerHTML='';Object.entries(RH).forEach(([n,[k,d]])=>{const b=document.createElement('button');b.className='rcard';b.style.setProperty('--rc',`var(--c-${k})`);b.innerHTML=`<h4>${n}</h4><p>${d}</p>`;b.onclick=()=>{$$('.rcard').forEach(x=>x.classList.toggle('on',x===b));const ex=RQ.filter(r=>r[1]===n&&r[2]);const pr=RQ.find(r=>r[1]===n&&!r[2]);$('#rex').innerHTML=ex.length?`<b style="color:var(--c-${k})">課文裡的${n}：</b>${ex.map(e=>`<div class="q">${e[0]}</div>`).join('')}`:`<b style="color:var(--c-${k})">這一課沒有用到「${n}」，看看這個例子：</b><div class="q">${pr[0]}</div>`;speak(n+'。'+d)};c.appendChild(b)});$('#rex').innerHTML='<div style="font-size:3vh;color:#55636A">點上面的卡片，認識四種修辭；或按下方「考考你」來練習。</div>';}
function rhQuiz(){rqList=[...RQ].sort(()=>Math.random()-.5);rqi=0;rhAsk();}
function rhAsk(){const ex=$('#rex');if(rqi>=rqList.length){ex.innerHTML='<div class="q">全部完成！🎉</div>';speak('全部完成，你好棒');return}
  const [s,a,fromText]=rqList[rqi];ex.innerHTML=`<div><span class="tagq" style="background:${fromText?'#2F6F78':'#9AA6B5'}">${fromText?'課文':'練習題'}</span>第 ${rqi+1}／${rqList.length} 題：這句用了什麼修辭？</div><div class="q">${s}</div><div class="opts"></div><div class="fb"></div>`;speak(s);
  Object.entries(RH).forEach(([n,[k]])=>{const b=document.createElement('button');b.textContent=n;b.style.setProperty('--rc',`var(--c-${k})`);b.onclick=()=>{const fb=ex.querySelector('.fb');if(n===a){fb.textContent='答對了！這是「'+a+'」⭐';fb.style.color='#2E8B57';speak('答對了');rqi++;setTimeout(rhAsk,1500)}else{fb.textContent='再想想看：句子裡有沒有「像」「！」「？」，或是把東西寫成人？';fb.style.color='#C8362B'}};ex.querySelector('.opts').appendChild(b)});}
$('#rhBtn').onclick=rhToggle;
S.push({sc:'rh',tag:'修辭小教室',no:'統整',text:'認識四種修辭：擬人、譬喻、感嘆、設問。點上面的卡片看說明和課文例句，再按「考考你」練習。也可以回到課文，打開右上方的「🔍 修辭」，找找句子藏在哪裡！',enter(){buildRh()},acts:[['🎯 考考你',rhQuiz],['📖 看說明',buildRh]]});

/* ---------- navigation ---------- */
const TABS=[['豆粥婆婆',0,1],['遇見老虎',1,2],['哀求',2,3],['哭了',3,4],['來幫忙',4,5],['商量',5,6],['老虎來了',6,7],['趕走老虎',7,8],['從此',8,9],['誰先出手',9],['人事時地物',10]];
TABS.push(['修辭小教室',S.length-1]);TABS.forEach(([n,i,num],k)=>{if(k===9)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">｜</span>');else if(k>0&&k<9)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">›</span>');
  const b=document.createElement('button');b.innerHTML=(num?`<i>${num}</i>`:'')+n;b.onclick=()=>go(i);b.dataset.i=i;$('#tabs').appendChild(b)});
let cur=0,seqIdx=0;
function resetSimple(){$('#S1').setAttribute('class','');$('#mapCard').style.opacity=0;$('#S2').setAttribute('class','');const g=$('#gm2').querySelector('g');g.setAttribute('class','');}
function go(i){
  stopAll();cur=Math.max(0,Math.min(S.length-1,i));const st=S[cur];
  $$('.scene').forEach(s=>s.classList.toggle('on',s.id==='sc-'+st.sc));
  resetSimple();
  if(st.house){houseReset();BASE[st.house]();instantDone();}
  const tc=$('#tchip');if(st.time){tc.textContent='🕒 '+st.time;tc.classList.add('on')}else tc.classList.remove('on');
  $('#ptag').textContent=st.tag;$('#pno').textContent=st.no;
  const t=$('#txt');t.classList.toggle('long',!!st.long);
  t.innerHTML=rhWrap(st.text).replace(/\[\[(.+?)\]\]/g,(m,w)=>`<span class="v" role="button" tabindex="0" data-w="${w}">${w}</span>`).replace(/\{\{(.+?)\}\}/g,(m,w)=>`<span class="v x" role="button" tabindex="0" data-w="${w}">${w}</span>`);
  t.querySelectorAll('.v').forEach(v=>{v.onclick=()=>showVocab(v.dataset.w);v.onkeydown=e=>{if(e.key==='Enter')showVocab(v.dataset.w)}});
  bindRh(t);t.scrollTop=0;t.scrollLeft=0;
  const A=$('#acts');A.innerHTML='';seqIdx=0;
  if(st.seq){
    const btns=[];
    const run=k=>{if(k!==seqIdx)return false;st.seq[k][1]();btns[k].classList.add('done');seqIdx++;return true};
    const nb=document.createElement('button');nb.className='main';nb.textContent='▶ 下一個動作';nb.onclick=()=>{if(seqIdx<st.seq.length)run(seqIdx)};A.appendChild(nb);
    const ab=document.createElement('button');ab.textContent='🎬 連續演出';ab.onclick=()=>{go(cur);const S2=S[cur];let d=0;S2.seq.forEach((x,k)=>{later(()=>{if(seqIdx===k){x[1]();$$('#acts .sq')[k].classList.add('done');seqIdx++}},d);d+=k===0?2800:2300})};A.appendChild(ab);
    st.seq.forEach(([l],k)=>{const b=document.createElement('button');b.className='sq';b.textContent=l;b.onclick=()=>{if(!run(k))temp('要照順序喔！先按「'+st.seq[seqIdx][0]+'」',{left:'50%',top:'45%',transform:'translateX(-50%)'},'badge',1800)};A.appendChild(b);btns.push(b)});
    const rb=document.createElement('button');rb.textContent='🔁 重來';rb.onclick=()=>go(cur);A.appendChild(rb);
  } else st.acts.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;A.appendChild(b)});
  let active=0;TABS.forEach(([n,ti])=>{if(cur>=ti)active=ti});
  $$('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===active));
  $('#prev').disabled=cur===0;$('#next').disabled=cur===S.length-1;
  st.enter&&st.enter();
}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#say').onclick=()=>speak(S[cur].text);
document.addEventListener('keydown',e=>{if(e.target.closest('.v,.cell'))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
go(0);
</script>
