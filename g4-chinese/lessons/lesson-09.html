<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第九課 阿白觀察記｜課文動起來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --bg:#E5EDDC; --panel:#FFFFFF; --ink:#22301F; --soft:#5E6E59;
  --leaf:#4A9A3C; --bark:#7A5A2A; --gold:#E8A33A; --red:#C9463A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#172015; --panel:#222E1F; --ink:#EDF3EA; --soft:#AFC0A9; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--kai);background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:1.2vw;padding:1vh 1.6vw .8vh;flex-wrap:wrap}
h1{margin:0;font-size:4.4vh;color:var(--leaf);letter-spacing:.12em;white-space:nowrap}
h1 small{font-size:.5em;color:var(--soft);letter-spacing:.05em;margin-right:.4em}
nav{display:flex;gap:.15vw;flex-wrap:wrap;align-items:center}
nav button{font:inherit;font-size:2.2vh;padding:.5vh .6vw;border-radius:10px;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:.25em}
nav button i{font-style:normal;display:inline-grid;place-items:center;width:2.5vh;height:2.5vh;border-radius:50%;background:var(--leaf);color:#fff;font-size:1.5vh}
nav button.on{background:var(--panel);border-color:var(--leaf);color:var(--leaf);font-weight:700}
nav .sep{color:var(--soft);font-size:1.8vh}
main{display:grid;grid-template-columns:1fr 50vh;gap:1.2vw;padding:0 1.6vw 1.4vh;min-height:0}
.stagewrap{display:grid;grid-template-rows:1fr auto;gap:1vh;min-height:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#DCE7D2;min-height:0}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene>svg{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none;z-index:5}
#tchip{position:absolute;right:2%;top:3%;z-index:4;background:#22301F;color:#fff;border-radius:999px;padding:.5vh 1.2vw;font-size:2.6vh;font-weight:700;display:none}
#tchip.on{display:block;animation:pop .4s}
.acts{display:flex;flex-wrap:wrap;gap:.6vw;min-height:6vh;align-items:center}
.acts button{font:inherit;font-size:2.5vh;padding:.8vh 1.2vw;border-radius:999px;border:3px solid var(--leaf);background:var(--panel);color:var(--ink);cursor:pointer}
.acts button:hover{background:var(--leaf);color:#fff}
button:focus-visible,.v:focus-visible,.cell:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
aside{background:var(--panel);border-radius:20px;padding:1.6vh 1.4vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:1vh;min-height:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh;color:var(--soft)}
.ptitle b{color:var(--leaf);font-size:1.15em}
.txt{writing-mode:vertical-rl;font-size:3.9vh;line-height:1.8;letter-spacing:.05em;width:100%;height:100%;min-height:0;overflow:auto;display:block}
.txt.long{font-size:3.4vh}
.v{border:2px solid var(--gold);border-radius:6px;cursor:pointer;color:#1F6FA0;padding:.1em 0}
.v.x{border-style:dashed;border-color:#9AA6B5;color:inherit}
@media (prefers-color-scheme: dark){ .v{color:#86C9F0} }
.pnav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.8vh}
.pnav button{font:inherit;font-size:2.6vh;padding:1vh 0;border-radius:12px;border:2px solid var(--soft);background:transparent;color:var(--ink);cursor:pointer}
.pnav .say{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:700}
.pnav button:disabled{opacity:.35}
#pop{position:fixed;left:3vw;bottom:13vh;max-width:48vw;background:#fff;color:#22301F;border:4px solid var(--gold);border-radius:16px;padding:1.4vh 1.6vw;font-size:3vh;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:20}
#pop.on{display:block;animation:pop .3s}
#pop h3{margin:0 0 .4vh;color:#3B7F30;font-size:1.25em}
#pop .row{display:flex;gap:1vw;margin-top:.8vh}
#pop button{font:inherit;font-size:.85em;border-radius:10px;border:2px solid #3B7F30;background:#fff;color:#3B7F30;padding:.3vh 1vw;cursor:pointer}

.badge{position:absolute;background:#fff;color:#22301F;border:4px solid var(--leaf);border-radius:14px;padding:.6vh 1.1vw;font-size:2.9vh;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.6,1);white-space:nowrap}
.badge.gold{border-color:var(--gold)}.badge.red{border-color:var(--red)}
.badge small{display:block;font-weight:400;font-size:.78em;color:#4F5E4A;white-space:normal;max-width:40vw}
.bub{position:absolute;font-size:4.8vh;font-weight:700;color:#fff;-webkit-text-stroke:2px #3B7F30;paint-order:stroke fill;animation:floatup 1.9s ease-out forwards}
.bub.r{-webkit-text-stroke-color:#C9463A}
@keyframes floatup{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1)}to{transform:translateY(-90px);opacity:0}}
.huge{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:15vh;font-weight:700;color:#fff;-webkit-text-stroke:4px #E8A33A;paint-order:stroke fill;animation:ahh 1.8s ease-out forwards;white-space:nowrap}
@keyframes ahh{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.lbl{font-family:var(--kai);font-weight:700}

/* bird */
.b-in,.b-body,.b-wing,.b-jaw,.b-legs{transform-box:fill-box}
.b-wing{transform-origin:15% 40%}
.b-jaw{transform-origin:100% 0}
.b-body{transform-origin:50% 60%;transition:transform .6s}
.b-in{transition:transform .6s}
.b-fan{display:none}
.sing .b-jaw,.singing .b-jaw{animation:jaw .16s ease-in-out infinite alternate}
@keyframes jaw{to{transform:rotate(-24deg)}}
.flap .b-wing,.flying .b-wing{animation:flapw .14s ease-in-out infinite alternate}
@keyframes flapw{from{transform:rotate(10deg)}to{transform:rotate(-55deg)}}
.low .b-in{transform:translateY(10px)}
.fan .b-fan{display:inline}.fan .b-tail{display:none}
.line .b-body{transform:rotate(-17deg)}
.flutter .b-wing{animation:flut .07s linear infinite alternate}
@keyframes flut{from{transform:rotate(4deg)}to{transform:rotate(-14deg)}}
.shuffle .b-in{animation:shuf .25s ease-in-out infinite alternate}
.low.shuffle .b-in{animation:shufl .25s ease-in-out infinite alternate}
@keyframes shuf{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes shufl{from{transform:translate(-6px,10px)}to{transform:translate(6px,10px)}}
.glowpart{filter:drop-shadow(0 0 6px #FFD23F) drop-shadow(0 0 2px #E8A33A)}

/* scene bits */
#skyDawn{opacity:0;transition:opacity 2.5s}
.dawn #skyDawn{opacity:1}
#kSit{display:none}.up #kSit{display:inline}.up #kSleep{display:none}
#hourH,#minH{transition:transform 2.4s ease-in-out;transform-box:view-box;transform-origin:180px 140px}
.dawn #hourH{transform:rotate(165deg)}.dawn #minH{transform:rotate(360deg)}
.zz{animation:zz 2s ease-out infinite}
@keyframes zz{from{transform:translate(0,0);opacity:0}30%{opacity:1}to{transform:translate(30px,-50px);opacity:0}}
.up .zz{display:none}
.lab{display:none}
.hl-cap #lCap,.hl-shirt #lShirt,.hl-jacket #lJacket{display:inline}
#v2q{display:none}.ask #v2q{display:inline}
#strline{display:none}.line #strline{display:inline}
#book .pg{transform-box:fill-box;transition:transform 1s}
#book .pgR{transform-origin:0 50%;transform:scaleX(0)}
.bopen #book .pgR{transform:scaleX(1)}
.mo{transition:fill .4s}.mo.on{fill:#F2C14E}
#fem,#hearts4{opacity:0;transition:opacity .8s}
.court #fem,.court #hearts4{opacity:1}
.heart{animation:hrt 1.8s ease-out infinite}
@keyframes hrt{from{transform:translateY(0);opacity:0}30%{opacity:1}to{transform:translateY(-60px);opacity:0}}
#mate5{opacity:0;transition:opacity .8s}
.pair #mate5{opacity:1}
.ns{opacity:0;transition:opacity .6s}.ns.on{opacity:1}
#cover5{transition:opacity 1.2s}.reveal #cover5{opacity:.15}
#nestGlow{opacity:0;transition:opacity .8s}.reveal #nestGlow{opacity:1}
#scope{transition:r 1.2s ease-out}
#scopeIn{filter:blur(8px);transition:filter 1.6s}
.focus #scopeIn{filter:none}
.egg.hi .eggb{stroke:#E8A33A;stroke-width:5}
#plastic.hi{animation:pls .5s ease-in-out 6 alternate}
@keyframes pls{to{opacity:.3}}
.chick{transform-box:fill-box;transform-origin:50% 100%}
.chicks .chick{animation:beg .35s ease-in-out infinite alternate}
.chick:nth-child(2){animation-delay:.15s!important}
@keyframes beg{from{transform:scaleY(.9)}to{transform:scaleY(1.12)}}
#chickG{opacity:0;transition:opacity .6s}.chicks #chickG{opacity:1}
#kid7 .kidbody{transition:transform 1.4s ease-in-out}
.near #kid7 .kidbody{transform:translateX(230px)}
.back #kid7 .kidbody{transform:translateX(40px)}
#thunderLine{opacity:0;transition:opacity .8s}.pool #thunderLine{opacity:1}
#youngs .yb{transition:transform 2.6s ease-in,opacity 2.6s}
.fledge #youngs .yb{transform:translate(500px,-420px);opacity:0}
#youngs .yb:nth-child(2){transition-delay:.5s}#youngs .yb:nth-child(3){transition-delay:1s}
#par8{transition:transform 3s ease-in,opacity 3s}
.leave #par8{transform:translate(-700px,-500px);opacity:0}
#miss{opacity:0;transition:opacity 1s}.missing #miss{opacity:1}

/* html scenes */
.html{background:linear-gradient(#EAF1E2,#F8FBF5)}
.sounds{position:absolute;inset:4%;display:grid;grid-template-columns:repeat(3,1fr);gap:2vh}
.scard{background:#fff;border-radius:20px;border:4px solid #4A9A3C;padding:2vh 1.2vw;display:flex;flex-direction:column;align-items:center;gap:1.2vh;color:#22301F;text-align:center}
.scard .nm{font-size:4.6vh;font-weight:700;color:#3B7F30}
.scard .ds{font-size:2.8vh}
.scard button{font:inherit;font-size:2.8vh;border-radius:999px;border:3px solid #4A9A3C;background:#4A9A3C;color:#fff;padding:.8vh 1.6vw;cursor:pointer}
.scard .rv{font:inherit;font-size:2.4vh;background:#fff;color:#3B7F30}
.scard .ans{font-size:2.6vh;line-height:1.5;background:#FFF2D6;border-radius:12px;padding:1vh .8vw;display:none}
.scard .ans.on{display:block;animation:pop .4s}
.scard .em{font-size:9vh;line-height:1}
.track{position:absolute;left:3%;right:3%;top:4%;display:flex;gap:.8%;align-items:center}
.slot{flex:1;height:13vh;border:3px dashed #8AA083;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.2vh;color:#22301F;background:rgba(255,255,255,.6);text-align:center;padding:.4vh;line-height:1.25}
.slot b{font-size:3.4vh}
.slot.done{border:3px solid #4A9A3C;background:#fff;animation:pop .4s}
.arrow{font-size:2.6vh;color:#8AA083}
.cards{position:absolute;left:6%;right:6%;top:24%;bottom:5%;display:grid;grid-template-columns:repeat(3,1fr);gap:2vh}
.card{font:inherit;border:4px solid #7A5A2A;border-radius:18px;background:#fff;color:#22301F;font-size:3vh;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5vh;padding:1vh;line-height:1.35}
.card span{font-size:6vh}
.card.used{visibility:hidden}
.card.bad{animation:shake .12s 4;border-color:#999}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.rtable{position:absolute;inset:21% 2.5% 2.5%;display:none;grid-template-columns:18% 1fr 30%;gap:.6vh;font-size:2.4vh;color:#22301F;overflow:auto}
.rtable.on{display:grid}
.rtable div{background:#fff;border-radius:10px;padding:.5vh .7vw;display:flex;align-items:center;line-height:1.35}
.rtable .h{background:#4A9A3C;color:#fff;font-weight:700;justify-content:center}
.rtable .p{font-weight:700;color:#7A5A2A;justify-content:center;text-align:center}
.rtable .f{color:#7A4A00;background:#FFF2D6}
.wgrid{position:absolute;inset:4% 4%;display:grid;grid-template-columns:13% 1fr;grid-template-rows:repeat(5,1fr);gap:1.2vh;font-size:3vh;color:#22301F}
.wgrid .k{display:flex;align-items:center;justify-content:center;font-size:5.4vh;font-weight:700;color:#fff;background:#4A9A3C;border-radius:14px}
.cell{position:relative;background:#fff;border-radius:14px;padding:.6vh 1.4vw;display:flex;align-items:center;cursor:pointer;line-height:1.45;overflow:hidden}
.cell .cover{position:absolute;inset:0;background:#F2C14E;display:flex;align-items:center;justify-content:center;font-size:3vh;color:#6A4A00;transition:transform .45s}
.cell.open .cover{transform:translateY(-102%)}
.quiz{position:absolute;inset:0;background:rgba(23,32,21,.84);display:none;align-items:center;justify-content:center;z-index:8}
.quiz.on{display:flex}
.qbox{background:#fff;color:#22301F;border-radius:20px;padding:3vh 3vw;text-align:center;min-width:55%}
.qword{font-size:6.6vh;font-weight:700;color:#7A5A2A;margin:1vh 0 2vh}
.qbtns{display:flex;gap:1.2vw;justify-content:center}
.qbtns button{font:inherit;font-size:5vh;width:11vh;height:11vh;border-radius:50%;border:4px solid #4A9A3C;background:#fff;color:#3B7F30;cursor:pointer}
.qfb{font-size:3.4vh;min-height:5vh;margin-top:2vh}
.qbox .close{font:inherit;font-size:2.4vh;margin-top:1vh;background:none;border:2px solid #999;border-radius:10px;padding:.4vh 1.2vw;cursor:pointer}

@media (max-width:820px), (max-aspect-ratio:1/1){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  .stage{height:58vh}
  .txt,.txt.long{writing-mode:horizontal-tb;height:auto;font-size:21px}
  .acts button,.pnav button,nav button{font-size:15px}
  h1{font-size:26px}
  .sounds{grid-template-columns:1fr;overflow:auto}
}
@media (prefers-reduced-motion: reduce){ .zz,.heart{animation:none} }

/* ===== 修辭 ===== */
:root{--c-p:#2E8B57;--c-m:#8E5AD6;--c-e:#D9342B;--c-q:#2E6FB3}
#rhBtn{font:inherit;font-size:2.2vh;border-radius:999px;border:2px solid #8E5AD6;background:transparent;color:var(--ink);padding:.3vh .8vw;cursor:pointer}
#rhBtn.on{background:#8E5AD6;color:#fff}
.rh{border-radius:6px;transition:background .3s}
.rhon .rh{cursor:pointer;background:color-mix(in srgb,var(--rc) 18%,transparent);box-shadow:inset -3px 0 0 var(--rc)}
.rhon .rh::before{content:attr(data-l);font-size:.5em;background:var(--rc);color:#fff;border-radius:4px;padding:.1em .15em;margin-bottom:.2em;font-weight:700;letter-spacing:0}
.rhleg{grid-column:1/-1;display:none;gap:.4vw;font-size:2vh;flex-wrap:wrap;align-items:center}
.rhleg.legon{display:flex}
.rhleg span{color:#fff;border-radius:6px;padding:.1vh .5vw}
.rhleg small{color:var(--soft)}
#pop .why{background:#F3EEFF;border-radius:10px;padding:.6vh .8vw;margin-top:.6vh;font-size:.92em}
.rcards{position:absolute;inset:3% 3% auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw}
.rcard{background:#fff;border-radius:16px;border:4px solid var(--rc);padding:1.2vh .8vw;color:#222;cursor:pointer;font:inherit;text-align:left}
.rcard h4{margin:0 0 .6vh;color:var(--rc);font-size:3.6vh}
.rcard p{margin:0;font-size:2.3vh;line-height:1.5}
.rcard.on{background:color-mix(in srgb,var(--rc) 12%,#fff)}
.rex{position:absolute;left:3%;right:3%;top:42%;bottom:4%;background:#fff;border-radius:16px;padding:2vh 2vw;color:#222;font-size:3vh;line-height:1.7;overflow:auto}
.rex .q{font-size:3.8vh;font-weight:700;margin:1vh 0 2vh}
.rex .opts{display:flex;gap:1vw;flex-wrap:wrap}
.rex .opts button{font:inherit;font-size:3.6vh;padding:1vh 2vw;border-radius:16px;border:4px solid var(--rc);background:#fff;color:var(--rc);cursor:pointer;font-weight:700}
.rex .fb{font-size:3vh;min-height:4.5vh;margin-top:1.6vh}
.rex .tagq{font-size:2.2vh;color:#fff;border-radius:6px;padding:.1vh .6vw;margin-right:.6vw}
@media (max-width:820px), (max-aspect-ratio:1/1){.rcards{grid-template-columns:repeat(2,1fr)}.rex{top:52%}}
a.hall-back{position:fixed;z-index:40;top:0;right:0;font-family:var(--kai);font-size:1.7vh;line-height:1.2;padding:.45vh .8vw;white-space:nowrap;background:var(--panel);color:var(--soft);text-decoration:none;border:1px solid var(--soft);border-top:0;border-right:0;border-bottom-left-radius:12px}a.hall-back:hover,a.hall-back:focus-visible{color:var(--ink)}
</style>
</head>
<body>
<a class="hall-back" href="../">← 回課文大廳</a>
<header>
  <h1><small>第九課</small>阿白觀察記</h1>
  <nav id="tabs"></nav>
</header>

<main>
  <div class="stagewrap">
    <div class="stage" id="stage">

      <!-- 1 清晨歌聲 -->
      <div class="scene" id="sc-1">
        <svg id="v1" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3A66"/><stop offset="1" stop-color="#6A6F96"/></linearGradient>
            <linearGradient id="dawnG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FB7DE"/><stop offset=".7" stop-color="#F6C9A0"/><stop offset="1" stop-color="#F7DDB8"/></linearGradient>
            <clipPath id="win1"><rect x="380" y="34" width="590" height="420"/></clipPath>
          </defs>
          <g clip-path="url(#win1)">
            <rect x="0" y="0" width="1000" height="560" fill="url(#night)"/>
            <rect id="skyDawn" x="0" y="0" width="1000" height="560" fill="url(#dawnG)"/>
            <g id="out1"></g>
          </g>
          <path fill-rule="evenodd" d="M0,0 H1000 V560 H0Z M380,34 H970 V454 H380Z" fill="#EFE6D6"/>
          <rect x="380" y="34" width="590" height="420" fill="none" stroke="#B08A5A" stroke-width="14"/>
          <line x1="675" y1="34" x2="675" y2="454" stroke="#B08A5A" stroke-width="10"/>
          <circle cx="180" cy="140" r="62" fill="#fff" stroke="#7A5A2A" stroke-width="6"/>
          <g font-size="16" text-anchor="middle" fill="#555" class="lbl"><text x="180" y="96">12</text><text x="226" y="146">3</text><text x="180" y="196">6</text><text x="134" y="146">9</text></g>
          <line id="hourH" x1="180" y1="140" x2="180" y2="106" stroke="#333" stroke-width="7" stroke-linecap="round" style="transform:rotate(120deg)"/>
          <line id="minH" x1="180" y1="140" x2="180" y2="92" stroke="#C9463A" stroke-width="4" stroke-linecap="round" style="transform:rotate(300deg)"/>
          <circle cx="180" cy="140" r="5" fill="#333"/>
          <rect x="0" y="470" width="1000" height="90" fill="#CDB896"/>
          <rect x="10" y="420" width="360" height="90" rx="12" fill="#8AB0D8"/>
          <rect x="10" y="396" width="34" height="114" rx="8" fill="#7A5A2A"/>
          <g id="kSleep">
            <ellipse cx="90" cy="410" rx="44" ry="18" fill="#fff"/>
            <circle cx="96" cy="396" r="22" fill="#F6CFA8"/><path d="M74,392 q4,-22 24,-22 q18,2 20,18 q-14,-8 -44,4z" fill="#3A2A20"/>
            <path d="M88,398 q5,3 10,0 M102,398 q5,3 10,0" stroke="#333" stroke-width="2" fill="none"/>
            <path d="M118,410 Q240,380 370,420 L370,470 L118,470Z" fill="#F2A7A0"/>
            <text class="zz" x="130" y="370" font-size="30" fill="#5B6BA0">Z</text><text class="zz" x="150" y="360" font-size="22" fill="#5B6BA0" style="animation-delay:.8s">z</text>
          </g>
          <g id="kSit">

function tone(t0,f1,f2,dur,vol=.16){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+.03);}

const VOC={
 "急促":"很快、很急，一聲接著一聲。",
 "不得不":"一定要，沒有別的辦法。",
 "振動":"很快的上下或來回擺動。",
 "碎步":"小而快的腳步。",
 "舞者":"跳舞的人。",
 "舞林高手":"很會跳舞的高手。",
 "白頭翁":"臺灣常見的鳥，頭後面有一撮白毛，好像戴著白色毛帽。",
 "求偶":"動物找另一半，想辦法吸引對方。",
 "黃褐色":"黃中帶一點咖啡的顏色，像乾草的顏色。",
 "巧克力色":"像巧克力一樣的深咖啡色。",

 "凶":"很兇、不友善，讓人害怕。",
 "一飛沖天":"一下子往上高高的飛起來。",
 "繞圈":"一圈一圈的轉。",
 "衝":"很快、很用力的往前（或往下）飛過來。",
 "雷池":"「不敢越雷池一步」，是說不敢超過一定的範圍。",
 "招牌":"最有名、最有代表性的。",
 "豐滿":"又多又飽滿。",
 "不告而別":"沒有說再見，就離開了。",

 {sc:'8',tag:'告別',no:'第8段',time:'夏天的尾聲',long:1,text:'隨著夏天到了尾聲，阿白又唱回[[招牌]]三連音「巧克力」——與求偶時不同——節奏輕快分明。幼鳥們長出[[豐滿]]的羽毛後，很快就不見鳥影，(@擬人|a9|阿白也{{不告而別}}了@)。(@譬喻|a10|雖然少了[[擾人]]的「鬧鐘」@)，我卻忍不住想念起牠們，想念觀察阿白帶來的樂趣。',

/* ===== 修辭 ===== */
function rhStrip(t){return String(t).replace(/\(@[^|@]+\|[^|@]+\|/g,'').replace(/@\)/g,'')}
const RH={'擬人':['p','把不是人的東西，寫得像人一樣：會說話、會感覺、會做事。'],'譬喻':['m','用另一樣相像的東西來比方，常用「像、好像、有如、就像、是」。'],'感嘆':['e','用「！」或「啊、呀、唉、哇……」，表達強烈的感情，像高興、驚訝、難過。'],'設問':['q','用問句引起注意，或說出心裡的疑問；有時自己問、自己答，有時問了不回答。']};
const RHWHY={"a1": "鳥叫本來只是叫聲，作者說阿白「熱情」「準時」的唱歌，把牠寫得像人一樣。", "a2": "「唉！」表達被吵醒、不得不起床的無奈。", "a3": "把阿白的羽毛說成上衣、夾克和毛帽，好像牠是會穿衣服的人；也是把羽毛拿衣服來比方。", "a4": "作者用問句說出心裡的疑問，也引起讀者的好奇。", "a5": "說阿白是「歌唱家」「舞林高手」，把鳥寫得像人；「呢！」也帶著讚嘆。", "a6": "用「像」把阿白跳舞的樣子，比作舞者和戰鬥機。", "a7": "「哇！」表達發現鳥巢的驚喜。", "a8": "作者用問句說出心中的猜想，自己沒有回答。", "a9": "「不告而別」是說人沒說再見就離開，這裡用在阿白身上。", "a10": "把每天清晨準時叫醒作者的阿白，比作「鬧鐘」，所以加上引號。"};
const RQ=[["「阿白總是穿著灰色上衣，灰綠色夾克，頭上還戴著一頂白色毛帽。」", "擬人", 1], ["「看起來像林間的舞者，又像動力十足的戰鬥機。」", "譬喻", 1], ["「再仔細一看——哇！一個黃褐色的鳥巢……」", "感嘆", 1], ["「不知道是不是阿白特別喜歡它？」", "設問", 1], ["「雖然少了擾人的『鬧鐘』……」", "譬喻", 1], ["「我很好奇牠到底要唱到什麼時候？」", "設問", 1]].concat([['「天上的白雲，像一團團棉花糖。」','譬喻',0],['「太陽公公笑咪咪的看著大家。」','擬人',0],['「哇！雪花好美啊！」','感嘆',0],['「冬天為什麼要多穿衣服？因為天氣冷，容易著涼。」','設問',0],['「小雨點在窗戶上跳舞。」','擬人',0],['「雪地白得像鋪了一層糖粉。」','譬喻',0]]);
let rhOn=false,rqList=[],rqi=0;
function rhWrap(t){return String(t).replace(/\(@([^|@]+)\|([^|@]+)\|(.+?)@\)/g,(m,types,key,inner)=>{const ts=types.split(',');return `<span class="rh" role="button" tabindex="0" data-t="${types}" data-k="${key}" data-l="${ts.join('＋')}" style="--rc:var(--c-${RH[ts[0]][0]})">${inner}</span>`})}
function showRh(types,key,text){const p=$('#pop');p.innerHTML=`<h3>修辭：${types.join('＋')}</h3>${types.map(t=>`<div><b style="color:var(--c-${RH[t][0]})">${t}</b>：${RH[t][1]}</div>`).join('')}<div class="why">${RHWHY[key]||''}</div><div class="row"><button id="pSay">🔊 念這句</button><button id="pClose">關閉</button></div>`;p.classList.add('on');$('#pSay').onclick=()=>speak(text);$('#pClose').onclick=()=>p.classList.remove('on');}
function bindRh(c){c.querySelectorAll('.rh').forEach(r=>{const f=e=>{if(!rhOn)return;e.stopPropagation();showRh(r.dataset.t.split(','),r.dataset.k,r.textContent)};r.addEventListener('click',f);r.addEventListener('keydown',e=>{if(e.key==='Enter')f(e)})});}
function rhToggle(){rhOn=!rhOn;$('#txt').classList.toggle('rhon',rhOn);$('#rhleg').classList.toggle('legon',rhOn);$('#rhBtn').classList.toggle('on',rhOn);$('#rhBtn').setAttribute('aria-pressed',rhOn);if(rhOn&&!$('#txt .rh')){const d=document.createElement('div');d.className='badge';d.textContent='這一頁沒有標示修辭，換一段看看！';Object.assign(d.style,{left:'50%',top:'45%',transform:'translateX(-50%)'});$('#ov').appendChild(d);setTimeout(()=>d.remove(),2000)}}
function buildRh(){const c=$('#rcards');c.innerHTML='';Object.entries(RH).forEach(([n,[k,d]])=>{const b=document.createElement('button');b.className='rcard';b.style.setProperty('--rc',`var(--c-${k})`);b.innerHTML=`<h4>${n}</h4><p>${d}</p>`;b.onclick=()=>{$$('.rcard').forEach(x=>x.classList.toggle('on',x===b));const ex=RQ.filter(r=>r[1]===n&&r[2]);const pr=RQ.find(r=>r[1]===n&&!r[2]);$('#rex').innerHTML=ex.length?`<b style="color:var(--c-${k})">課文裡的${n}：</b>${ex.map(e=>`<div class="q">${e[0]}</div>`).join('')}`:`<b style="color:var(--c-${k})">這一課沒有用到「${n}」，看看這個例子：</b><div class="q">${pr[0]}</div>`;speak(n+'。'+d)};c.appendChild(b)});$('#rex').innerHTML='<div style="font-size:3vh;color:#55636A">點上面的卡片，認識四種修辭；或按下方「考考你」來練習。</div>';}
function rhQuiz(){rqList=[...RQ].sort(()=>Math.random()-.5);rqi=0;rhAsk();}
function rhAsk(){const ex=$('#rex');if(rqi>=rqList.length){ex.innerHTML='<div class="q">全部完成！🎉</div>';speak('全部完成，你好棒');return}
  const [s,a,fromText]=rqList[rqi];ex.innerHTML=`<div><span class="tagq" style="background:${fromText?'#2F6F78':'#9AA6B5'}">${fromText?'課文':'練習題'}</span>第 ${rqi+1}／${rqList.length} 題：這句用了什麼修辭？</div><div class="q">${s}</div><div class="opts"></div><div class="fb"></div>`;speak(s);
  Object.entries(RH).forEach(([n,[k]])=>{const b=document.createElement('button');b.textContent=n;b.style.setProperty('--rc',`var(--c-${k})`);b.onclick=()=>{const fb=ex.querySelector('.fb');if(n===a){fb.textContent='答對了！這是「'+a+'」⭐';fb.style.color='#2E8B57';speak('答對了');rqi++;setTimeout(rhAsk,1500)}else{fb.textContent='再想想看：句子裡有沒有「像」「！」「？」，或是把東西寫成人？';fb.style.color='#C8362B'}};ex.querySelector('.opts').appendChild(b)});}
$('#rhBtn').onclick=rhToggle;
S.push({sc:'rh',tag:'修辭小教室',no:'統整',text:'認識四種修辭：擬人、譬喻、感嘆、設問。點上面的卡片看說明和課文例句，再按「考考你」練習。也可以回到課文，打開右上方的「🔍 修辭」，找找句子藏在哪裡！',enter(){buildRh()},acts:[['🎯 考考你',rhQuiz],['📖 看說明',buildRh]]});

/* ---------- navigation ---------- */
const TABS=[['清晨歌聲',0,1],['穿著',1,2],['跳舞',2,3],['求偶',3,4],['築巢',4,5],['鳥蛋',5,6],['幼鳥',6,7],['告別',7,8],['聲音比一比',8],['時間軸',9],['人事時地物',10]];
TABS.push(['修辭小教室',S.length-1]);TABS.forEach(([n,i,num],k)=>{if(k===8)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">｜</span>');else if(k>0&&k<8)$('#tabs').insertAdjacentHTML('beforeend','<span class="sep">›</span>');
  const b=document.createElement('button');b.innerHTML=(num?`<i>${num}</i>`:'')+n;b.onclick=()=>go(i);b.dataset.i=i;$('#tabs').appendChild(b)});
let cur=0;
function go(i){
  stopAll();cur=Math.max(0,Math.min(S.length-1,i));const st=S[cur];
  $$('.scene').forEach(s=>s.classList.toggle('on',s.id==='sc-'+st.sc));
  resetScenes();
  const tc=$('#tchip');if(st.time){tc.textContent='🕒 '+st.time;tc.classList.add('on')}else tc.classList.remove('on');
  $('#ptag').textContent=st.tag;$('#pno').textContent=st.no;
  const t=$('#txt');t.classList.toggle('long',!!st.long);
  t.innerHTML=rhWrap(st.text).replace(/\[\[(.+?)\]\]/g,(m,w)=>`<span class="v" role="button" tabindex="0" data-w="${w}">${w}</span>`).replace(/\{\{(.+?)\}\}/g,(m,w)=>`<span class="v x" role="button" tabindex="0" data-w="${w}">${w}</span>`);
  t.querySelectorAll('.v').forEach(v=>{v.onclick=()=>showVocab(v.dataset.w);v.onkeydown=e=>{if(e.key==='Enter')showVocab(v.dataset.w)}});
  bindRh(t);t.scrollTop=0;t.scrollLeft=0;
  const A=$('#acts');A.innerHTML='';st.acts.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{ac();f()};A.appendChild(b)});
  let active=0;TABS.forEach(([n,ti])=>{if(cur>=ti)active=ti});
  $$('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===active));
  $('#prev').disabled=cur===0;$('#next').disabled=cur===S.length-1;
  st.enter&&st.enter();
}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#say').onclick=()=>speak(S[cur].text);
document.addEventListener('keydown',e=>{if(e.target.closest('.v,.cell'))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
go(0);
</script>
