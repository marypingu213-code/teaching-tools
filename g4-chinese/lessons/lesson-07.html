<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第七課 到此「藝」遊｜課文動起來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --bg:#E4E8EF; --panel:#FFFFFF; --ink:#1F2733; --soft:#5E6876;
  --indigo:#2C4F8A; --brick:#B5482F; --red:#D9342B; --jade:#4F9470; --gold:#E8A33A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#161C26; --panel:#212A38; --ink:#EDF1F6; --soft:#AAB4C2; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--kai);background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:1.2vw;padding:1vh 1.6vw .8vh;flex-wrap:wrap}
h1{margin:0;font-size:4.4vh;color:var(--indigo);letter-spacing:.1em;white-space:nowrap}
h1 small{font-size:.5em;color:var(--soft);letter-spacing:.05em;margin-right:.4em}
h1 em{font-style:normal;font-size:.45em;color:var(--soft);margin-left:.5em;letter-spacing:0}
nav{display:flex;gap:.2vw;flex-wrap:wrap;align-items:center}
nav button{font:inherit;font-size:2.3vh;padding:.5vh .8vw;border-radius:10px;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:.3em}
nav button i{font-style:normal;display:inline-grid;place-items:center;width:2.6vh;height:2.6vh;border-radius:50%;background:var(--brick);color:#fff;font-size:1.6vh}
nav button.on{background:var(--panel);border-color:var(--indigo);color:var(--indigo);font-weight:700}
nav .sep{color:var(--soft);font-size:2vh}
main{display:grid;grid-template-columns:1fr 50vh;gap:1.2vw;padding:0 1.6vw 1.4vh;min-height:0}
.stagewrap{display:grid;grid-template-rows:1fr auto;gap:1vh;min-height:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#D9DEE5;min-height:0}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene>svg{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none;z-index:5}
.acts{display:flex;flex-wrap:wrap;gap:.7vw;min-height:6vh;align-items:center}
.acts button{font:inherit;font-size:2.6vh;padding:.9vh 1.4vw;border-radius:999px;border:3px solid var(--indigo);background:var(--panel);color:var(--ink);cursor:pointer}
.acts button:hover{background:var(--indigo);color:#fff}
button:focus-visible,.v:focus-visible,.cell:focus-visible,.item:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
aside{background:var(--panel);border-radius:20px;padding:1.6vh 1.4vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:1vh;min-height:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh;color:var(--soft)}
.ptitle b{color:var(--brick);font-size:1.15em}
.txt{writing-mode:vertical-rl;font-size:4.2vh;line-height:1.85;letter-spacing:.06em;width:100%;height:100%;min-height:0;overflow:auto;display:block}
.txt.long{font-size:3.45vh}
.v{border:2px solid var(--gold);border-radius:6px;cursor:pointer;color:#1F6FA0;padding:.1em 0}
.v.x{border-style:dashed;border-color:#9AA6B5;color:inherit}
@media (prefers-color-scheme: dark){ .v{color:#86C9F0} }
.pnav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.8vh}
.pnav button{font:inherit;font-size:2.6vh;padding:1vh 0;border-radius:12px;border:2px solid var(--soft);background:transparent;color:var(--ink);cursor:pointer}
.pnav .say{background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:700}
.pnav button:disabled{opacity:.35}
#pop{position:fixed;left:3vw;bottom:13vh;max-width:48vw;background:#fff;color:#1F2733;border:4px solid var(--gold);border-radius:16px;padding:1.4vh 1.6vw;font-size:3vh;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:20}
#pop.on{display:block;animation:pop .3s}
#pop h3{margin:0 0 .4vh;color:#2C4F8A;font-size:1.25em}
#pop .row{display:flex;gap:1vw;margin-top:.8vh}
#pop button{font:inherit;font-size:.85em;border-radius:10px;border:2px solid #2C4F8A;background:#fff;color:#2C4F8A;padding:.3vh 1vw;cursor:pointer}

.badge{position:absolute;background:#fff;color:#1F2733;border:4px solid var(--indigo);border-radius:14px;padding:.6vh 1.1vw;font-size:3vh;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.6,1);white-space:nowrap}
.badge.gold{border-color:var(--gold)}
.badge.red{border-color:var(--red)}
.badge.jade{border-color:var(--jade)}
.badge small{display:block;font-weight:400;font-size:.8em;color:#4B5563}
.bub{position:absolute;font-size:5vh;font-weight:700;color:#fff;-webkit-text-stroke:2px #D9342B;paint-order:stroke fill;animation:floatup 1.8s ease-out forwards}
@keyframes floatup{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1)}to{transform:translateY(-90px);opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.lbl{font-family:var(--kai);font-weight:700}

/* shared svg */
.kidbody{transform-box:fill-box}
.bob .kidbody{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.bigeyes .eyes{display:none}.bigeyes .eyes2{display:inline}
.eyes2{display:none}
.spark{animation:twinkle 1.2s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.1;transform:scale(.5)}}
.spk{transform-box:fill-box;transform-origin:center}

/* go */
#bus{transition:transform 3s cubic-bezier(.25,.8,.3,1);transform:translateX(-420px)}
.arrived #bus{transform:translateX(0)}
#bus .wheel{transform-box:fill-box;transform-origin:center}
.moving #bus .wheel{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#goKid,#mood{opacity:0;transition:opacity .6s}
.arrived #goKid{opacity:1}
.moodon #mood{opacity:1}
#sunRays{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
#yimap{display:none}.showmap #yimap{display:inline}
.pinring{animation:ring 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
#grayCloud{transition:opacity .6s}
.skyhi #grayCloud{animation:pulseO 0.7s 3}
@keyframes pulseO{50%{opacity:.4}}

/* street */
.lantern{transform-box:fill-box;transform-origin:50% 0;animation:swing 2.4s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.lantern .lb{fill:#B8261F;transition:fill .4s}
.lantern.lit .lb{fill:#FF5A3C;filter:drop-shadow(0 0 10px #FFB347)}
#streetSpk{display:none}.wow #streetSpk{display:inline}
.wow #streetBg{animation:flash .9s}
@keyframes flash{30%{filter:brightness(1.35)}}

/* luban */
.item{cursor:pointer}
.item.hi .ped{fill:#F3C563}
#rays{opacity:0;transition:opacity .6s}
.lighton #rays{opacity:1}
#rays g{transform-box:view-box;transform-origin:810px 290px;animation:spin 10s linear infinite}
.lighton #glassBody{filter:drop-shadow(0 0 14px #fff) saturate(1.5)}
.lighton #lamp{fill:#FFE88A}
#lbKid .kidbody{transition:transform 1s}
.linger #lbKid .kidbody{animation:linger 4s ease-in-out}
@keyframes linger{35%{transform:translateX(330px)}55%{transform:translateX(330px)}100%{transform:translateX(0)}}

/* theater */
#curL,#curR{transition:transform 2.2s ease-in-out}
.open #curL{transform:translateX(-470px)}
.open #curR{transform:translateX(470px)}
.actor{transform-box:fill-box;transform-origin:50% 100%}
.dance .actor{animation:hop .45s ease-in-out infinite alternate}
.dance .actor:nth-child(2){animation-delay:.2s}
@keyframes hop{to{transform:translateY(-22px)}}
.flip #flipper{animation:flipit 1.1s ease-in-out 3;transform-origin:50% 60%}
@keyframes flipit{30%{transform:translateY(-70px) rotate(0)}70%{transform:translateY(-70px) rotate(-360deg)}100%{transform:translateY(0) rotate(-360deg)}}
#ropeG,#sweat,#flagG,#notes{display:none}
.rope #ropeG,.rope #sweat,.flag #flagG,.dance #notes{display:inline}
#rw{animation:ropewalk 7s ease-in-out infinite alternate}
@keyframes ropewalk{from{transform:translateX(0)}to{transform:translateX(420px)}}
#rwBody{transform-box:fill-box;transform-origin:50% 100%;animation:wobble 1.1s ease-in-out infinite alternate}
@keyframes wobble{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.drop{animation:dropf 1.2s ease-in infinite}
@keyframes dropf{from{transform:translateY(0);opacity:1}to{transform:translateY(16px);opacity:0}}
.flame{animation:flame 1.4s ease-out infinite}
@keyframes flame{from{transform:translateY(0) scale(1);opacity:.95}to{transform:translateY(-120px) scale(.2);opacity:0}}
.note{animation:noteup 2.4s linear infinite}
@keyframes noteup{from{transform:translateY(0);opacity:0}20%{opacity:1}to{transform:translateY(-140px);opacity:0}}
.heads .hd{transform-box:fill-box;transform-origin:center bottom}
.cheer .hd{animation:hop .3s ease-in-out infinite alternate}

/* river */
#boat{animation:none;transform:translate(500px,500px) scale(1)}
.sail #boat{animation:sail 9s ease-in-out forwards}
@keyframes sail{0%{transform:translate(500px,510px) scale(1);opacity:1}80%{transform:translate(500px,330px) scale(.32);opacity:1}100%{transform:translate(500px,318px) scale(.25);opacity:0}}
.bankL,.bankR{transition:fill 2.5s}
.greener .bankL,.greener .bankR{fill:#3F8A4E}
#creep{opacity:0;transition:opacity 2.5s}
.greener #creep{opacity:1}
.tree{transform-box:fill-box;transform-origin:50% 100%}
.breeze .tree{animation:sway 1.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
#wind{display:none}.breeze #wind{display:inline}
.wl{animation:windgo 2.2s linear infinite}
@keyframes windgo{from{transform:translateX(-200px);opacity:0}30%{opacity:.9}to{transform:translateX(900px);opacity:0}}
#flyer{display:none}.fly #flyer{display:inline}
#flyIn{animation:flyb 2.4s ease-in-out infinite alternate}
@keyframes flyb{from{transform:translate(0,0)}to{transform:translate(60px,-24px)}}
.wing{transform-box:fill-box;animation:flap .35s ease-in-out infinite alternate}
.wing.l{transform-origin:100% 80%}.wing.r{transform-origin:0 80%}
@keyframes flap{to{transform:rotate(-24deg)}}
.wing.r{animation-name:flapr}@keyframes flapr{to{transform:rotate(24deg)}}
#fishG,#birdG{display:none}.fish #fishG,.birds #birdG{display:inline}
.fishj{animation:jump 1.6s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translate(0,40px) rotate(30deg);opacity:0}15%{opacity:1}50%{transform:translate(60px,-60px) rotate(-10deg)}85%{transform:translate(120px,40px) rotate(60deg);opacity:1}}
.bird{animation:birdgo 7s linear infinite}
@keyframes birdgo{from{transform:translateX(-150px)}to{transform:translateX(1150px)}}

/* shop */
.browse #me .kidbody{animation:browse 6s ease-in-out}
@keyframes browse{20%{transform:translateX(-260px)}45%{transform:translateX(240px)}70%{transform:translateX(-200px)}100%{transform:translateX(0)}}
#mates{opacity:0;transition:opacity .6s}.mates #mates{opacity:1}
#joy{display:none}.joy #joy{display:inline}
.item .glow{opacity:0;transition:opacity .3s}.item.hi .glow{opacity:1}

/* home */
#outsky{transition:fill 2s}
#clouds{opacity:0;transition:opacity 3s}
.glowsky #clouds{opacity:1}
.hills{animation:pass 6s linear infinite}
@keyframes pass{from{transform:translateX(0)}to{transform:translateX(-400px)}}
#heartFill{transition:transform 3s ease-out;transform:translateY(160px)}
.full #heartFill{transform:translateY(0)}

/* html scenes */
.html{background:linear-gradient(#E9EEF6,#F7F9FC)}
.track{position:absolute;left:3%;right:3%;top:5%;display:flex;gap:1%;align-items:center}
.slot{flex:1;height:12vh;border:3px dashed #8A96A8;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.6vh;color:#1F2733;background:rgba(255,255,255,.6)}
.slot b{font-size:3.6vh}
.slot.done{border:3px solid #2C4F8A;background:#fff;animation:pop .4s}
.arrow{font-size:3vh;color:#8A96A8}
.cards{position:absolute;left:8%;right:8%;top:30%;bottom:6%;display:grid;grid-template-columns:repeat(3,1fr);gap:2.4vh}
.card{font:inherit;border:4px solid #B5482F;border-radius:18px;background:#fff;color:#1F2733;font-size:3.6vh;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5vh}
.card span{font-size:6vh}
.card.used{visibility:hidden}
.card.bad{animation:shake .12s 4;border-color:#999}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.rtable{position:absolute;inset:22% 3% 3%;display:none;grid-template-columns:16% 1fr 1fr;gap:.7vh;font-size:2.6vh;color:#1F2733;overflow:auto}
.rtable.on{display:grid}
.rtable div{background:#fff;border-radius:10px;padding:.6vh .8vw;display:flex;align-items:center;line-height:1.35}
.rtable .h{background:#2C4F8A;color:#fff;font-weight:700;justify-content:center}
.rtable .p{font-weight:700;color:#B5482F;justify-content:center;text-align:center}
.rtable .f{color:#7A4A00;background:#FFF2D6}
.wgrid{position:absolute;inset:4% 4%;display:grid;grid-template-columns:13% 1fr;grid-template-rows:repeat(5,1fr);gap:1.2vh;font-size:3.1vh;color:#1F2733}
.wgrid .k{display:flex;align-items:center;justify-content:center;font-size:5.4vh;font-weight:700;color:#fff;background:#B5482F;border-radius:14px}
.cell{position:relative;background:#fff;border-radius:14px;padding:.6vh 1.4vw;display:flex;align-items:center;cursor:pointer;line-height:1.45;overflow:hidden}
.cell .cover{position:absolute;inset:0;background:#F2C14E;display:flex;align-items:center;justify-content:center;font-size:3vh;color:#6A4A00;transition:transform .45s}
.cell.open .cover{transform:translateY(-102%)}
.quiz{position:absolute;inset:0;background:rgba(22,28,38,.84);display:none;align-items:center;justify-content:center;z-index:8}
.quiz.on{display:flex}
.qbox{background:#fff;color:#1F2733;border-radius:20px;padding:3vh 3vw;text-align:center;min-width:55%}
.qword{font-size:7vh;font-weight:700;color:#B5482F;margin:1vh 0 2vh}
.qbtns{display:flex;gap:1.2vw;justify-content:center}
.qbtns button{font:inherit;font-size:5vh;width:11vh;height:11vh;border-radius:50%;border:4px solid #2C4F8A;background:#fff;color:#2C4F8A;cursor:pointer}
.qfb{font-size:3.4vh;min-height:5vh;margin-top:2vh}
.qbox .close{font:inherit;font-size:2.4vh;margin-top:1vh;background:none;border:2px solid #999;border-radius:10px;padding:.4vh 1.2vw;cursor:pointer}

@media (max-width:820px), (max-aspect-ratio:1/1){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  .stage{height:58vh}
  .txt,.txt.long{writing-mode:horizontal-tb;height:auto;font-size:21px}
  .acts button,.pnav button,nav button{font-size:16px}
  h1{font-size:26px}
}
@media (prefers-reduced-motion: reduce){
  .lantern,.hills,.spark,.pinring,#sunRays{animation:none}
}

/* ===== 修辭 ===== */
:root{--c-p:#2E8B57;--c-m:#8E5AD6;--c-e:#D9342B;--c-q:#2E6FB3}
#rhBtn{font:inherit;font-size:2.2vh;border-radius:999px;border:2px solid #8E5AD6;background:transparent;color:var(--ink);padding:.3vh .8vw;cursor:pointer}
#rhBtn.on{background:#8E5AD6;color:#fff}
.rh{border-radius:6px;transition:background .3s}
.rhon .rh{cursor:pointer;background:color-mix(in srgb,var(--rc) 18%,transparent);box-shadow:inset -3px 0 0 var(--rc)}
.rhon .rh::before{content:attr(data-l);font-size:.5em;background:var(--rc);color:#fff;border-radius:4px;padding:.1em .15em;margin-bottom:.2em;font-weight:700;letter-spacing:0}
.rhleg{grid-column:1/-1;display:none;gap:.4vw;font-size:2vh;flex-wrap:wrap;align-items:center}
.rhleg.legon{display:flex}
.rhleg span{color:#fff;border-radius:6px;padding:.1vh .5vw}
.rhleg small{color:var(--soft)}
#pop .why{background:#F3EEFF;border-radius:10px;padding:.6vh .8vw;margin-top:.6vh;font-size:.92em}
.rcards{position:absolute;inset:3% 3% auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw}
.rcard{background:#fff;border-radius:16px;border:4px solid var(--rc);padding:1.2vh .8vw;color:#222;cursor:pointer;font:inherit;text-align:left}
.rcard h4{margin:0 0 .6vh;color:var(--rc);font-size:3.6vh}
.rcard p{margin:0;font-size:2.3vh;line-height:1.5}
.rcard.on{background:color-mix(in srgb,var(--rc) 12%,#fff)}
.rex{position:absolute;left:3%;right:3%;top:42%;bottom:4%;background:#fff;border-radius:16px;padding:2vh 2vw;color:#222;font-size:3vh;line-height:1.7;overflow:auto}
.rex .q{font-size:3.8vh;font-weight:700;margin:1vh 0 2vh}
.rex .opts{display:flex;gap:1vw;flex-wrap:wrap}
.rex .opts button{font:inherit;font-size:3.6vh;padding:1vh 2vw;border-radius:16px;border:4px solid var(--rc);background:#fff;color:var(--rc);cursor:pointer;font-weight:700}
.rex .fb{font-size:3vh;min-height:4.5vh;margin-top:1.6vh}
.rex .tagq{font-size:2.2vh;color:#fff;border-radius:6px;padding:.1vh .6vw;margin-right:.6vw}
@media (max-width:820px), (max-aspect-ratio:1/1){.rcards{grid-template-columns:repeat(2,1fr)}.rex{top:52%}}
a.hall-back{position:fixed;z-index:40;top:0;right:0;font-family:var(--kai);font-size:1.7vh;line-height:1.2;padding:.45vh .8vw;white-space:nowrap;background:var(--panel);color:var(--soft);text-decoration:none;border:1px solid var(--soft);border-top:0;border-right:0;border-bottom-left-radius:12px}a.hall-back:hover,a.hall-back:focus-visible{color:var(--ink)}
</style>
</head>
<body>
<a class="hall-back" href="../">← 回課文大廳</a>
<header>
  <h1><small>第七課</small>到此「藝」遊<em>陳磊</em></h1>
  <nav id="tabs"></nav>
</header>

<main>
  <div class="stagewrap">
    <div class="stage" id="stage">

      <!-- 1 出發 -->
      <div class="scene" id="sc-go">
        <svg id="gsvg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="graySky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9DA6B0"/><stop offset="1" stop-color="#D6DADF"/></linearGradient>
          </defs>
          <rect width="1000" height="560" fill="url(#graySky)"/>
          <g id="grayCloud" fill="#8E969F" opacity=".9">
            <ellipse cx="160" cy="90" rx="110" ry="34"/><ellipse cx="230" cy="70" rx="70" ry="34"/>
            <ellipse cx="760" cy="70" rx="120" ry="30"/><ellipse cx="690" cy="58" rx="60" ry="28"/>
            <ellipse cx="460" cy="120" rx="90" ry="22"/>
          </g>
          <path d="M0,330 L120,250 L230,300 L360,210 L500,290 L640,230 L780,300 L900,240 L1000,290 L1000,440 L0,440Z" fill="#7F938A"/>
          <rect y="430" width="1000" height="130" fill="#8DB580"/>
          <rect y="470" width="1000" height="60" fill="#6F7378"/>
          <g fill="#F1F1F1"><rect x="40" y="497" width="60" height="6"/><rect x="200" y="497" width="60" height="6"/><rect x="360" y="497" width="60" height="6"/><rect x="520" y="497" width="60" height="6"/><rect x="680" y="497" width="60" height="6"/></g>
          <g id="gate">
            <rect x="770" y="300" width="24" height="170" fill="#B5482F"/><rect x="940" y="300" width="24" height="170" fill="#B5482F"/>
            <path d="M750,305 Q867,270 985,305 L975,322 L760,322Z" fill="#4A4A4A"/>
            <rect x="790" y="326" width="154" height="44" rx="6" fill="#FFF6E5" stroke="#B5482F" stroke-width="3"/>
            <text x="867" y="357" text-anchor="middle" font-size="24" fill="#B5482F" class="lbl">宜蘭傳藝園區</text>
          </g>
          <g id="bus">

let timers=[],loops=[];

  const b=document.createElement('button');b.innerHTML=(num?`<i>${num}</i>`:'')+n;b.onclick=()=>go(i);b.dataset.i=i;$('#tabs').appendChild(b)});
let cur=0;
function go(i){
  stopAll();cur=Math.max(0,Math.min(S.length-1,i));const st=S[cur];
  $$('.scene').forEach(s=>s.classList.toggle('on',s.id==='sc-'+st.sc));
  resetAll();
  $('#ptag').textContent=st.tag;$('#pno').textContent=st.no;
  const t=$('#txt');t.classList.toggle('long',!!st.long);
  t.innerHTML=rhWrap(st.text).replace(/\[\[(.+?)\]\]/g,(m,w)=>`<span class="v" role="button" tabindex="0" data-w="${w}">${w}</span>`).replace(/\{\{(.+?)\}\}/g,(m,w)=>`<span class="v x" role="button" tabindex="0" data-w="${w}">${w}</span>`);
  t.querySelectorAll('.v').forEach(v=>{v.onclick=()=>showVocab(v.dataset.w);v.onkeydown=e=>{if(e.key==='Enter')showVocab(v.dataset.w)}});
  bindRh(t);t.scrollTop=0;t.scrollLeft=0;
  const A=$('#acts');A.innerHTML='';st.acts.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;A.appendChild(b)});
  let active=0;TABS.forEach(([n,ti])=>{if(cur>=ti)active=ti});
  $$('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===active));
  $('#prev').disabled=cur===0;$('#next').disabled=cur===S.length-1;
  st.enter&&st.enter();
}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#say').onclick=()=>speak(S[cur].text);
document.addEventListener('keydown',e=>{if(e.target.closest('.v,.cell,.item'))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
go(0);
</script>
